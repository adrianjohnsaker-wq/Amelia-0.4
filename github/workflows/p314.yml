name: Build Amelia Android-P3.14 Experiment-1A Side-by-Side APK

on:
  push:
    branches: ["main"]
    paths:
      - "Numogram.py"
      - "P314Experiment1.py"
      - "P314Experiment1Bridge.kt"
      - "P314MainActivity.kt"
      - "P314_Experiment1_Protocol.md"
      - ".github/workflows/p314.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify P3.14 source files exist
        shell: bash
        run: |
          set -euo pipefail

          for source in \
            Numogram.py \
            P314Experiment1.py \
            P314Experiment1Bridge.kt \
            P314MainActivity.kt \
            P314_Experiment1_Protocol.md
          do
            if [[ ! -f "$source" ]]; then
              echo "::error file=$source::Required P3.14 source is absent from repository root."
              find . -maxdepth 1 -type f -printf ' - %f\n' | sort
              exit 1
            fi
            echo "Present: $source ($(wc -c < "$source") bytes)"
          done

          echo
          echo "P3.14 source fingerprints:"
          sha256sum \
            Numogram.py \
            P314Experiment1.py \
            P314Experiment1Bridge.kt \
            P314MainActivity.kt \
            P314_Experiment1_Protocol.md

      - name: Validate Experiment 1A Python protocol
        shell: bash
        run: |
          set -euo pipefail

          python3.8 --version
          python3.8 -m py_compile Numogram.py P314Experiment1.py

          python3.8 - <<'PY'
          import ast
          import re
          from pathlib import Path

          source = Path("P314Experiment1.py").read_text(encoding="utf-8")
          tree = ast.parse(source)

          functions = {
              node.name
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
          }
          required = {
              "protocol_manifest",
              "run_experiment",
              "digital_root",
          }
          missing = required - functions
          assert not missing, sorted(missing)

          assert "TARGET_CODES: Tuple[int, ...] = (333, 137, 666, 360)" in source
          assert "PULSE_AMPLITUDE = 0.20" in source
          assert "BURN_IN_STEPS = 32" in source
          assert "PULSE_STEPS = 24" in source
          assert "WASHOUT_STEPS = 32" in source
          assert "OBSERVATION_STEPS = 64" in source
          assert "FAMILY_RANDOMIZATION_DRAWS = 50_000" in source
          assert "from Numogram import TensorBasedNumogramSystem" in source

          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split(".")[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split(".")[0])

          forbidden_imports = {
              "requests",
              "socket",
              "urllib",
              "httpx",
              "ProcessFieldMemory",
              "RenderTransport",
              "anthropic",
              "openai",
          }
          hits = sorted(imported & forbidden_imports)
          assert not hits, hits

          print("P3.14 Experiment 1A protocol source contract validated")
          PY

      - name: Create isolated Android-P3.14 project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/amelia/p314 \
            app/src/main/java/com/amelia/exp1 \
            app/src/main/python \
            app/src/main/res/values

          cp Numogram.py \
            app/src/main/python/Numogram.py
          cp P314Experiment1.py \
            app/src/main/python/P314Experiment1.py
          cp P314Experiment1Bridge.kt \
            app/src/main/java/com/amelia/exp1/P314Experiment1Bridge.kt
          cp P314MainActivity.kt \
            app/src/main/java/com/amelia/p314/MainActivity.kt

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmeliaAndroidP314"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "16.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          val revision =
              (System.getenv("GITHUB_SHA") ?: "local").take(12)

          android {
              namespace = "com.amelia.p314"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.amelia.p314"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 14
                  versionName = "0.16-android-p3.14-exp1a"

                  ndk {
                      abiFilters += listOf(
                          "armeabi-v7a",
                          "arm64-v8a"
                      )
                  }

                  buildConfigField(
                      "String",
                      "BUILD_REVISION",
                      "\"$revision\""
                  )
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          chaquopy {
              defaultConfig {
                  version = "3.8"
                  buildPython("python3.8")

                  pip {
                      install("torch==1.8.1")
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Amelia P3.14</string>
          </resources>
          EOF

      - name: Validate P3.14 isolation contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'namespace = "com.amelia.p314"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.amelia.p314"' app/build.gradle.kts

          if grep -Eq 'com\.amelia\.p31(2|3)"' app/build.gradle.kts
          then
            echo "FAIL: P3.14 package collides with frozen P3.12/P3.13."
            exit 1
          fi

          # Experiment 1A must be offline.
          if grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          then
            echo "FAIL: P3.14 Experiment 1A must not request INTERNET permission."
            exit 1
          fi

          # Frozen Numogram source is copied unchanged.
          cmp -s Numogram.py app/src/main/python/Numogram.py

          grep -Fq 'RUN SEALED EXPERIMENT 1A' \
            app/src/main/java/com/amelia/p314/MainActivity.kt
          grep -Fq 'P3.14B topology/label-shuffle falsification' \
            app/src/main/python/P314Experiment1.py

          echo "P3.14 isolation contracts passed."
          echo "P3.12/P3.13 remain side-by-side and untouched."
          echo "Experiment 1A has no renderer, PFM, provider key or network permission."

      - name: Build Android-P3.14 side-by-side APK
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Record P3.14 build manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          cp "$APK" Amelia-P3.14-Experiment1A.apk

          sha256sum \
            Numogram.py \
            P314Experiment1.py \
            P314Experiment1Bridge.kt \
            P314MainActivity.kt \
            P314_Experiment1_Protocol.md \
            > p314-source-sha256.txt

          APK_SHA="$(sha256sum Amelia-P3.14-Experiment1A.apk | awk '{print $1}')"
          NUMOGRAM_SHA="$(sha256sum Numogram.py | awk '{print $1}')"
          PROTOCOL_FILE_SHA="$(sha256sum P314_Experiment1_Protocol.md | awk '{print $1}')"

          cat > p314-build-manifest.txt <<EOF
          Amelia Android P3.14 — Experiment 1A
          =====================================

          Revision:
          ${GITHUB_SHA}

          Purpose:
          Prospective numerical-operator specificity assay.

          Frozen upstream packages:
          com.amelia.p312
          com.amelia.p313

          New side-by-side package:
          com.amelia.p314

          Target codes:
          333, 137, 666, 360

          Primary reference:
          exhaustive same-digital-root three-digit population

          Numogram SHA-256:
          ${NUMOGRAM_SHA}

          Human-readable protocol file SHA-256:
          ${PROTOCOL_FILE_SHA}

          APK SHA-256:
          ${APK_SHA}
          EOF

          cat p314-build-manifest.txt
          cat p314-source-sha256.txt

      - name: Upload Android-P3.14 side-by-side APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.14-Experiment1A
          path: |
            Amelia-P3.14-Experiment1A.apk
            p314-build-manifest.txt
            p314-source-sha256.txt
            P314_Experiment1_Protocol.md
          retention-days: 14
