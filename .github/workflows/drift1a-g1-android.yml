name: Amelia DRIFT-1A G1 Android APK
on:
  push:
    branches: [amelia-1.0, main]
    paths: ["drift1a/**", ".github/workflows/drift1a-g1-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drift1a-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: drift1a
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted G1 sources and prepare Android assets
        run: |
          set -euo pipefail
          sha256sum -c ACCEPTED_CORE_SHA256SUMS.txt
          python prepare.py
          python -m unittest discover -s tests -v 2>&1 | tee g1-tests.log
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure optional existing signing key
        env:
          KS_B64: ${{ secrets.AMELIA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.AMELIA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.AMELIA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/amelia.keystore"
            echo "AMELIA_KEYSTORE_PATH=$RUNNER_TEMP/amelia.keystore" >> "$GITHUB_ENV"
            echo "AMELIA_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "AMELIA_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          fi
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Collect APK and provenance
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Amelia-DRIFT1A-G1.apk
          cp g1-tests.log runtime/runtime_manifest.json ACCEPTED_CORE_SHA256SUMS.txt out/
          cp README.md out/INSTALL.md
          printf 'commit: %s\nrun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > out/build-manifest.txt
          (cd out && sha256sum Amelia-DRIFT1A-G1.apk >> build-manifest.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Amelia-DRIFT1A-G1-Android
          path: drift1a/out/
          if-no-files-found: error
          retention-days: 90
      - name: Enable KVM for Android smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 9 emulator - launch, parity, 512 ticks and replay
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          script: bash drift1a/tests/android_smoke.sh
      - name: Upload Android smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-DRIFT1A-G1-Android-smoke
          path: drift1a/android-smoke.log
          if-no-files-found: warn
          retention-days: 90
