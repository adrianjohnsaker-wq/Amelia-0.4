name: Build Amelia Android-P3.5A Chaquopy 3.8 Probe APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # P3.5A deliberately moves the Android Python lane from
      # Chaquopy 17 / Python 3.11 to Chaquopy 16.1 / Python 3.8.
      #
      # Python 3.8 is required for the later P3.6 torch==1.8.1
      # Android wheel, but torch is NOT installed in this stage.
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify P3.5A source files exist
        shell: bash
        run: |
          set -euo pipefail

          test -f bridge_probe.py
          test -f Numogram.py
          test -f NumogramBridge.kt
          test -f ChaquopyProbe.kt

          echo "P3.5A source files present:"
          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt

      - name: Create Android-P3.5A Chaquopy probe project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/amelia/p35a \
            app/src/main/java/com/amelia/bridge \
            app/src/main/python \
            app/src/main/res/values

          # ------------------------------------------------------------
          # Copy the four sealed P3.5 sources from repository root.
          #
          # Numogram.py is packaged and syntax-checked, but is NOT
          # imported during P3.5A because torch is deliberately absent.
          # ------------------------------------------------------------

          cp bridge_probe.py \
            app/src/main/python/bridge_probe.py

          cp Numogram.py \
            app/src/main/python/Numogram.py

          cp NumogramBridge.kt \
            app/src/main/java/com/amelia/bridge/NumogramBridge.kt

          cp ChaquopyProbe.kt \
            app/src/main/java/com/amelia/bridge/ChaquopyProbe.kt

          # ------------------------------------------------------------
          # settings.gradle.kts
          # ------------------------------------------------------------

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmeliaAndroidP35A"
          include(":app")
          EOF

          # ------------------------------------------------------------
          # Top-level build.gradle.kts
          #
          # AGP 8.7.3 remains unchanged from the successful P3.3 line.
          # Chaquopy changes from 17.0.0 to 16.1.0 so Python 3.8 can
          # be used for the later torch Android wheel.
          # ------------------------------------------------------------

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "16.1.0" apply false
          }
          EOF

          # ------------------------------------------------------------
          # Gradle properties
          # ------------------------------------------------------------

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # ------------------------------------------------------------
          # app/build.gradle.kts
          #
          # IMPORTANT:
          # There is deliberately NO pip block in P3.5A.
          # No numpy.
          # No torch.
          #
          # This stage tests Chaquopy 16.1 + Python 3.8 only.
          # ------------------------------------------------------------

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.amelia.p35a"
              compileSdk = 34

              defaultConfig {
                  // Installs beside P3/P3.1/P3.2/P3.3 rather than
                  // replacing their evidence-bearing applications.
                  applicationId = "com.amelia.p35a"

                  minSdk = 24
                  targetSdk = 34

                  versionCode = 1
                  versionName = "0.7-android-p3.5a-chaquopy38-probe"

                  ndk {
                      abiFilters += listOf(
                          "armeabi-v7a",
                          "arm64-v8a"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          chaquopy {
              defaultConfig {
                  version = "3.8"

                  // P3.5A intentionally has no pip dependencies.
                  //
                  // P3.6 will add:
                  //
                  // pip {
                  //     install("torch==1.8.1")
                  // }
              }
          }
          EOF

          # ------------------------------------------------------------
          # AndroidManifest.xml
          #
          # NO INTERNET permission is declared.
          #
          # PyApplication owns Chaquopy process initialization.
          # ------------------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # ------------------------------------------------------------
          # App name
          # ------------------------------------------------------------

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Amelia P3.5A Chaquopy Probe</string>
          </resources>
          EOF

          # ------------------------------------------------------------
          # MainActivity.kt
          #
          # This application does ONE runtime experiment:
          #
          # Kotlin
          #   -> Chaquopy 16.1
          #   -> Python 3.8
          #   -> bridge_probe.ping()
          #   -> Kotlin
          #
          # It deliberately does NOT import Numogram.py.
          #
          # The result is displayed directly on screen as well as
          # written to Logcat under AMELIA_P35A.
          # ------------------------------------------------------------

          cat > app/src/main/java/com/amelia/p35a/MainActivity.kt <<'EOF'
          package com.amelia.p35a

          import android.app.Activity
          import android.os.Bundle
          import android.util.Log
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.amelia.bridge.ChaquopyProbe
          import org.json.JSONObject

          class MainActivity : Activity() {

              private lateinit var statusView: TextView
              private lateinit var detailView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(24), dp(20), dp(24))
                  }

                  root.addView(
                      TextView(this).apply {
                          text = "AMELIA · P3.5A"
                          textSize = 25f
                          gravity = Gravity.CENTER_HORIZONTAL
                      }
                  )

                  root.addView(
                      TextView(this).apply {
                          text =
                              "Chaquopy 16.1 · Python 3.8 · dependency-free bridge probe"
                          textSize = 14f
                          gravity = Gravity.CENTER_HORIZONTAL
                          setPadding(0, dp(8), 0, dp(18))
                      }
                  )

                  statusView = TextView(this).apply {
                      text = "P3.5A probe starting…"
                      textSize = 20f
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(
                          dp(8),
                          dp(18),
                          dp(8),
                          dp(18)
                      )
                  }

                  detailView = TextView(this).apply {
                      text =
                          "Waiting for Kotlin → Chaquopy → Python → Kotlin round-trip."
                      textSize = 14f
                      setPadding(
                          dp(8),
                          dp(12),
                          dp(8),
                          dp(12)
                      )
                  }

                  root.addView(statusView)
                  root.addView(detailView)

                  root.addView(
                      TextView(this).apply {
                          text =
                              "\nP3.5A boundary:\n\n" +
                              "Kotlin\n" +
                              "  ↓\n" +
                              "Chaquopy 16.1\n" +
                              "  ↓\n" +
                              "Python 3.8\n" +
                              "  ↓\n" +
                              "bridge_probe.py\n" +
                              "  ↓\n" +
                              "Kotlin\n\n" +
                              "Numogram.py is packaged but deliberately " +
                              "not imported at this stage.\n\n" +
                              "torch is deliberately absent."
                          textSize = 14f
                      }
                  )

                  scroll.addView(root)
                  setContentView(scroll)

                  runProbe()
              }

              private fun runProbe() {
                  Thread {
                      val raw = try {
                          ChaquopyProbe.run(applicationContext)
                      } catch (t: Throwable) {
                          JSONObject()
                              .put("status", "error")
                              .put(
                                  "error_type",
                                  t::class.java.simpleName
                              )
                              .put(
                                  "message",
                                  t.message
                                      ?: "Unknown Android/Chaquopy error"
                              )
                              .toString()
                      }

                      Log.i("AMELIA_P35A", raw)

                      runOnUiThread {
                          renderProbeResult(raw)
                      }
                  }.start()
              }

              private fun renderProbeResult(raw: String) {
                  try {
                      val result = JSONObject(raw)

                      val status =
                          result.optString("status", "")

                      val probe =
                          result.optString("probe", "")

                      val received =
                          result.optJSONObject("received")

                      val correctProbe =
                          probe ==
                              "P3.5A-chaquopy-probe-v1"

                      val correctStage =
                          received?.optString(
                              "stage",
                              ""
                          ) == "P3.5A"

                      val correctSource =
                          received?.optString(
                              "source",
                              ""
                          ) == "android"

                      val passed =
                          status == "success" &&
                          correctProbe &&
                          correctStage &&
                          correctSource

                      if (passed) {
                          statusView.text =
                              "P3.5A PASSED ✓"

                          detailView.text =
                              "Kotlin → Chaquopy 16.1 → " +
                              "Python 3.8 → Kotlin round-trip " +
                              "completed successfully.\n\n" +
                              "Probe: $probe\n\n" +
                              "Stage: ${received?.optString("stage")}\n" +
                              "Source: ${received?.optString("source")}\n\n" +
                              "P3.6 may now introduce torch."
                      } else {
                          statusView.text =
                              "P3.5A FAIL-CLOSED"

                          detailView.text =
                              "A response was received, but it did not " +
                              "satisfy the sealed probe contract.\n\n" +
                              raw
                      }

                  } catch (t: Throwable) {
                      statusView.text =
                          "P3.5A FAIL-CLOSED"

                      detailView.text =
                          "The returned bridge value was not valid " +
                          "probe JSON.\n\n" +
                          "Error: ${t.message}\n\n" +
                          "Raw response:\n$raw"
                  }
              }

              private fun dp(value: Int): Int {
                  return (
                      value *
                      resources.displayMetrics.density
                  ).toInt()
              }
          }
          EOF

          # ------------------------------------------------------------
          # Record source hashes in the generated workspace.
          # These aren't interpreted as experimental results: they make
          # it straightforward to identify exactly which four root
          # sources entered this APK.
          # ------------------------------------------------------------

          BRIDGE_PROBE_SHA="$(
            sha256sum app/src/main/python/bridge_probe.py |
            awk '{print $1}'
          )"

          NUMOGRAM_SHA="$(
            sha256sum app/src/main/python/Numogram.py |
            awk '{print $1}'
          )"

          NUMOGRAM_BRIDGE_SHA="$(
            sha256sum \
              app/src/main/java/com/amelia/bridge/NumogramBridge.kt |
            awk '{print $1}'
          )"

          CHAQUOPY_PROBE_SHA="$(
            sha256sum \
              app/src/main/java/com/amelia/bridge/ChaquopyProbe.kt |
            awk '{print $1}'
          )"

          BUILD_REVISION="${GITHUB_SHA:-local}"

          cat > app/src/main/python/p35a_build_provenance.py <<EOF
          BUILD_PROVENANCE = {
              "schema": "amelia-p3.5a-build-provenance-v1",
              "workflow": "android-p3.5a-chaquopy38-probe",
              "revision": "${BUILD_REVISION}",
              "chaquopyVersion": "16.1.0",
              "androidPythonVersion": "3.8",
              "torchInstalled": False,
              "bridgeProbeSha256": "${BRIDGE_PROBE_SHA}",
              "numogramSha256": "${NUMOGRAM_SHA}",
              "numogramBridgeSha256": "${NUMOGRAM_BRIDGE_SHA}",
              "chaquopyProbeSha256": "${CHAQUOPY_PROBE_SHA}",
          }
          EOF

      # --------------------------------------------------------------
      # Host-side validation.
      #
      # Numogram.py is PY_COMPILED only.
      #
      # It is NOT imported because torch is intentionally absent.
      # --------------------------------------------------------------

      - name: Validate P3.5A Python sources and probe contract
        shell: bash
        run: |
          set -euo pipefail

          python3 --version

          python3 -m py_compile \
            app/src/main/python/bridge_probe.py \
            app/src/main/python/Numogram.py \
            app/src/main/python/p35a_build_provenance.py

          PYTHONPATH=app/src/main/python python3 - <<'PY'
          import json
          import bridge_probe

          raw = bridge_probe.ping(
              json.dumps(
                  {
                      "stage": "P3.5A",
                      "source": "host-validation",
                  }
              )
          )

          result = json.loads(raw)

          assert result["status"] == "success", result
          assert (
              result["probe"]
              == "P3.5A-chaquopy-probe-v1"
          ), result

          assert (
              result["received"]["stage"]
              == "P3.5A"
          ), result

          assert (
              result["received"]["source"]
              == "host-validation"
          ), result

          print(
              "P3.5A dependency-free Python probe "
              "contract validated"
          )
          PY

          # Numogram.py may be present, but P3.5A's runtime entry
          # point must not import it.
          if grep -q \
            'getModule("Numogram")' \
            app/src/main/java/com/amelia/p35a/MainActivity.kt
          then
              echo \
                "FAIL: MainActivity imports Numogram during P3.5A"
              exit 1
          fi

          if grep -q \
            'getModule("Numogram")' \
            app/src/main/java/com/amelia/bridge/ChaquopyProbe.kt
          then
              echo \
                "FAIL: ChaquopyProbe imports Numogram during P3.5A"
              exit 1
          fi

          # P3.5A must not declare INTERNET permission.
          if grep -q \
            'android.permission.INTERNET' \
            app/src/main/AndroidManifest.xml
          then
              echo \
                "FAIL: P3.5A unexpectedly declares INTERNET"
              exit 1
          fi

          echo
          echo "P3.5A pre-build validation passed."
          echo "Numogram.py was syntax-checked but never imported."
          echo "No torch dependency is present."
          echo "No INTERNET permission is present."

      # --------------------------------------------------------------
      # Build.
      #
      # Successful completion proves the Chaquopy 16.1 / Python 3.8
      # application can at least be assembled for the two selected
      # Android ABIs.
      #
      # The on-device probe is still required before P3.6.
      # --------------------------------------------------------------

      - name: Build Android-P3.5A APK
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      # --------------------------------------------------------------
      # Build metadata for easy inspection from Actions.
      # --------------------------------------------------------------

      - name: Record P3.5A build manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          APK_SHA="$(
            sha256sum "$APK" |
            awk '{print $1}'
          )"

          cat > p35a-build-manifest.txt <<EOF
          Amelia Android P3.5A
          ====================

          Revision:
          ${GITHUB_SHA}

          Android Gradle Plugin:
          8.7.3

          Gradle:
          8.9

          Java:
          17

          Chaquopy:
          16.1.0

          Android Python:
          3.8

          torch:
          NOT INSTALLED

          Numogram imported:
          NO

          Runtime probe module:
          bridge_probe

          ABIs:
          armeabi-v7a
          arm64-v8a

          APK SHA-256:
          ${APK_SHA}

          Acceptance condition:
          App displays "P3.5A PASSED ✓" after the
          Kotlin -> Chaquopy -> Python -> Kotlin
          round-trip.
          EOF

          cat p35a-build-manifest.txt

      - name: Upload Android-P3.5A APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.5A-Chaquopy38-Probe
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            p35a-build-manifest.txt
          retention-days: 14
