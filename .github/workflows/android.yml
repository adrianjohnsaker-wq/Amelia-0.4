name: Build Amelia Android-P1 APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android-P1 ProcessFieldMemory substrate
        shell: bash
        run: |
          set -euo pipefail
          test -f amelia_symbolic_core.py
          mkdir -p app/src/main/java/com/amelia/p1 app/src/main/python app/src/main/res/values
          # Legacy asset only: P1 never imports this symbolic text routine.
          cp amelia_symbolic_core.py app/src/main/python/amelia_symbolic_core.py

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AmeliaAndroidP1"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "17.0.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("com.chaquo.python") }
          android {
              namespace = "com.amelia.p1"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.amelia.p1"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.3-android-p1"
                  ndk { abiFilters += listOf("armeabi-v7a", "arm64-v8a") }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          kotlin { jvmToolchain(17) }
          chaquopy { defaultConfig { version = "3.11" } }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:name="com.chaquo.python.android.PyApplication" android:allowBackup="true" android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          echo '<resources><string name="app_name">Amelia P1</string></resources>' > app/src/main/res/values/strings.xml

          cat > app/src/main/python/p1_runtime.py <<'EOF'
          """Local Amelia P1: ProcessFieldMemory, directed routing and controls."""
          from __future__ import annotations

          import hashlib
          import json
          import math
          import threading
          from pathlib import Path
          from typing import Any, Dict, List, Sequence

          Z = 10
          SCHEMA = "amelia-android-p1-process-field-v1"
          ZERO = [round(1 / Z, 12) for _ in range(Z)]
          LOCK = threading.RLock()
          RUNTIMES: Dict[str, "Runtime"] = {}

          def canonical(value: Any) -> str:
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))

          def digest(value: Any) -> str:
              return hashlib.sha256(canonical(value).encode("utf-8")).hexdigest()

          def norm(values: Sequence[float]) -> List[float]:
              values = [max(0.0, float(v)) for v in values]
              total = sum(values)
              if total <= 0:
                  return list(ZERO)
              answer = [round(v / total, 12) for v in values]
              answer[-1] = round(1 - sum(answer[:-1]), 12)
              return answer

          def tensor() -> List[List[float]]:
              return [[0.0 for _ in range(Z)] for _ in range(Z)]

          def tn(value: Sequence[Sequence[float]]) -> float:
              return round(math.sqrt(sum(float(x) ** 2 for row in value for x in row)), 12)

          def l1(left: Sequence[float], right: Sequence[float]) -> float:
              return round(sum(abs(float(a) - float(b)) for a, b in zip(left, right)), 12)

          def input_drive(question: str) -> Dict[str, Any]:
              cleaned = " ".join(question.casefold().split())
              bins = [0.0] * Z
              for position, char in enumerate(cleaned):
                  if "a" <= char <= "z": weight = ord(char) - 96
                  elif char.isdigit(): weight = int(char) + 1
                  else: continue
                  bins[(position + weight) % Z] += weight
              if not any(bins): bins[0] = 1.0
              return {"digest": hashlib.sha256(cleaned.encode("utf-8")).hexdigest(), "length": len(cleaned), "drive": norm(bins)}

          class Runtime:
              def __init__(self, root: str) -> None:
                  self.root = Path(root); self.root.mkdir(parents=True, exist_ok=True)
                  self.memory_path = self.root / "process_field_memory.json"
                  self.ledger_path = self.root / "p1-ledger.jsonl"
                  self.head_path = self.root / "p1-ledger-head.txt"
                  self.data = self.load()
                  self.head = self.head_path.read_text(encoding="utf-8").strip() if self.head_path.exists() else "0" * 64
                  self.config_digest = digest({"schema": SCHEMA, "conditions": ["FULL", "ABLATED", "NEUTRAL_RESET"], "language": "display-only; no LLM in causal loop"})

              def fresh(self) -> Dict[str, Any]:
                  return {"schema": SCHEMA, "sequence": 0, "fieldState": list(ZERO), "fieldHistory": [], "activeAttractors": [], "recentTransitions": [], "lastStability": 1.0, "deformationTensor": tensor(), "lastReplay": None}

              def load(self) -> Dict[str, Any]:
                  if not self.memory_path.exists():
                      value = self.fresh(); self.write(value); return value
                  value = json.loads(self.memory_path.read_text(encoding="utf-8"))
                  if value.get("schema") != SCHEMA or len(value.get("fieldState", [])) != Z or len(value.get("deformationTensor", [])) != Z:
                      raise ValueError("Invalid ProcessFieldMemory state")
                  return value

              def write(self, value: Dict[str, Any]) -> None:
                  temporary = self.memory_path.with_suffix(".tmp")
                  temporary.write_text(canonical(value), encoding="utf-8"); temporary.replace(self.memory_path)

              def ledger(self, kind: str, payload: Dict[str, Any]) -> str:
                  record = {"schema": "amelia-android-p1-ledger-v1", "kind": kind, "previous": self.head, "payload": payload}
                  record["recordDigest"] = digest(record); record["chainDigest"] = digest({"previous": self.head, "record": record["recordDigest"]})
                  with self.ledger_path.open("a", encoding="utf-8") as file: file.write(canonical(record) + "\n")
                  self.head = record["chainDigest"]
                  temporary = self.head_path.with_suffix(".tmp"); temporary.write_text(self.head, encoding="utf-8"); temporary.replace(self.head_path)
                  return self.head

              def snapshot(self, condition: str) -> Dict[str, Any]:
                  if condition == "FULL":
                      return {"condition": condition, "sequence": self.data["sequence"], "fieldState": list(self.data["fieldState"]), "deformationTensor": [list(row) for row in self.data["deformationTensor"]], "historyCount": len(self.data["fieldHistory"]), "lastStability": self.data["lastStability"], "memoryEnabled": True}
                  if condition == "ABLATED":
                      return {"condition": condition, "sequence": self.data["sequence"], "fieldState": list(self.data["fieldState"]), "deformationTensor": tensor(), "historyCount": len(self.data["fieldHistory"]), "lastStability": self.data["lastStability"], "memoryEnabled": False}
                  if condition == "NEUTRAL_RESET":
                      return {"condition": condition, "sequence": 0, "fieldState": list(ZERO), "deformationTensor": tensor(), "historyCount": 0, "lastStability": 1.0, "memoryEnabled": False}
                  raise ValueError("Choose FULL, ABLATED or NEUTRAL_RESET")

              def bias(self, value: Sequence[Sequence[float]]) -> List[float]:
                  weights = [sum(abs(float(x)) for x in row) for row in value]
                  return norm(weights if any(weights) else [1.0] * Z)

              def calculate(self, question: str, snap: Dict[str, Any]) -> Dict[str, Any]:
                  encoded = input_drive(question); pre = list(snap["fieldState"]); old_tensor = snap["deformationTensor"]; memory = self.bias(old_tensor)
                  kernel = []
                  for zone in range(Z):
                      ring = 0.5 * (pre[(zone - 1) % Z] + pre[(zone + 1) % Z])
                      kernel.append(0.42 * pre[zone] + 0.32 * encoded["drive"][zone] + 0.18 * memory[zone] + 0.05 * ring + 0.03 * pre[9-zone])
                  kernel = norm(kernel)
                  first = max(range(Z), key=lambda z: (kernel[z], -z))
                  def edges(z: int) -> List[Dict[str, Any]]: return [{"to": (z+1)%Z, "kind": "ring"}, {"to": 9-z, "kind": "syzygy"}, {"to": (z+3)%Z, "kind": "diagonal"}]
                  e1 = max(edges(first), key=lambda e: (kernel[e["to"]], -e["to"])); second = e1["to"]
                  e2 = max([e for e in edges(second) if e["to"] != first], key=lambda e: (kernel[e["to"]], -e["to"])); third = e2["to"]
                  flux = round(sum(abs(kernel[z] - kernel[9-z]) for z in range(5)) / 5, 12)
                  field = list(kernel); modules = []
                  if flux >= 0.025:
                      field = norm([0.88 * field[z] + 0.12 * field[9-z] for z in range(Z)]); modules.append({"module": "syzygetic_coupling", "effect": "complement-weighted update"})
                  field = norm([0.92 * field[z] + 0.04 * (field[(z-1)%Z] + field[(z+1)%Z]) for z in range(Z)]); modules.append({"module": "rhizomatic_recombination", "effect": "ring-neighbour diffusion"})
                  field[first] += 0.035 + 0.015 * memory[first]; field = norm(field); modules.append({"module": "attractor_consolidation", "effect": "route-dominant bounded reinforcement"})
                  new_tensor = tensor()
                  if snap["memoryEnabled"]:
                      for row in range(Z):
                          for col in range(Z):
                              syzygy = field[row] - field[col] if row + col == 9 else 0.0
                              new_tensor[row][col] = round(0.988 * old_tensor[row][col] + 0.055 * field[row] * pre[col] + 0.016 * syzygy, 12)
                  else: new_tensor = old_tensor
                  top = max(field); attractors = [z for z, value in enumerate(field) if value >= top * 0.92]
                  entropy = round(-sum(value * math.log(value) for value in kernel if value > 0) / math.log(Z), 12)
                  trace = {"schema": "amelia-android-p1-trace-v1", "condition": snap["condition"], "sequence": int(snap["sequence"]) + 1, "inputDigest": encoded["digest"], "inputLength": encoded["length"], "preSnapshot": snap, "kernelState": kernel, "fieldState": field, "nextTensor": new_tensor, "route": [first, second, third], "routeEdges": [{"from": first, "to": second, "kind": e1["kind"]}, {"from": second, "to": third, "kind": e2["kind"]}], "modules": modules, "kernelDeltaL1": l1(pre, kernel), "fieldEntropy": entropy, "syzygyFlux": flux, "preStability": snap["lastStability"], "postStability": round(max(0.0, 1.0 - l1(pre, field)/2), 12), "preTensorNorm": tn(old_tensor), "postTensorNorm": tn(new_tensor), "activeAttractors": attractors, "configDigest": self.config_digest}
                  trace["causalDigest"] = digest(trace); return trace

              def turn(self, question: str, condition: str) -> Dict[str, Any]:
                  if not question or not question.strip(): raise ValueError("A non-empty input is required")
                  trace = self.calculate(question, self.snapshot(condition)); prepared = self.ledger("prepared_turn", {"rawInput": question, "trace": trace})
                  if condition == "FULL":
                      event = {"sequence": trace["sequence"], "inputDigest": trace["inputDigest"], "route": trace["route"], "causalDigest": trace["causalDigest"], "stability": trace["postStability"]}
                      self.data["sequence"] = trace["sequence"]; self.data["fieldState"] = trace["fieldState"]; self.data["deformationTensor"] = trace["nextTensor"]; self.data["activeAttractors"] = trace["activeAttractors"]; self.data["lastStability"] = trace["postStability"]
                      self.data["fieldHistory"] = (self.data["fieldHistory"] + [event])[-200:]; self.data["recentTransitions"] = (self.data["recentTransitions"] + [event])[-50:]
                      self.data["lastReplay"] = {"question": question, "snapshot": trace["preSnapshot"], "expected": trace["causalDigest"]}; self.write(self.data)
                      trace["persistence"] = {"mutated": True, "historyCount": len(self.data["fieldHistory"]), "memoryDigest": digest(self.data)}; head = self.ledger("committed_full_turn", {"causalDigest": trace["causalDigest"], "memoryDigest": trace["persistence"]["memoryDigest"]})
                  else:
                      trace["persistence"] = {"mutated": False, "historyCount": len(self.data["fieldHistory"]), "memoryDigest": digest(self.snapshot(condition))}; head = self.ledger("non_mutating_control_probe", {"condition": condition, "causalDigest": trace["causalDigest"]})
                  trace["ledger"] = {"prepared": prepared, "head": head}; return {"ok": True, "kind": "turn", "trace": trace}

              def replay(self) -> Dict[str, Any]:
                  saved = self.data.get("lastReplay")
                  if not saved: raise ValueError("Run one FULL condition before replay")
                  observed = self.calculate(saved["question"], saved["snapshot"]); match = observed["causalDigest"] == saved["expected"]
                  head = self.ledger("deterministic_replay", {"expected": saved["expected"], "observed": observed["causalDigest"], "match": match})
                  return {"ok": True, "kind": "replay", "match": match, "route": observed["route"], "expected": saved["expected"], "observed": observed["causalDigest"], "ledgerHead": head}

              def reset(self) -> Dict[str, Any]:
                  self.data = self.fresh(); self.write(self.data); head = self.ledger("explicit_memory_reset", {"sequence": 0})
                  return {"ok": True, "kind": "reset", "sequence": 0, "ledgerHead": head}

          def runtime(root: str) -> Runtime:
              key = str(Path(root))
              if key not in RUNTIMES: RUNTIMES[key] = Runtime(key)
              return RUNTIMES[key]

          def call(operation):
              try:
                  with LOCK: return json.dumps(operation(), ensure_ascii=False, sort_keys=True)
              except Exception as error: return json.dumps({"ok": False, "error": str(error), "errorType": type(error).__name__}, ensure_ascii=False, sort_keys=True)

          def process_turn(question: str, storage_dir: str, condition: str) -> str: return call(lambda: runtime(storage_dir).turn(question, condition))
          def verify_last_replay(storage_dir: str) -> str: return call(lambda: runtime(storage_dir).replay())
          def reset_experiment(storage_dir: str) -> str: return call(lambda: runtime(storage_dir).reset())
          EOF

          cat > app/src/main/java/com/amelia/p1/MainActivity.kt <<'EOF'
          package com.amelia.p1

          import android.app.Activity
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import com.chaquo.python.Python
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.Locale

          class MainActivity : Activity() {
              private lateinit var input: EditText
              private lateinit var output: TextView
              private lateinit var telemetry: TextView
              private lateinit var condition: Spinner
              private lateinit var run: Button
              private val storageDir by lazy { File(filesDir, "amelia_p1").apply { mkdirs() }.absolutePath }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(16), dp(16), dp(16)) }
                  root.addView(TextView(this).apply { text = "AMELIA · ANDROID-P1"; textSize = 23f; gravity = Gravity.CENTER_HORIZONTAL })
                  root.addView(TextView(this).apply { text = "ProcessFieldMemory · directed routing · no language model in causal loop"; textSize = 12f; gravity = Gravity.CENTER_HORIZONTAL; setPadding(0, dp(5), 0, dp(8)) })
                  condition = Spinner(this).apply { adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("FULL", "ABLATED", "NEUTRAL_RESET")) }
                  root.addView(condition)
                  val readout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  output = TextView(this).apply { text = "P1 ready. FULL commits ProcessFieldMemory; controls are non-mutating probes."; textSize = 15f; setPadding(0, dp(10), 0, dp(8)) }
                  telemetry = TextView(this).apply { text = "TELEMETRY · awaiting run"; textSize = 13f; setPadding(dp(8), dp(8), dp(8), dp(8)) }
                  readout.addView(output); readout.addView(telemetry)
                  root.addView(ScrollView(this).apply { addView(readout) }, LinearLayout.LayoutParams(-1, 0, 1f))
                  input = EditText(this).apply { hint = "Input for local substrate"; inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE; minLines = 2; maxLines = 4 }
                  root.addView(input)
                  run = Button(this).apply { text = "RUN P1 TURN"; setOnClickListener { val q = input.text.toString().trim(); if (q.isNotEmpty()) invoke("process_turn", q) } }
                  root.addView(run)
                  root.addView(Button(this).apply { text = "VERIFY LAST FULL REPLAY"; setOnClickListener { invoke("verify_last_replay", null) } })
                  root.addView(Button(this).apply { text = "RESET P1 MEMORY"; setOnClickListener { invoke("reset_experiment", null) } })
                  setContentView(root)
              }

              private fun invoke(function: String, question: String?) {
                  run.isEnabled = false; output.text = "P1 local process running..."
                  Thread {
                      val text = try {
                          val module = Python.getInstance().getModule("p1_runtime")
                          if (function == "process_turn") module.callAttr(function, question, storageDir, condition.selectedItem.toString()).toString() else module.callAttr(function, storageDir).toString()
                      } catch (error: Exception) { JSONObject().put("ok", false).put("error", error.message ?: "Android/Python failure").toString() }
                      runOnUiThread { render(text); input.setText(""); run.isEnabled = true }
                  }.start()
              }

              private fun render(text: String) {
                  val result = JSONObject(text)
                  if (!result.optBoolean("ok", false)) { output.text = "P1 operation failed."; telemetry.text = "TELEMETRY · ERROR\n${result.optString("error")}"; return }
                  when (result.optString("kind")) {
                      "turn" -> turn(result.getJSONObject("trace"))
                      "replay" -> { output.text = if (result.optBoolean("match")) "REPLAY VERIFIED · causal output reproduced without mutation." else "REPLAY MISMATCH · inspect ledger."; telemetry.text = "REPLAY\nRoute: ${zones(result.optJSONArray("route"))}\nExpected: ${short(result.optString("expected"))}\nObserved: ${short(result.optString("observed"))}\nLedger: ${short(result.optString("ledgerHead"))}" }
                      else -> { output.text = "P1 memory reset."; telemetry.text = "RESET\nSequence: ${result.optInt("sequence")}\nLedger: ${short(result.optString("ledgerHead"))}" }
                  }
              }

              private fun turn(trace: JSONObject) {
                  val modules = trace.optJSONArray("modules") ?: JSONArray()
                  val names = (0 until modules.length()).joinToString(", ") { modules.optJSONObject(it)?.optString("module") ?: "" }
                  val saved = trace.optJSONObject("persistence") ?: JSONObject(); val ledger = trace.optJSONObject("ledger") ?: JSONObject()
                  output.text = "P1 SUBSTRATE READOUT\n\nCondition: ${trace.optString("condition")}\nRoute: ${zones(trace.optJSONArray("route"))}\nModules: $names\nCommitted memory: ${saved.optBoolean("mutated")}"
                  telemetry.text = "TELEMETRY · PROCESSFIELDMEMORY\nTurn: ${trace.optInt("sequence")}\nEdges: ${edges(trace.optJSONArray("routeEdges"))}\nKernel ΔL1: ${number(trace.optDouble("kernelDeltaL1"))}\nEntropy: ${number(trace.optDouble("fieldEntropy"))}\nSyzygy flux: ${number(trace.optDouble("syzygyFlux"))}\nStability: ${number(trace.optDouble("preStability"))} → ${number(trace.optDouble("postStability"))}\nTensor: ${number(trace.optDouble("preTensorNorm"))} → ${number(trace.optDouble("postTensorNorm"))}\nAttractors: ${zones(trace.optJSONArray("activeAttractors"))}\nHistory: ${saved.optInt("historyCount")}\nCausal: ${short(trace.optString("causalDigest"))}\nLedger: ${short(ledger.optString("head"))}"
              }

              private fun zones(items: JSONArray?): String = if (items == null) "—" else (0 until items.length()).joinToString(" → ") { "Z${items.optInt(it)}" }
              private fun edges(items: JSONArray?): String = if (items == null) "—" else (0 until items.length()).joinToString("; ") { i -> items.optJSONObject(i)?.let { "Z${it.optInt("from")}→Z${it.optInt("to")} (${it.optString("kind")})" } ?: "" }
              private fun number(value: Double): String = String.format(Locale.US, "%.6f", value)
              private fun short(value: String): String = if (value.length <= 12) value else value.take(12)
              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()
          }
          EOF

      - name: Validate local P1 causal path
        run: |
          python3 -m py_compile app/src/main/python/amelia_symbolic_core.py app/src/main/python/p1_runtime.py
          P1_TEST_DIR="$(mktemp -d)"
          export P1_TEST_DIR
          PYTHONPATH=app/src/main/python python3 -c 'import json, os; from p1_runtime import process_turn, verify_last_replay; root=os.environ["P1_TEST_DIR"]; full=json.loads(process_turn("field memory test", root, "FULL")); assert full["ok"] and full["trace"]["persistence"]["mutated"]; ablated=json.loads(process_turn("field memory test", root, "ABLATED")); assert ablated["ok"] and not ablated["trace"]["persistence"]["mutated"]; replay=json.loads(verify_last_replay(root)); assert replay["ok"] and replay["match"]'

      - name: Build Android-P1 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload Android-P1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P1
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
