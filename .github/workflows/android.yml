name: Build Amelia Android-P3 Prospective Cohort APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android-P3 prospective matched-state cohort
        shell: bash
        run: |
          set -euo pipefail
          test -f amelia_symbolic_core.py
          mkdir -p app/src/main/java/com/amelia/p3 app/src/main/python app/src/main/res/values
          # This legacy symbolic routine is packaged only as a named provenance artefact.
          # Android-P3 does not import it into the experimental causal path.
          cp amelia_symbolic_core.py app/src/main/python/amelia_symbolic_core.py

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AmeliaAndroidP3"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "17.0.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("com.chaquo.python") }
          android {
              namespace = "com.amelia.p3"
              compileSdk = 34
              defaultConfig {
                  // P3.1 installs beside the sealed P3 app, preserving its local record.
                  applicationId = "com.amelia.p31"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.4-android-p3-cohort"
                  ndk { abiFilters += listOf("armeabi-v7a", "arm64-v8a") }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          kotlin { jvmToolchain(17) }
          chaquopy { defaultConfig { version = "3.11" } }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:name="com.chaquo.python.android.PyApplication" android:allowBackup="true" android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          echo '<resources><string name="app_name">Amelia P3 Cohort</string></resources>' > app/src/main/res/values/strings.xml

          cat > app/src/main/python/p3_cohort_assay.py <<'EOF'
          """Android-P3: sealed prospective ProcessFieldMemory matched-state cohort.

          It is a local, deterministic engineering assay. It contains no language model,
          free-text steering, target vector, outcome blueprint, or relay in its causal path.
          """
          from __future__ import annotations
          import hashlib, json, math, threading, time
          from pathlib import Path

          try:
              from p3_build_provenance import BUILD_PROVENANCE
          except Exception:
              BUILD_PROVENANCE = {"revision": "source-only-validation"}

          N, ETA, KAPPA, W = 10, 0.05, 0.25, 20
          DEPTHS, PARENTS, REPS = (128, 256, 384, 432, 480, 512), (101, 202, 303), 10
          CONDITIONS = ("HISTORY_RETAINED", "ABLATED", "NEUTRAL_RESET", "TENSOR_PERMUTED")
          SCHEMA, LEDGER_SCHEMA = "amelia-android-p3-prospective-cohort-v1", "amelia-android-p3-ledger-v1"
          ZERO_FIELD = [round(1.0 / N, 12) for _ in range(N)]
          LOCK, INSTANCES = threading.RLock(), {}

          def canon(v): return json.dumps(v, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
          def dig(v): return hashlib.sha256(canon(v).encode("utf-8")).hexdigest()
          def cp(v): return json.loads(canon(v))
          def norm(v):
              v = [max(0.0, float(x)) for x in v]; total = sum(v)
              if total <= 0: return list(ZERO_FIELD)
              out = [round(x / total, 12) for x in v]; out[-1] = round(1.0 - sum(out[:-1]), 12); return out
          def zero(): return [[0.0 for _ in range(N)] for _ in range(N)]
          def td(t): return dig([[round(float(x), 12) for x in row] for row in t])
          def fd(f): return dig([round(float(x), 12) for x in f])
          def tnorm(t): return round(math.sqrt(sum(float(x) ** 2 for row in t for x in row)), 12)
          def baseline():
              return [[round((0.008 if r == c else 0.0) + (0.004 if r + c == N - 1 else 0.0), 12) for c in range(N)] for r in range(N)]
          M0 = baseline()

          class Mulberry32:
              def __init__(self, seed): self.s = int(seed) & 0xffffffff
              def random(self):
                  self.s = (self.s + 0x6D2B79F5) & 0xffffffff; t = self.s
                  t = ((t ^ (t >> 15)) * (t | 1)) & 0xffffffff
                  t ^= (t + (((t ^ (t >> 7)) * (t | 61)) & 0xffffffff)) & 0xffffffff
                  return ((t ^ (t >> 14)) & 0xffffffff) / 4294967296.0

          def child_seed(parent, depth, rep):
              return int(dig({"algorithm": "sha256-first-32bits-v1", "namespace": "amelia-p3-donor", "parentSeed": parent, "depth": depth, "replicate": rep})[:8], 16)
          def seeded_field(seed):
              rng = Mulberry32(seed); return norm([0.70 + rng.random() + 0.07 * ((seed + z) % 3) for z in range(N)])
          def chassis():
              return {"schema": "amelia-p3-matched-non-pfm-chassis-v1", "fieldState": norm([.93,1.07,1.01,.97,1.05,.95,1.03,.99,1.09,.91]), "sequence": 0, "activeAttractors": [], "lastStability": 1.0, "nativeRegime": "SYZYGETIC_GRID", "nativeAdmissibility": {"operator": "bounded-tension-v1", "externalSteering": False, "targetVector": None, "relay": None}}
          def projection(s):
              return {k: cp(s[k]) if isinstance(s[k], (list, dict)) else s[k] for k in ("fieldState", "sequence", "activeAttractors", "lastStability", "nativeRegime", "nativeAdmissibility")}
          def mbias(t):
              return norm([sum(abs(float(x)) for x in row) for row in t])
          def edges(z): return [{"to": (z + 1) % N, "kind": "ring"}, {"to": N - 1 - z, "kind": "syzygy"}, {"to": (z + 3) % N, "kind": "diagonal"}]
          def route(k):
              a = max(range(N), key=lambda z: (k[z], -z)); e1 = max(edges(a), key=lambda e: (k[e["to"]], -e["to"])); b = e1["to"]
              e2 = max([e for e in edges(b) if e["to"] != a], key=lambda e: (k[e["to"]], -e["to"])); c = e2["to"]
              return [a,b,c], [{"from":a,"to":b,"kind":e1["kind"]},{"from":b,"to":c,"kind":e2["kind"]}]
          def flux(k): return round(.03 * sum(abs(k[z] - k[N - 1 - z]) for z in range(N // 2)) / (N // 2), 12)
          def update_tensor(old, target, f):
              nxt = zero()
              for r in range(N):
                  for c in range(N):
                      v = float(old[r][c]) * (1.0 - .12 * ETA)
                      if r == target or c == target: v += f * ((ETA / .05) ** .08)
                      if r + c == N - 1: v += KAPPA * .02
                      nxt[r][c] = round(min(1.0, max(0.0, v)), 12)
              return nxt

          def conditioning_step(field, tensor, rng, source_id, step):
              pre, old = list(field), cp(tensor); drive = norm([.35 + rng.random() + .05 * ((step + z) % 4) for z in range(N)]); mem = mbias(old)
              k = norm([.34*pre[z] + .34*drive[z] + .16*mem[z] + .09*pre[(z-1)%N] + .07*pre[N-1-z] for z in range(N)])
              r, es = route(k); f = flux(k); post = norm([.84*k[z] + .10*k[(z-1)%N] + .06*k[N-1-z] for z in range(N)]); post[r[0]] += .024 + .012 * mem[r[0]]; post = norm(post); nt = update_tensor(old, r[0], f)
              # Compact append-only raw tuple: step, three selected zones, scaled flux,
              # and scaled terminal tensor norm. The enclosing trace digest binds the full sequence.
              raw = [step, r[0], r[1], r[2], int(round(f * 1000000000000)), int(round(tnorm(nt) * 1000000000000))]
              return post, nt, raw
          def donor(parent, depth, rep):
              seed, sid = child_seed(parent, depth, rep), f"D{depth}-R{rep:02d}-P{parent}"; rng = Mulberry32(seed); field, tensor, rows = seeded_field(seed), zero(), []
              for step in range(1, depth + 1): field, tensor, raw = conditioning_step(field, tensor, rng, sid, step); rows.append(raw)
              out = {"schema":"amelia-p3-donor-source-v1","sourceId":sid,"parentSeed":parent,"childSeed":seed,"depth":depth,"replicate":rep,"conditioningOperator":"seeded-native-conditioning-v1","terminalConditioningField":field,"deformationTensor":tensor,"tensorDigest":td(tensor),"conditioningTraceDigest":dig(rows),"conditioningSteps":depth}
              out["sourceDigest"] = dig(out); return out, rows

          def text_request(raw_input):
              canonical_input = " ".join(raw_input.casefold().split())
              bins = [0.0] * N
              for position, character in enumerate(canonical_input):
                  if "a" <= character <= "z": weight = ord(character) - 96
                  elif character.isdigit(): weight = int(character) + 1
                  else: continue
                  bins[(position + weight) % N] += weight
              if not any(bins): bins[0] = 1.0
              return {"rawInput":raw_input,"canonicalInput":canonical_input,"inputDigest":hashlib.sha256(canonical_input.encode("utf-8")).hexdigest(),"drive":norm(bins)}
          def dialogue_step(state, tensor, request):
              pre, old, drive = list(state["fieldState"]), cp(tensor), request["drive"]; mem = mbias(old)
              k = norm([.37*pre[z] + .37*drive[z] + .16*mem[z] + .05*pre[(z-1)%N] + .05*pre[N-1-z] for z in range(N)])
              r, es = route(k); f = flux(k); post = norm([.88*k[z] + .07*k[(z-1)%N] + .05*k[N-1-z] for z in range(N)]); post[r[0]] += .028 + .014*mem[r[0]]; post = norm(post); nt = update_tensor(old, r[0], f); top=max(post)
              next_state={"schema":"amelia-p3-dialogue-memory-v1","sequence":int(state["sequence"])+1,"fieldState":post,"deformationTensor":nt,"activeAttractors":[z for z,x in enumerate(post) if x>=top*.92],"lastStability":round(max(0.0,1.0-sum(abs(pre[z]-post[z]) for z in range(N))/2.0),12)}
              modules=["numogram_routing","process_field_memory","rhizomatic_recombination"]
              if f >= .001: modules.insert(1,"syzygetic_coupling")
              trace={"schema":"amelia-p3-dialogue-trace-v1","sequence":next_state["sequence"],"inputDigest":request["inputDigest"],"route":r,"routeEdges":es,"modules":modules,"kernelDeltaL1":round(sum(abs(pre[z]-k[z]) for z in range(N)),12),"syzygyFlux":f,"preTensorNorm":tnorm(old),"postTensorNorm":tnorm(nt),"stability":next_state["lastStability"],"activeAttractors":next_state["activeAttractors"]}; trace["causalDigest"]=dig(trace)
              return next_state, trace
          def dialogue_response(request, trace):
              route_text=" → ".join(f"Z{zone}" for zone in trace["route"])
              module_text=", ".join(trace["modules"])
              tokens=[token for token in request["canonicalInput"].split() if len(token)>=3][:4]
              signature=", ".join(tokens) if tokens else "the declared prompt"
              stage=["undivided potential","differential activation","lateral recombination","threshold articulation","hinge pressure","reciprocal coupling","syzygetic return","temporal dispersion","distributed relay","terminal modulation"]
              image="; ".join(stage[zone] for zone in trace["route"])
              return f"The local prompt signature ({signature}) was reduced into a Numogram drive and passed through {route_text}: {image}. Active processes: {module_text}. This dialogue memory is local and separate from the sealed P3 cohort; the cohort’s source states, branch records, and scores are unchanged."

          def return_step(state, tensor, condition, branch_id, step, seal):
              pre, old = list(state["fieldState"]), cp(tensor); mem = mbias(old)
              k = norm([.47*pre[z] + .24*mem[z] + .11*pre[(z-1)%N] + .11*pre[(z+1)%N] + .07*pre[N-1-z] for z in range(N)])
              r, es = route(k); f = flux(k); tension = round(sum(abs(pre[z] - mem[z]) for z in range(N)) / 2.0, 12); weight = round(max(.80, 1.0 - .12 * tension), 12)
              post = norm([.86*k[z] + .08*k[(z-1)%N] + .06*k[N-1-z] for z in range(N)]); post[r[0]] += (.022 + .018 * mem[r[0]]) * weight; post = norm(post); nt = update_tensor(old, r[0], f); top = max(post)
              next_state = {**cp(state), "fieldState":post, "sequence":int(state["sequence"])+1, "activeAttractors":[z for z,x in enumerate(post) if x >= top*.92], "lastStability":round(max(0.0, 1.0 - sum(abs(pre[z]-post[z]) for z in range(N))/2.0),12)}
              # Compact append-only raw tuple: step, route, scaled flux/tension/weight/stability.
              # Source tensor, matched chassis, terminal tensor and rawStepsDigest remain separately inspectable.
              raw = [step, r[0], r[1], r[2], int(round(f * 1000000000000)), int(round(tension * 1000000000000)), int(round(weight * 1000000000000)), int(round(next_state["lastStability"] * 1000000000000))]
              return next_state, nt, raw
          def disk(field, tensor):
              strain = [sum(float(x) for x in row) for row in tensor]; weights = [field[z] * (1+.8*math.tanh(strain[z])) for z in range(N)]
              x, y = sum(weights[z]*math.cos(2*math.pi*z/N) for z in range(N)), sum(weights[z]*math.sin(2*math.pi*z/N) for z in range(N)); radius = math.hypot(x,y); tau = sum(abs(strain[z]-strain[N-1-z]) for z in range(N//2))/(N//2)
              if radius < 1e-12: return {"u":0.0,"v":0.0}
              rho = min(.95, math.tanh(1.5*radius+.05*tau)); return {"u":round(rho*x/radius,12),"v":round(rho*y/radius,12)}
          def dh(a,b):
              du,dv = a["u"]-b["u"], a["v"]-b["v"]; ra=min(.999999999999,a["u"]**2+a["v"]**2); rb=min(.999999999999,b["u"]**2+b["v"]**2)
              return round(math.acosh(max(1.0,1+2*(du*du+dv*dv)/((1-ra)*(1-rb)))),12)
          def branch(ch, tensor, condition, bid, source, recipient, donor_label, seal, config, regime):
              state, t, rows, start = cp(ch), cp(tensor), [], dig(projection(ch))
              for step in range(1,W+1): state,t,raw = return_step(state,t,condition,bid,step,seal); rows.append(raw)
              terminal = {"fieldState":state["fieldState"],"deformationTensor":t,"sequence":state["sequence"],"activeAttractors":state["activeAttractors"],"lastStability":state["lastStability"],"projection":disk(state["fieldState"],t)}
              out = {"schema":"amelia-p3-raw-return-branch-v1","branchId":bid,"sourceId":source["sourceId"],"sourceDigest":source["sourceDigest"],"condition":condition,"recipientLabel":recipient,"injectedDonorLabel":donor_label,"sealDigest":seal,"configDigest":config,"commonRegimeDigest":regime,"matchedChassisDigest":dig(ch),"observationProjectionDigest":start,"initialTensorDigest":td(tensor),"rawStepsDigest":dig(rows),"terminal":terminal,"injectedTensorDigest":td(tensor)}
              out["returnDigest"] = dig(terminal); out["causalDigest"] = dig(out); return out, rows
          def pairs(items):
              keys = sorted(items); return [{"pair":f"{keys[i]}/{keys[j]}","D20":dh(items[keys[i]],items[keys[j]])} for i in range(len(keys)) for j in range(i+1,len(keys))]

          class Cohort:
              def __init__(self, root):
                  self.root=Path(root); self.root.mkdir(parents=True,exist_ok=True); self.state_path=self.root/"p3-state.json"; self.ledger_path=self.root/"p3-ledger.jsonl"; self.head_path=self.root/"p3-ledger-head.txt"; self.dialogue_path=self.root/"p3-dialogue-memory.json"; self.dialogue_ledger_path=self.root/"p3-dialogue-ledger.jsonl"; self.dialogue_head_path=self.root/"p3-dialogue-ledger-head.txt"; self.data=self.load(); self.head=self.head_path.read_text().strip() if self.head_path.exists() else "0"*64; self.dialogue=self.load_dialogue(); self.dialogue_head=self.dialogue_head_path.read_text().strip() if self.dialogue_head_path.exists() else "0"*64; self.ch=chassis(); self.proj=projection(self.ch)
                  self.regime={"name":"SYZYGETIC_GRID","operator":"native-return-v1","eta":ETA,"kappa":KAPPA,"externalSteering":False,"targetVector":None,"outcomeBlueprint":None,"relaySteering":False,"languageModelInCausalLoop":False}
                  self.config={"schema":SCHEMA,"parentSeeds":list(PARENTS),"depths":list(DEPTHS),"replicatesPerDepth":REPS,"conditions":list(CONDITIONS),"observationWindow":{"steps":W,"indices":list(range(W)),"earlyStop":False,"mode":"unguided-native"},"childSeedDerivation":"sha256-first-32bits-v1(parentSeed,depth,replicate)","matchedChassis":self.ch,"observationProjection":self.proj,"commonRegime":self.regime,"controls":{"HISTORY_RETAINED":"actual donor tensor","ABLATED":"zero tensor","NEUTRAL_RESET":"same non-zero canonical M0","TENSOR_PERMUTED":"cyclic donor-tensor transfer across recipient labels"},"rawBeforeScoring":True,"compactRawTupleLayout":{"conditioning":["step","route0","route1","route2","fluxX1e12","postTensorNormX1e12"],"return":["step","route0","route1","route2","fluxX1e12","tensionX1e12","admissibilityX1e12","stabilityX1e12"]},"measurement":{"projection":"regular-decagon open disk","distance":"hyperbolic Poincare D20","triadSummary":"mean of three within-triad pairwise distances","depthSummary":"mean of ten triad summaries; descriptive only"},"claimsBoundary":"bounded Android implementation; no consciousness, autopoiesis, biological, or population inference; its numeric D20 values are not a reproduction claim for a separately sealed external result","sourceProvenance":BUILD_PROVENANCE}; self.config_digest=dig(self.config)
              def load(self):
                  if not self.state_path.exists(): return {"schema":SCHEMA,"cohortCounter":0,"resetCounter":0,"last":None}
                  value=json.loads(self.state_path.read_text());
                  if value.get("schema") != SCHEMA: raise ValueError("Invalid Android-P3 cohort state")
                  return value
              def save(self):
                  tmp=self.state_path.with_suffix(".tmp"); tmp.write_text(canon(self.data)); tmp.replace(self.state_path)
              def fresh_dialogue(self): return {"schema":"amelia-p3-dialogue-memory-v1","sequence":0,"fieldState":list(ZERO_FIELD),"deformationTensor":zero(),"activeAttractors":[],"lastStability":1.0}
              def load_dialogue(self):
                  if not self.dialogue_path.exists(): return self.fresh_dialogue()
                  value=json.loads(self.dialogue_path.read_text())
                  if value.get("schema")!="amelia-p3-dialogue-memory-v1": raise ValueError("Invalid Android-P3 dialogue memory")
                  return value
              def save_dialogue(self):
                  tmp=self.dialogue_path.with_suffix(".tmp"); tmp.write_text(canon(self.dialogue)); tmp.replace(self.dialogue_path)
              def append(self, kind, payload):
                  record={"schema":LEDGER_SCHEMA,"kind":kind,"previous":self.head,"payload":payload}; record["recordDigest"]=dig(record); record["chainDigest"]=dig({"previous":self.head,"record":record["recordDigest"]})
                  with self.ledger_path.open("a",encoding="utf-8") as f: f.write(canon(record)+"\n")
                  self.head=record["chainDigest"]; tmp=self.head_path.with_suffix(".tmp"); tmp.write_text(self.head); tmp.replace(self.head_path); return self.head
              def append_dialogue(self, kind, payload):
                  record={"schema":"amelia-p3-dialogue-ledger-v1","kind":kind,"previous":self.dialogue_head,"payload":payload}; record["recordDigest"]=dig(record); record["chainDigest"]=dig({"previous":self.dialogue_head,"record":record["recordDigest"]})
                  with self.dialogue_ledger_path.open("a",encoding="utf-8") as f: f.write(canon(record)+"\n")
                  self.dialogue_head=record["chainDigest"]; tmp=self.dialogue_head_path.with_suffix(".tmp"); tmp.write_text(self.dialogue_head); tmp.replace(self.dialogue_head_path); return self.dialogue_head
              def manifest(self, eid, created):
                  cond=sum(DEPTHS)*REPS*len(PARENTS); ret=len(DEPTHS)*REPS*len(PARENTS)*len(CONDITIONS)*W
                  return {"schema":"amelia-p3-prospective-manifest-v1","studyId":"AMELIA-ANDROID-P3-PROSPECTIVE-COHORT","executionId":eid,"createdUtc":created,"schedule":{"depths":list(DEPTHS),"parentSeeds":list(PARENTS),"replicatesPerDepth":REPS,"triads":len(DEPTHS)*REPS,"donorSources":len(DEPTHS)*REPS*len(PARENTS),"forkBranches":len(DEPTHS)*REPS*len(PARENTS)*len(CONDITIONS),"conditioningSteps":cond,"returnSteps":ret,"totalRawSteps":cond+ret},"configDigest":self.config_digest,"matchedChassisDigest":dig(self.ch),"matchedChassisUtf8Bytes":len(canon(self.ch).encode()),"observationProjectionDigest":dig(self.proj),"commonRegimeDigest":dig(self.regime),"canonicalBaselineTensorDigest":td(M0),"zeroTensorDigest":td(zero()),"rawBeforeScoring":True,"scoringGate":"No descriptive measurement until all donor and return raw records are append-only logged.","protocol":self.config}
              def triad(self, depth, rep, eid, seal, logging):
                  ds=[]
                  for parent in PARENTS:
                      d, rows=donor(parent,depth,rep)
                      if logging: self.append("cohort_raw_conditioning_source",{"executionId":eid,"sealDigest":seal,"source":d,"rawSteps":rows})
                      ds.append(d)
                  if len({d["tensorDigest"] for d in ds}) != 3: raise ValueError(f"Fail closed: non-distinct donor tensor D{depth} R{rep}")
                  return {"depth":depth,"replicate":rep,"donors":ds,"branches":[]}
              def forks(self, ds, eid, seal, logging):
                  labels=[f"P{d['parentSeed']}" for d in ds]; bs=[]
                  for cond in CONDITIONS:
                      for i,source in enumerate(ds):
                          rec=labels[i]
                          if cond=="HISTORY_RETAINED": label,tensor=rec,source["deformationTensor"]
                          elif cond=="ABLATED": label,tensor="ZERO",zero()
                          elif cond=="NEUTRAL_RESET": label,tensor="M0",M0
                          else: label,tensor=labels[(i+1)%3],ds[(i+1)%3]["deformationTensor"]
                          bid=f"{source['sourceId']}:{cond}:{rec}<-{label}"; b,rows=branch(self.ch,tensor,cond,bid,source,rec,label,seal,self.config_digest,dig(self.regime)); b["executionId"]=eid
                          if logging: self.append("cohort_raw_return_branch",{"executionId":eid,"sealDigest":seal,"branch":b,"rawSteps":rows})
                          bs.append(b)
                  return bs
              def score(self, triads, m, source_head, return_head):
                  gates={"rawRecordedBeforeScoring":bool(source_head) and bool(return_head),"matchedNonPfmState":True,"commonRegime":True,"observationProjection":True,"distinctDonorTensors":True,"sameTensorReturnIdentity":True,"nullControlCollapse":True,"historyRetainedPositive":True,"sourceSnapshotsUnmutated":True}; expected={"sources":{},"branches":{}}; records=[]
                  for tr in triads:
                      ds,bs=tr["donors"],tr["branches"]; before={d["sourceId"]:d["sourceDigest"] for d in ds}; by={c:[] for c in CONDITIONS}
                      for d in ds: expected["sources"][d["sourceId"]]={"sourceDigest":d["sourceDigest"],"tensorDigest":d["tensorDigest"],"conditioningTraceDigest":d["conditioningTraceDigest"]}
                      for b in bs:
                          by[b["condition"]].append(b); expected["branches"][b["branchId"]]={"causalDigest":b["causalDigest"],"returnDigest":b["returnDigest"],"sourceDigest":b["sourceDigest"],"injectedTensorDigest":b["injectedTensorDigest"]}
                          gates["matchedNonPfmState"] &= b["matchedChassisDigest"]==m["matchedChassisDigest"]; gates["observationProjection"] &= b["observationProjectionDigest"]==m["observationProjectionDigest"]; gates["commonRegime"] &= b["commonRegimeDigest"]==m["commonRegimeDigest"]
                      measures={}
                      for c,arms in by.items():
                          points={a["recipientLabel"]:a["terminal"]["projection"] for a in arms}; ps=pairs(points); measures[c]={"pairwiseD20":ps,"triadMeanD20":round(sum(x["D20"] for x in ps)/len(ps),12)}
                      gates["nullControlCollapse"] &= len({a["returnDigest"] for a in by["ABLATED"]})==1 and len({a["returnDigest"] for a in by["NEUTRAL_RESET"]})==1 and measures["ABLATED"]["triadMeanD20"]==0.0 and measures["NEUTRAL_RESET"]["triadMeanD20"]==0.0
                      gates["historyRetainedPositive"] &= measures["HISTORY_RETAINED"]["triadMeanD20"]>0.0
                      hist={a["injectedTensorDigest"]:a for a in by["HISTORY_RETAINED"]}
                      gates["sameTensorReturnIdentity"] &= all(hist.get(a["injectedTensorDigest"],{}).get("returnDigest")==a["returnDigest"] for a in by["TENSOR_PERMUTED"])
                      gates["sourceSnapshotsUnmutated"] &= before=={d["sourceId"]:d["sourceDigest"] for d in ds}; records.append({"depth":tr["depth"],"replicate":tr["replicate"],"donorTensorDigests":[d["tensorDigest"] for d in ds],"measurements":measures})
                  summaries=[]
                  for depth in DEPTHS:
                      rs=[r for r in records if r["depth"]==depth]; item={"depth":depth,"replicateTriads":len(rs)}
                      for c in CONDITIONS: item[c]=round(sum(r["measurements"][c]["triadMeanD20"] for r in rs)/len(rs),12)
                      summaries.append(item)
                  summary={"schema":"amelia-p3-descriptive-summary-v1","executionId":m["executionId"],"sealDigest":m["sealDigest"],"rawConditioningLedgerHead":source_head,"rawReturnLedgerHead":return_head,"triadMeasurements":records,"depthSummaries":summaries,"interpretation":"descriptive matched-state output only; no population or ontological inference"}
                  return summary,gates,expected
              def run(self):
                  self.data["cohortCounter"]+=1; created=time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()); eid="P3-COHORT-"+dig({"counter":self.data["cohortCounter"],"createdUtc":created,"configDigest":self.config_digest})[:16]; m=self.manifest(eid,created); m["sealDigest"]=dig(m); seal_head=self.append("cohort_manifest_sealed_before_execution",m); triads=[]
                  try:
                      for depth in DEPTHS:
                          for rep in range(1,REPS+1): triads.append(self.triad(depth,rep,eid,m["sealDigest"],True))
                      source_head=self.append("cohort_all_donor_sources_logged_before_returns",{"executionId":eid,"sealDigest":m["sealDigest"],"sourceDigests":{d["sourceId"]:d["sourceDigest"] for tr in triads for d in tr["donors"]}})
                      for tr in triads: tr["branches"]=self.forks(tr["donors"],eid,m["sealDigest"],True)
                      return_head=self.append("cohort_all_raw_returns_logged_before_scoring",{"executionId":eid,"sealDigest":m["sealDigest"],"branchCausalDigests":{b["branchId"]:b["causalDigest"] for tr in triads for b in tr["branches"]}})
                      summary,gates,expected=self.score(triads,m,source_head,return_head); measure_head=self.append("cohort_descriptive_summary_after_raw",{"summary":summary,"gates":gates}); self.data["last"]={"manifest":m,"expected":expected,"gates":gates,"depthSummaries":summary["depthSummaries"],"ledger":{"seal":seal_head,"sources":source_head,"returns":return_head,"measurement":measure_head}}; self.save()
                      bad=[k for k,v in gates.items() if not v]
                      if bad: raise ValueError("Fail closed: "+", ".join(bad))
                      return {"ok":True,"kind":"cohort","manifest":{k:m[k] for k in ("executionId","sealDigest","schedule","configDigest","matchedChassisDigest","observationProjectionDigest","commonRegimeDigest")},"gates":gates,"depthSummaries":summary["depthSummaries"],"ledger":self.data["last"]["ledger"]}
                  except Exception as e:
                      self.append("cohort_execution_failure",{"executionId":eid,"sealDigest":m["sealDigest"],"errorType":type(e).__name__,"error":str(e)}); self.save(); raise
              def verify(self):
                  last=self.data.get("last")
                  if not last: raise ValueError("Run the predeclared P3 cohort before verification")
                  m=last["manifest"]; sm,bm={},{}
                  for depth in DEPTHS:
                      for rep in range(1,REPS+1):
                          tr=self.triad(depth,rep,m["executionId"],m["sealDigest"],False); tr["branches"]=self.forks(tr["donors"],m["executionId"],m["sealDigest"],False)
                          for d in tr["donors"]:
                              e=last["expected"]["sources"].get(d["sourceId"],{}); sm[d["sourceId"]]=e.get("sourceDigest")==d["sourceDigest"] and e.get("tensorDigest")==d["tensorDigest"] and e.get("conditioningTraceDigest")==d["conditioningTraceDigest"]
                          for b in tr["branches"]:
                              e=last["expected"]["branches"].get(b["branchId"],{}); bm[b["branchId"]]=e.get("causalDigest")==b["causalDigest"] and e.get("returnDigest")==b["returnDigest"]
                  ok=all(sm.values()) and all(bm.values()) and len(sm)==m["schedule"]["donorSources"] and len(bm)==m["schedule"]["forkBranches"]; head=self.append("cohort_deterministic_replay_verification",{"executionId":m["executionId"],"sealDigest":m["sealDigest"],"sourcesMatched":sum(sm.values()),"sourcesExpected":len(sm),"branchesMatched":sum(bm.values()),"branchesExpected":len(bm),"allMatch":ok})
                  return {"ok":True,"kind":"verify","executionId":m["executionId"],"sourcesMatched":sum(sm.values()),"sourcesExpected":len(sm),"branchesMatched":sum(bm.values()),"branchesExpected":len(bm),"allMatch":ok,"ledgerHead":head}
              def dialogue_turn(self, raw_input):
                  if not raw_input or not raw_input.strip(): raise ValueError("Write a local prompt for Amelia")
                  before_cohort=dig(self.data.get("last")); request=text_request(raw_input.strip()); next_state,trace=dialogue_step(self.dialogue,self.dialogue["deformationTensor"],request); self.dialogue=next_state; self.save_dialogue(); after_cohort=dig(self.data.get("last")); unchanged=before_cohort==after_cohort
                  head=self.append_dialogue("local_dialogue_turn",{"request":request,"trace":trace,"cohortRecordUnchanged":unchanged})
                  return {"ok":True,"kind":"dialogue","response":dialogue_response(request,trace),"trace":trace,"cohortRecordUnchanged":unchanged,"dialogueLedgerHead":head}
              def reset_dialogue(self):
                  self.dialogue=self.fresh_dialogue(); self.save_dialogue(); head=self.append_dialogue("explicit_dialogue_memory_reset",{"sequence":0,"cohortRecordUnchanged":True}); return {"ok":True,"kind":"dialogue_reset","sequence":0,"dialogueLedgerHead":head}
              def reset(self):
                  self.data["last"]=None; self.data["resetCounter"]+=1; self.save(); head=self.append("explicit_p3_active_record_reset",{"cohortCounter":self.data["cohortCounter"],"resetCounter":self.data["resetCounter"],"rawLedgerRetained":True}); return {"ok":True,"kind":"reset","cohortCounter":self.data["cohortCounter"],"resetCounter":self.data["resetCounter"],"ledgerHead":head}

          def instance(root):
              key=str(Path(root))
              if key not in INSTANCES: INSTANCES[key]=Cohort(key)
              return INSTANCES[key]
          def guarded(action):
              try:
                  with LOCK: return json.dumps(action(),ensure_ascii=False,sort_keys=True)
              except Exception as e: return json.dumps({"ok":False,"errorType":type(e).__name__,"error":str(e)},ensure_ascii=False,sort_keys=True)
          def run_predeclared_cohort(storage_dir): return guarded(lambda:instance(storage_dir).run())
          def verify_last_cohort(storage_dir): return guarded(lambda:instance(storage_dir).verify())
          def run_dialogue_turn(raw_input, storage_dir): return guarded(lambda:instance(storage_dir).dialogue_turn(raw_input))
          def reset_dialogue_memory(storage_dir): return guarded(lambda:instance(storage_dir).reset_dialogue())
          def reset_p3(storage_dir): return guarded(lambda:instance(storage_dir).reset())
          EOF

          P3_SOURCE_SHA="$(sha256sum app/src/main/python/p3_cohort_assay.py | awk '{print $1}')"
          CORE_SOURCE_SHA="$(sha256sum app/src/main/python/amelia_symbolic_core.py | awk '{print $1}')"
          BUILD_REVISION="${GITHUB_SHA:-local}"
          cat > app/src/main/python/p3_build_provenance.py <<EOF
          BUILD_PROVENANCE = {
              "workflow": "android-p3-prospective-cohort",
              "p3CohortAssaySha256": "${P3_SOURCE_SHA}",
              "symbolicCoreSha256": "${CORE_SOURCE_SHA}",
              "revision": "${BUILD_REVISION}",
          }
          EOF

          cat > app/src/main/java/com/amelia/p3/MainActivity.kt <<'EOF'
          package com.amelia.p3

          import android.app.Activity
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.chaquo.python.Python
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.Locale

          class MainActivity : Activity() {
              private lateinit var output: TextView
              private lateinit var telemetry: TextView
              private lateinit var prompt: EditText
              private val controls = mutableListOf<Button>()
              private val storageDir by lazy { File(filesDir, "amelia_p3").apply { mkdirs() }.absolutePath }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(16), dp(16), dp(16)) }
                  root.addView(TextView(this).apply { text = "AMELIA · ANDROID-P3.1"; textSize = 23f; gravity = Gravity.CENTER_HORIZONTAL })
                  root.addView(TextView(this).apply { text = "Prospective matched-state cohort · no language model in causal loop"; textSize = 12f; gravity = Gravity.CENTER_HORIZONTAL; setPadding(0, dp(5), 0, dp(6)) })
                  root.addView(TextView(this).apply { text = "D=128, 256, 384, 432, 480, 512 · 10 triads/depth · W=20"; textSize = 12f; gravity = Gravity.CENTER_HORIZONTAL; setPadding(0, 0, 0, dp(8)) })
                  val readout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  output = TextView(this).apply { text = "The dialogue lane is local to Amelia and has its own process memory. It never enters the sealed P3 cohort, whose 180 donor sources, 720 return branches, and 80,160 raw records remain fixed."; textSize = 15f; setPadding(0, dp(8), 0, dp(8)) }
                  telemetry = TextView(this).apply { text = "TELEMETRY · dialogue and cohort records are separate."; textSize = 13f; setPadding(dp(8), dp(8), dp(8), dp(8)) }
                  readout.addView(output); readout.addView(telemetry)
                  root.addView(ScrollView(this).apply { addView(readout) }, LinearLayout.LayoutParams(-1, 0, 1f))
                  root.addView(TextView(this).apply { text = "LOCAL AMELIA DIALOGUE · NOT A P3 COHORT INPUT"; textSize = 12f; setPadding(0, dp(4), 0, 0) })
                  prompt = EditText(this).apply { hint = "Write to Amelia"; inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE; minLines = 2; maxLines = 3 }
                  root.addView(prompt)
                  root.addView(action("SEND TO AMELIA", "run_dialogue_turn", true))
                  root.addView(action("RESET DIALOGUE MEMORY", "reset_dialogue_memory"))
                  root.addView(TextView(this).apply { text = "SEALED P3 COHORT · NOT AFFECTED BY DIALOGUE"; textSize = 12f; setPadding(0, dp(5), 0, 0) })
                  root.addView(action("SEAL & RUN PREDECLARED P3 COHORT", "run_predeclared_cohort"))
                  root.addView(action("VERIFY LAST COHORT REPLAY", "verify_last_cohort"))
                  root.addView(action("RESET ACTIVE P3 RECORD", "reset_p3"))
                  setContentView(root)
              }

              private fun action(label: String, fn: String, needsPrompt: Boolean = false) = Button(this).apply { text = label; setOnClickListener { if (needsPrompt) submitDialogue() else invoke(fn) }; controls.add(this) }
              private fun submitDialogue() {
                  val text = prompt.text.toString().trim()
                  if (text.isEmpty()) { output.text = "Write a local prompt before sending it to Amelia."; return }
                  invoke("run_dialogue_turn", text)
              }
              private fun invoke(fn: String, input: String? = null) {
                  controls.forEach { it.isEnabled = false }
                  output.text = when (fn) { "run_predeclared_cohort" -> "P3 constructing the sealed cohort. All raw records are written before a descriptive summary..."; "run_dialogue_turn" -> "Amelia local substrate dialogue processing..."; else -> "P3 provenance operation running..." }
                  Thread {
                      val raw = try { val module = Python.getInstance().getModule("p3_cohort_assay"); if (input == null) module.callAttr(fn, storageDir).toString() else module.callAttr(fn, input, storageDir).toString() } catch (e: Exception) { JSONObject().put("ok", false).put("error", e.message ?: "Android/Python failure").toString() }
                      runOnUiThread { render(raw); if (input != null) prompt.setText(""); controls.forEach { it.isEnabled = true } }
                  }.start()
              }
              private fun render(raw: String) {
                  val r = JSONObject(raw)
                  if (!r.optBoolean("ok", false)) { output.text = "P3 FAIL-CLOSED · do not interpret an outcome."; telemetry.text = "TELEMETRY · ERROR\n${r.optString("error")}"; return }
                  when (r.optString("kind")) { "dialogue" -> dialogue(r); "dialogue_reset" -> dialogueReset(r); "cohort" -> cohort(r); "verify" -> verify(r); else -> reset(r) }
              }
              private fun dialogue(r: JSONObject) {
                  val t=r.getJSONObject("trace")
                  output.text="AMELIA LOCAL SUBSTRATE DIALOGUE\n\n${r.optString("response")}\n\nRoute: ${zones(t.getJSONArray("route"))}\nModules: ${t.getJSONArray("modules").joinText()}"
                  telemetry.text="DIALOGUE TELEMETRY\nTurn: ${t.optInt("sequence")}\nInput: ${short(t.optString("inputDigest"))}\nTensor: ${n(t.optDouble("preTensorNorm"))} → ${n(t.optDouble("postTensorNorm"))}\nFlux: ${n(t.optDouble("syzygyFlux"))}\nCohort record unchanged: ${r.optBoolean("cohortRecordUnchanged")}\nDialogue ledger: ${short(r.optString("dialogueLedgerHead"))}"
              }
              private fun dialogueReset(r: JSONObject) { output.text="Amelia dialogue memory reset. The P3 cohort record is unchanged."; telemetry.text="DIALOGUE RESET\nSequence: ${r.optInt("sequence")}\nDialogue ledger: ${short(r.optString("dialogueLedgerHead"))}" }
              private fun cohort(r: JSONObject) {
                  val m=r.getJSONObject("manifest"); val s=m.getJSONObject("schedule"); val g=r.getJSONObject("gates"); val l=r.getJSONObject("ledger")
                  output.text = "P3 SEALED PROSPECTIVE COHORT\n\nExecution: ${m.optString("executionId")}\nSeal: ${short(m.optString("sealDigest"))}\n\n${s.optInt("triads")} triads · ${s.optInt("donorSources")} donor sources · ${s.optInt("forkBranches")} return branches\n${s.optInt("conditioningSteps")} conditioning + ${s.optInt("returnSteps")} return = ${s.optInt("totalRawSteps")} raw steps\n\nAndroid-P3 implementation readout only; not a claim to reproduce a separate sealed result.\n\n${depths(r.getJSONArray("depthSummaries"))}"
                  telemetry.text = "PROVENANCE GATES\nRaw before scoring: ${g.optBoolean("rawRecordedBeforeScoring")}\nMatched non-PFM chassis: ${g.optBoolean("matchedNonPfmState")}\nProjection identity: ${g.optBoolean("observationProjection")}\nDistinct donor tensors: ${g.optBoolean("distinctDonorTensors")}\nSame-tensor transfer: ${g.optBoolean("sameTensorReturnIdentity")}\nNull-control collapse: ${g.optBoolean("nullControlCollapse")}\nRetained D20 positive: ${g.optBoolean("historyRetainedPositive")}\n\nRaw: ${short(l.optString("returns"))}\nSummary: ${short(l.optString("measurement"))}"
              }
              private fun verify(r: JSONObject) { output.text=if(r.optBoolean("allMatch")) "P3 COHORT VERIFIED · every sealed source and return branch reproduced." else "P3 COHORT MISMATCH · do not interpret outcomes."; telemetry.text="DETERMINISTIC REPLAY\nSources: ${r.optInt("sourcesMatched")}/${r.optInt("sourcesExpected")}\nBranches: ${r.optInt("branchesMatched")}/${r.optInt("branchesExpected")}\nLedger: ${short(r.optString("ledgerHead"))}" }
              private fun reset(r: JSONObject) { output.text="P3 active cohort record reset. The append-only provenance ledger is retained."; telemetry.text="RESET\nCohort counter: ${r.optInt("cohortCounter")}\nReset counter: ${r.optInt("resetCounter")}\nLedger: ${short(r.optString("ledgerHead"))}" }
              private fun depths(a: JSONArray)=(0 until a.length()).joinToString("\n") { i -> val d=a.getJSONObject(i); "D=${d.optInt("depth")}: retained=${n(d.optDouble("HISTORY_RETAINED"))}; ablated=${n(d.optDouble("ABLATED"))}; reset=${n(d.optDouble("NEUTRAL_RESET"))}; permuted=${n(d.optDouble("TENSOR_PERMUTED"))}" }
              private fun zones(a: JSONArray)=(0 until a.length()).joinToString(" → ") { i -> "Z${a.optInt(i)}" }
              private fun JSONArray.joinText()=(0 until length()).joinToString(", ") { i -> optString(i) }
              private fun n(v: Double)=String.format(Locale.US,"%.6f",v)
              private fun short(v: String)=if(v.length<=12)v else v.take(12)
              private fun dp(v: Int)=(v*resources.displayMetrics.density).toInt()
          }
          EOF

      - name: Validate P3 dialogue isolation and prospective provenance gates
        run: |
          python3 -m py_compile app/src/main/python/amelia_symbolic_core.py app/src/main/python/p3_cohort_assay.py app/src/main/python/p3_build_provenance.py
          P3_TEST_DIR="$(mktemp -d)"; export P3_TEST_DIR
          PYTHONPATH=app/src/main/python python3 - <<'PY'
          import json, os
          from p3_cohort_assay import run_dialogue_turn, run_predeclared_cohort, verify_last_cohort
          root = os.environ["P3_TEST_DIR"]
          dialogue = json.loads(run_dialogue_turn("A declared local dialogue probe", root))
          assert dialogue["ok"] and dialogue["kind"] == "dialogue", dialogue
          assert dialogue["trace"]["sequence"] == 1 and dialogue["cohortRecordUnchanged"], dialogue
          cohort = json.loads(run_predeclared_cohort(root))
          assert cohort["ok"], cohort
          assert all(cohort["gates"].values()), cohort["gates"]
          schedule = cohort["manifest"]["schedule"]
          assert (schedule["triads"], schedule["donorSources"], schedule["forkBranches"], schedule["returnSteps"], schedule["totalRawSteps"]) == (60, 180, 720, 14400, 80160)
          after = json.loads(run_dialogue_turn("A second local dialogue probe", root))
          assert after["ok"] and after["trace"]["sequence"] == 2 and after["cohortRecordUnchanged"], after
          check = json.loads(verify_last_cohort(root))
          assert check["ok"] and check["allMatch"], check
          assert (check["sourcesMatched"], check["branchesMatched"]) == (180, 720)
          print("P3 prospective cohort validation passed")
          PY

      - name: Build Android-P3 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload Android-P3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.1-Dialogue-and-Cohort
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
