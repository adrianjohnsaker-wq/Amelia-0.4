name: Build Amelia Android-P3.8 Torch Numogram Render APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify P3.8 source files exist
        shell: bash
        run: |
          set -euo pipefail

          for source in bridge_probe.py Numogram.py NumogramBridge.kt ChaquopyProbe.kt RenderTransport.kt RenderPromptBuilder.kt; do
            if [[ ! -f "$source" ]]; then
              echo "::error file=$source::Required P3.8 source is absent from repository root."
              echo "Repository root contents:"
              find . -maxdepth 1 -type f -printf ' - %f\n' | sort
              exit 1
            fi
            echo "Present: $source ($(wc -c < "$source") bytes)"
          done

          echo
          echo "P3.8 source fingerprints:"
          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt \
            RenderTransport.kt \
            RenderPromptBuilder.kt

      - name: Warn if ANTHROPIC_API_KEY secret is not set
        shell: bash
        run: |
          if [[ -z "${ANTHROPIC_API_KEY_PRESENCE_CHECK}" ]]; then
            echo "::warning::ANTHROPIC_API_KEY repository secret appears to be unset. The build will still succeed, but BuildConfig.ANTHROPIC_API_KEY will be blank and the app will report 'no_api_key_configured' instead of attempting a render call. Add the secret under Settings -> Secrets and variables -> Actions if you want the render step to actually run."
          else
            echo "ANTHROPIC_API_KEY secret is present."
          fi
        env:
          ANTHROPIC_API_KEY_PRESENCE_CHECK: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Create Android-P3.8 Torch Numogram Render project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/amelia/p38 \
            app/src/main/java/com/amelia/bridge \
            app/src/main/java/com/amelia/renderer \
            app/src/main/python \
            app/src/main/res/values

          # bridge_probe.py, Numogram.py, NumogramBridge.kt, and
          # ChaquopyProbe.kt are UNCHANGED from P3.7 -- P3.8 adds a purely
          # Kotlin-side rendering layer above the existing, already-verified
          # Numogram bridge. Python never learns Claude's API exists; the
          # render call happens entirely after NumogramBridge hands back a
          # completed, sealed fork result.
          cp bridge_probe.py \
            app/src/main/python/bridge_probe.py

          cp Numogram.py \
            app/src/main/python/Numogram.py

          cp NumogramBridge.kt \
            app/src/main/java/com/amelia/bridge/NumogramBridge.kt

          cp ChaquopyProbe.kt \
            app/src/main/java/com/amelia/bridge/ChaquopyProbe.kt

          cp RenderTransport.kt \
            app/src/main/java/com/amelia/renderer/RenderTransport.kt

          cp RenderPromptBuilder.kt \
            app/src/main/java/com/amelia/renderer/RenderPromptBuilder.kt

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmeliaAndroidP38"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "16.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # NEW at P3.8: buildConfigField reads ANTHROPIC_API_KEY from the
          # environment at build time (populated from a GitHub Actions
          # secret in the build step below) and bakes it into
          # BuildConfig.ANTHROPIC_API_KEY as a compiled string constant.
          # That constant ends up IN the built APK -- see RenderTransport.kt's
          # header comment for what that tradeoff actually means.
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.amelia.p38"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.amelia.p38"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.10-android-p3.8-torch-numogram-render"

                  ndk {
                      abiFilters += listOf(
                          "armeabi-v7a",
                          "arm64-v8a"
                      )
                  }

                  buildConfigField(
                      "String",
                      "ANTHROPIC_API_KEY",
                      "\"${System.getenv("ANTHROPIC_API_KEY") ?: ""}\""
                  )
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          chaquopy {
              defaultConfig {
                  version = "3.8"
                  buildPython("python3.8")

                  pip {
                      install("torch==1.8.1")
                  }
              }
          }
          EOF

          # NEW at P3.8: INTERNET permission is required -- this is the
          # first stage in this project that makes a network call at all.
          # Every prior stage's own manifest and CI check explicitly
          # REJECTED this permission; P3.8 is a deliberate, named crossing
          # of that boundary, not an oversight.
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Amelia P3.8 Torch Numogram Render</string>
          </resources>
          EOF

          # P3.8's on-device experiment:
          #
          # Kotlin -> NumogramBridge -> Numogram.py -> Torch
          #        -> initialize/reattach -> status -> transition(Z3)
          #        -> run_fork(Z3) -> verify_last_fork -> status
          #        -> RenderPromptBuilder (curate + digest)
          #        -> RenderCapsule.seal()
          #        -> RenderTransport.execute() [real network call to
          #           Anthropic's Messages API, IF ANTHROPIC_API_KEY is set]
          #        -> status again, compared against the post-fork status
          #           to confirm the render call left no trace in the
          #           substrate -- checked, not assumed
          #        -> Kotlin: displays rendered text or a clear
          #           no-key-configured message
          cat > app/src/main/java/com/amelia/p38/MainActivity.kt <<'ACTIVITY_EOF'
          package com.amelia.p38

          import android.app.Activity
          import android.os.Bundle
          import android.util.Log
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.amelia.bridge.NumogramBridge
          import com.amelia.renderer.RenderCapsule
          import com.amelia.renderer.RenderPromptBuilder
          import com.amelia.renderer.RenderTransport
          import kotlin.math.abs
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : Activity() {

              companion object {
                  private const val LOG_TAG = "AMELIA_P38"
                  private const val PROBE_SEED = 3606
                  private const val PROBE_DIMENSION = 3
                  private const val PROBE_ORIGIN = 3
                  private val EXPECTED_BRANCHES = listOf(
                      "FULL", "ABLATED_TRANSITION", "ABLATED_MAGNETISM", "ABLATED_BOTH", "NEUTRAL_RESET"
                  )
              }

              private lateinit var statusView: TextView
              private lateinit var detailView: TextView
              private lateinit var renderView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(24), dp(20), dp(24))
                  }

                  root.addView(
                      TextView(this).apply {
                          text = "AMELIA · P3.8"
                          textSize = 25f
                          gravity = Gravity.CENTER_HORIZONTAL
                      }
                  )

                  root.addView(
                      TextView(this).apply {
                          text = "Chaquopy 16.1 · Python 3.8 · Torch 1.8.1 · sealed fork → Claude API render"
                          textSize = 14f
                          gravity = Gravity.CENTER_HORIZONTAL
                          setPadding(0, dp(8), 0, dp(18))
                      }
                  )

                  statusView = TextView(this).apply {
                      text = "P3.8 render probe starting…"
                      textSize = 20f
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(8), dp(18), dp(8), dp(18))
                  }

                  detailView = TextView(this).apply {
                      text = "Waiting for the Numogram fork, then the sealed render call."
                      textSize = 13f
                      setPadding(dp(8), dp(12), dp(8), dp(12))
                  }

                  renderView = TextView(this).apply {
                      text = ""
                      textSize = 14f
                      setPadding(dp(8), dp(12), dp(8), dp(12))
                  }

                  root.addView(statusView)
                  root.addView(detailView)
                  root.addView(renderView)

                  root.addView(
                      TextView(this).apply {
                          text =
                              "\nP3.8 boundary:\n\n" +
                              "Kotlin\n" +
                              "  ↓\n" +
                              "NumogramBridge → Numogram.py (fork, as P3.7)\n" +
                              "  ↓\n" +
                              "RenderPromptBuilder: curates the fork result into a prompt,\n" +
                              "  digests the trace, the curated payload, and the template\n" +
                              "  ↓\n" +
                              "RenderCapsule.seal(): fixes provider, model, params,\n" +
                              "  streaming/tools/functionCalling/webhook all false\n" +
                              "  ↓\n" +
                              "RenderTransport.execute(): single sealed call to the\n" +
                              "  declared endpoint only; response classified and\n" +
                              "  digested before any of it is trusted\n" +
                              "  ↓\n" +
                              "Kotlin: displays the rendered text; never routes it\n" +
                              "  back into NumogramBridge -- checked below, not assumed\n\n" +
                              "Fixed probe: seed 3606 · dimension 3 · origin Z3 · context {}\n\n" +
                              "No key configured means no network call is attempted -- " +
                              "reported plainly rather than left to fail as an HTTP error."
                          textSize = 13f
                      }
                  )

                  scroll.addView(root)
                  setContentView(scroll)
                  runProbe()
              }

              private fun runProbe() {
                  Thread {
                      val raw = try {
                          executeProbe()
                      } catch (t: Throwable) {
                          JSONObject()
                              .put("schema", "amelia-p3.8-probe-result-v1")
                              .put("status", "error")
                              .put("error_type", t::class.java.simpleName)
                              .put("message", t.message ?: "Unknown Android, Chaquopy, Torch, or network error")
                              .toString()
                      }

                      Log.i(LOG_TAG, raw)
                      runOnUiThread {
                          renderProbeResult(raw)
                      }
                  }.start()
              }

              private fun executeProbe(): String {
                  val bridge = NumogramBridge(applicationContext)
                  val runtime = JSONObject(bridge.runtimeInfo())
                  val before = JSONObject(bridge.status())
                  val initialized = JSONObject(bridge.initialize(PROBE_SEED, PROBE_DIMENSION))
                  val ready = JSONObject(bridge.status())
                  val transitioned = JSONObject(bridge.transition(PROBE_ORIGIN, "{}"))
                  val forked = JSONObject(bridge.runFork(PROBE_ORIGIN, "{}"))
                  val verified = JSONObject(bridge.verifyLastFork())
                  val postForkStatus = JSONObject(bridge.status())

                  val result = JSONObject()
                      .put("schema", "amelia-p3.8-probe-result-v1")
                      .put("runtime", runtime)
                      .put("before", before)
                      .put("initialized", initialized)
                      .put("ready", ready)
                      .put("transitioned", transitioned)
                      .put("forked", forked)
                      .put("verified", verified)
                      .put("post_fork_status", postForkStatus)

                  val apiKey = BuildConfig.ANTHROPIC_API_KEY
                  if (apiKey.isBlank()) {
                      result.put("status", "completed_no_render")
                      result.put("render_status", "no_api_key_configured")
                      val finalStatus = JSONObject(bridge.status())
                      result.put("final", finalStatus)
                      return result.toString()
                  }

                  val promptPayload = RenderPromptBuilder.buildFromForkResult(forked)
                  val capsule = RenderCapsule.seal(
                      traceDigest = promptPayload.traceDigest,
                      payloadDigest = promptPayload.payloadDigest,
                      rendererTemplateDigest = promptPayload.rendererTemplateDigest
                  )
                  val transportResult = RenderTransport.execute(capsule, promptPayload.renderPrompt, apiKey)

                  // The boundary claim this stage exists to check: the render call
                  // must not have touched the substrate. Compared against ACTUAL
                  // status calls before and after, not assumed from the transport
                  // object's own (necessarily self-reported) behaviour.
                  val postRenderStatus = JSONObject(bridge.status())

                  val sealed = transportResult.sealed
                  result.put("status", "completed")
                  result.put("capsule_digest", capsule.capsuleDigest)
                  result.put("trace_digest", promptPayload.traceDigest)
                  result.put("payload_digest", promptPayload.payloadDigest)
                  result.put("renderer_template_digest", promptPayload.rendererTemplateDigest)
                  result.put("model", capsule.model)
                  result.put("attempt_count", transportResult.attempts.size)
                  if (sealed != null) {
                      result.put("render_status", "completed")
                      result.put("response_class", sealed.responseClass.name)
                      result.put("http_status", sealed.httpStatus)
                      result.put("raw_response_digest", sealed.rawResponseDigest)
                      result.put("rendered_text", sealed.parsedDisplayText)
                  } else {
                      result.put("render_status", "transport_failed")
                      result.put("attempts_all_errored", true)
                  }
                  result.put("post_render_status", postRenderStatus)
                  result.put("final", postRenderStatus)

                  return result.toString()
              }

              private fun probabilitiesValid(probabilities: JSONArray): Boolean {
                  if (probabilities.length() != 10) return false
                  var mass = 0.0
                  for (index in 0 until probabilities.length()) {
                      val value = probabilities.optDouble(index, Double.NaN)
                      if (value.isNaN() || value.isInfinite()) return false
                      mass += value
                  }
                  return abs(mass - 1.0) <= 0.00001
              }

              private fun renderProbeResult(raw: String) {
                  try {
                      val result = JSONObject(raw)
                      val runtime = result.optJSONObject("runtime")
                          ?: throw IllegalStateException("Missing Torch runtime record")
                      val before = result.optJSONObject("before")
                          ?: throw IllegalStateException("Missing pre-initialization status")
                      val initialized = result.optJSONObject("initialized")
                          ?: throw IllegalStateException("Missing initialization result")
                      val ready = result.optJSONObject("ready")
                          ?: throw IllegalStateException("Missing ready status")
                      val transitioned = result.optJSONObject("transitioned")
                          ?: throw IllegalStateException("Missing transition result")
                      val forked = result.optJSONObject("forked")
                          ?: throw IllegalStateException("Missing fork result")
                      val verified = result.optJSONObject("verified")
                          ?: throw IllegalStateException("Missing verify result")

                      val initializedSystem = initialized.optJSONObject("system")
                          ?: throw IllegalStateException("Missing initialized system")
                      val readySystem = ready.optJSONObject("system")
                          ?: throw IllegalStateException("Missing ready system")
                      val event = transitioned.optJSONObject("event")
                          ?: throw IllegalStateException("Missing transition event")
                      val transitionProbs = event.optJSONArray("probabilities")
                          ?: throw IllegalStateException("Missing transition probability vector")
                      val branches = forked.optJSONObject("branches")
                          ?: throw IllegalStateException("Missing fork branches")
                      val invariants = forked.optJSONObject("invariants")
                          ?: throw IllegalStateException("Missing fork invariants")

                      val torchVersion = runtime.optString("torch_version", "")
                      val torchReady =
                          runtime.optString("status", "") == "torch_ready" &&
                              torchVersion.startsWith("1.8.1") &&
                              runtime.optInt("zone_count", -1) == 10 &&
                              !runtime.optBoolean("persistence_default", true)

                      val initStatus = initialized.optString("status", "")
                      val digestMatchedReattachment =
                          initStatus == "already_initialized" &&
                              initialized.optBoolean("state_unchanged", false) &&
                              initialized.optString("init_digest", "").isNotBlank() &&
                              initialized.optString("init_digest", "") ==
                                  initialized.optString("attempted_init_digest", "")

                      val initializationHeld =
                          (initStatus == "initialized" || digestMatchedReattachment) &&
                              initializedSystem.optInt("seed", -1) == PROBE_SEED &&
                              initializedSystem.optInt("dimension", -1) == PROBE_DIMENSION &&
                              !initializedSystem.optBoolean("persistence_enabled", true)

                      val baselineStep = readySystem.optInt("evolution_step", -1)
                      val baselineHistory = readySystem.optInt("transition_history", -1)

                      val readyHeld =
                          ready.optString("status", "") == "ready" && baselineStep >= 0 && baselineHistory >= 0

                      val transitionHeld =
                          transitioned.optString("status", "") == "transitioned" &&
                              event.optInt("step", -1) == baselineStep + 1 &&
                              event.optInt("from", -1) == PROBE_ORIGIN &&
                              event.optInt("to", -1) in 0 until 10 &&
                              probabilitiesValid(transitionProbs)

                      var branchesWellFormed = true
                      val branchLines = StringBuilder()
                      for (name in EXPECTED_BRANCHES) {
                          val branch = branches.optJSONObject(name)
                          if (branch == null) {
                              branchesWellFormed = false
                              branchLines.append("$name: missing\n")
                              continue
                          }
                          val branchProbs = branch.optJSONArray("probabilities")
                          val wellFormed =
                              branch.optInt("from", -1) == PROBE_ORIGIN &&
                                  branch.optInt("to", -1) in 0 until 10 &&
                                  branchProbs != null && probabilitiesValid(branchProbs)
                          if (!wellFormed) branchesWellFormed = false
                          branchLines.append(
                              "$name: Z${branch.optInt("from")} → Z${branch.optInt("to")}" +
                                  (if (branch.optBoolean("fallback", false)) " (fallback)" else "") + "\n"
                          )
                      }

                      val liveStateUnchanged = invariants.optBoolean("live_state_unchanged", false)
                      val generatorStateUnchanged = invariants.optBoolean("generator_state_unchanged", false)
                      val ablatedMatchesNeutral = invariants.optBoolean("ablated_both_matches_neutral_reset", false)

                      val forkHeld =
                          forked.optString("status", "") == "forked" &&
                              forked.optString("capsule_digest", "").isNotBlank() &&
                              branchesWellFormed &&
                              liveStateUnchanged &&
                              generatorStateUnchanged &&
                              ablatedMatchesNeutral

                      val mismatchedBranches = verified.optJSONArray("mismatched_branches")
                      val verifyHeld =
                          verified.optString("status", "") == "verified" &&
                              mismatchedBranches != null && mismatchedBranches.length() == 0 &&
                              verified.optString("capsule_digest", "") == forked.optString("capsule_digest", "")

                      val overallStatus = result.optString("status", "")
                      val renderStatus = result.optString("render_status", "")

                      if (overallStatus == "completed_no_render") {
                          statusView.text = "P3.8 NO RENDER (key not configured)"
                          detailView.text =
                              "The Numogram fork completed and verified normally, but " +
                                  "BuildConfig.ANTHROPIC_API_KEY is blank, so no network call " +
                                  "was attempted. Fork held: " + forkHeld + " · Verify held: " + verifyHeld +
                                  "\n\nAdd the ANTHROPIC_API_KEY repository secret and rebuild " +
                                  "to exercise the render step."
                          renderView.text = ""
                          return
                      }

                      // post_render_status is the ground-truth check for the one-way
                      // boundary: the Numogram must show exactly the same evolution_step
                      // and transition_history after the render call as it did right
                      // after the fork -- a render call that somehow looped back into
                      // the substrate would show up here as an unexpected increment.
                      val postForkStatus = result.optJSONObject("post_fork_status")
                          ?: throw IllegalStateException("Missing post-fork status")
                      val postRenderStatus = result.optJSONObject("post_render_status")
                          ?: throw IllegalStateException("Missing post-render status")
                      val postForkSystem = postForkStatus.optJSONObject("system")
                          ?: throw IllegalStateException("Missing post-fork system")
                      val postRenderSystem = postRenderStatus.optJSONObject("system")
                          ?: throw IllegalStateException("Missing post-render system")

                      val noFeedbackHeld =
                          postRenderSystem.optInt("evolution_step", -1) == postForkSystem.optInt("evolution_step", -2) &&
                              postRenderSystem.optInt("transition_history", -1) == postForkSystem.optInt("transition_history", -2)

                      val renderTransportSucceeded = renderStatus == "completed"
                      val responseClass = result.optString("response_class", "")
                      val renderedText = result.optString("rendered_text", "")

                      val passed =
                          overallStatus == "completed" &&
                              torchReady &&
                              initializationHeld &&
                              readyHeld &&
                              transitionHeld &&
                              forkHeld &&
                              verifyHeld &&
                              renderTransportSucceeded &&
                              noFeedbackHeld

                      val initKind = if (initStatus == "already_initialized") {
                          "reattached to existing system (digest-matched)"
                      } else {
                          "fresh initialization"
                      }

                      if (passed) {
                          statusView.text = "P3.8 PASSED ✓"
                          detailView.text =
                              "Torch imported, one transition committed, the five-condition " +
                                  "fork ran and replay-verified, and the sealed render call " +
                                  "completed without any trace of feeding back into the substrate.\n\n" +
                                  "Torch: " + torchVersion + "\n" +
                                  "Initialization: " + initKind + "\n" +
                                  "Fork branches (all from Z3):\n" + branchLines.toString() +
                                  "verify_last_fork: " + verified.optString("status") + "\n\n" +
                                  "Model: " + result.optString("model", "") + "\n" +
                                  "Response class: " + responseClass + "\n" +
                                  "HTTP status: " + result.optInt("http_status", -1) + "\n" +
                                  "Attempts: " + result.optInt("attempt_count", -1) + "\n" +
                                  "Capsule digest: " + result.optString("capsule_digest", "").take(16) + "…\n" +
                                  "no_feedback_held: " + noFeedbackHeld
                          renderView.text =
                              if (responseClass == "SUCCESS_TEXT") {
                                  "Rendered text:\n\n" + renderedText
                              } else {
                                  "Renderer returned " + responseClass + " rather than text " +
                                      "(this is still a mechanically correct, boundary-respecting " +
                                      "result -- the transport and the sealed capsule worked; " +
                                      "the model just didn't produce display text this time).\n\n" +
                                      "Raw: " + renderedText.take(300)
                              }
                      } else {
                          statusView.text = "P3.8 FAIL-CLOSED"
                          renderView.text = ""
                          detailView.text =
                              "A response was received, but it did not satisfy the sealed " +
                                  "P3.8 contract.\n\n" +
                                  "Torch ready: " + torchReady + "\n" +
                                  "Initialization: " + initializationHeld + " (" + initStatus + ")\n" +
                                  "Ready state: " + readyHeld + "\n" +
                                  "Transition: " + transitionHeld + "\n" +
                                  "Fork: " + forkHeld + " (branches well-formed: " + branchesWellFormed + ")\n" +
                                  "Verify: " + verifyHeld + "\n" +
                                  "Render transport succeeded: " + renderTransportSucceeded + "\n" +
                                  "no_feedback_held: " + noFeedbackHeld + "\n\n" +
                                  "Raw response:\n" + raw
                      }
                  } catch (t: Throwable) {
                      statusView.text = "P3.8 FAIL-CLOSED"
                      renderView.text = ""
                      detailView.text =
                          "The returned value was not valid P3.8 probe JSON.\n\n" +
                              "Error: " + (t.message ?: "Unknown parsing error") + "\n\n" +
                              "Raw response:\n" + raw
                  }
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }
          }
          ACTIVITY_EOF

      # Numogram.py's own contract (reattachment, fork, five conditions) is
      # unchanged from P3.7 and checked identically here. P3.8 adds checks
      # for the new renderer layer and, deliberately, INVERTS the INTERNET
      # permission check every prior stage's workflow carried: P3.8 requires
      # that permission rather than rejecting it.
      - name: Validate P3.8 source and lifecycle contract
        shell: bash
        run: |
          set -euo pipefail

          python3.8 --version

          python3.8 -m py_compile \
            app/src/main/python/bridge_probe.py \
            app/src/main/python/Numogram.py

          python3.8 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("app/src/main/python/Numogram.py").read_text(encoding="utf-8"))
          functions = {
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required = {
              "get_runtime_info",
              "initialize_system",
              "get_status",
              "transition",
              "run_fork",
              "verify_last_fork",
              "_config_digest",
              "_branch_seed",
              "_digest_of",
              "_generator_fingerprint",
              "_run_fork_branches",
          }
          missing = required - functions
          assert not missing, f"Missing Numogram entry points: {sorted(missing)}"
          print("P3.8 Numogram entry-point contract validated (unchanged from P3.7)")
          PY

          grep -Fq 'install("torch==1.8.1")' app/build.gradle.kts
          grep -Fq 'buildPython("python3.8")' app/build.gradle.kts
          grep -Fq 'getModule("Numogram")' app/src/main/java/com/amelia/bridge/NumogramBridge.kt

          grep -Fq 'already_initialized' app/src/main/python/Numogram.py
          grep -Fq '_config_digest' app/src/main/python/Numogram.py
          grep -Fq 'ABLATED_TRANSITION' app/src/main/python/Numogram.py
          grep -Fq 'live_state_unchanged' app/src/main/python/Numogram.py

          grep -Fq 'runFork' app/src/main/java/com/amelia/bridge/NumogramBridge.kt
          grep -Fq 'verifyLastFork' app/src/main/java/com/amelia/bridge/NumogramBridge.kt

          # P3.8-specific: the renderer layer and its capsule discipline.
          grep -Fq 'class RenderCapsule' app/src/main/java/com/amelia/renderer/RenderTransport.kt
          grep -Fq 'object RenderTransport' app/src/main/java/com/amelia/renderer/RenderTransport.kt
          grep -Fq 'streamingEnabled = false' app/src/main/java/com/amelia/renderer/RenderTransport.kt
          grep -Fq 'toolsEnabled = false' app/src/main/java/com/amelia/renderer/RenderTransport.kt
          grep -Fq 'ALLOWED_ENDPOINTS' app/src/main/java/com/amelia/renderer/RenderTransport.kt
          grep -Fq 'object RenderPromptBuilder' app/src/main/java/com/amelia/renderer/RenderPromptBuilder.kt
          grep -Fq 'buildFromForkResult' app/src/main/java/com/amelia/renderer/RenderPromptBuilder.kt

          grep -Fq 'ANTHROPIC_API_KEY' app/build.gradle.kts
          grep -Fq 'buildConfig = true' app/build.gradle.kts
          grep -Fq 'BuildConfig.ANTHROPIC_API_KEY' app/src/main/java/com/amelia/p38/MainActivity.kt
          grep -Fq 'RenderPromptBuilder.buildFromForkResult' app/src/main/java/com/amelia/p38/MainActivity.kt
          grep -Fq 'RenderCapsule.seal' app/src/main/java/com/amelia/p38/MainActivity.kt
          grep -Fq 'RenderTransport.execute' app/src/main/java/com/amelia/p38/MainActivity.kt
          grep -Fq 'noFeedbackHeld' app/src/main/java/com/amelia/p38/MainActivity.kt
          grep -Fq 'post_fork_status' app/src/main/java/com/amelia/p38/MainActivity.kt
          grep -Fq 'post_render_status' app/src/main/java/com/amelia/p38/MainActivity.kt

          # INVERTED from every prior stage: P3.8 REQUIRES INTERNET, since
          # this is the first stage that makes a real network call.
          if ! grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "FAIL: P3.8 requires the INTERNET permission for the render call; it is missing."
            exit 1
          fi

          echo
          echo "P3.8 pre-build validation passed."
          echo "Numogram facade unchanged from P3.7 (reattachment + five-condition fork intact)."
          echo "Renderer layer present: sealed capsule, curated prompt builder, BuildConfig wiring."
          echo "INTERNET permission is present, as required for this stage specifically."

      - name: Build Android-P3.8 Torch Numogram Render APK
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Record P3.8 build manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt \
            RenderTransport.kt \
            RenderPromptBuilder.kt \
            > p38-source-sha256.txt

          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"

          cat > p38-build-manifest.txt <<EOF
          Amelia Android P3.8
          ====================

          Revision:
          $GITHUB_SHA

          Android Gradle Plugin:
          8.7.3

          Gradle:
          8.9

          Java:
          17

          Chaquopy:
          16.1.0

          Android Python:
          3.8

          Torch requirement:
          torch==1.8.1

          Changed from P3.7:
          Numogram.py, NumogramBridge.kt -- UNCHANGED. The render layer sits
          entirely above the existing bridge; Python never learns the LLM
          exists. Added RenderTransport.kt (reviewed fresh against the
          current architecture; DEFAULT_MODEL updated from a stale P3.4
          placeholder to claude-sonnet-5, package moved from
          com.amelia.p3.renderer to the shared com.amelia.renderer) and
          RenderPromptBuilder.kt (new -- curates a fork result into a
          renderPrompt plus trace/payload/template digests). MainActivity.kt
          now runs the full P3.7 sequence, then builds a render capsule from
          the fork result and calls RenderTransport.execute() against the
          real Anthropic Messages API. A fresh status() call after the
          render step is compared against the post-fork status to confirm
          the render call left no trace in the substrate -- checked
          directly, not assumed from the transport code's own design.

          Deliberate boundary crossing, named explicitly rather than left
          implicit: this is the first stage in the project that requires
          the INTERNET permission and makes a real network call. Every
          prior stage's manifest and CI check explicitly rejected that
          permission; P3.8's workflow inverts that check to REQUIRE it.

          Credentials:
          BuildConfig.ANTHROPIC_API_KEY, populated at build time from the
          ANTHROPIC_API_KEY GitHub Actions repository secret. If that
          secret is unset, the build still succeeds but the field is blank
          and the app reports "no_api_key_configured" rather than
          attempting a call. The key, once baked in, is a compiled string
          constant inside this APK -- extractable by anyone with the file.
          Keep this repository and its build artifacts private.

          Runtime lifecycle:
          get_runtime_info
          initialize_system(seed=3606, dimension=3)  [fresh OR reattach]
          status
          transition(origin=Z3, context={})
          run_fork(origin=Z3, context={})
          verify_last_fork
          status
          [render step, only if API key present]
          status (compared against the pre-render status)

          Persistence:
          DISABLED (Numogram side; unrelated to the network call)

          Runtime INTERNET permission:
          DECLARED (first stage to require this)

          ABIs:
          armeabi-v7a
          arm64-v8a

          Application ID:
          com.amelia.p38 (separate from com.amelia.p37; prior installs preserved)

          APK SHA-256:
          $APK_SHA

          Acceptance condition:
          App displays "P3.8 PASSED (check mark)" when the full P3.7 contract
          holds (torch ready, initialization, transition, fork, verify) AND
          the render transport completes with a classified response AND a
          post-render status check shows the exact same evolution_step and
          transition_history as immediately after the fork. A REFUSAL or
          EMPTY response class still counts toward a pass if the transport
          and boundary check succeeded -- this stage tests the mechanism,
          not the content of what the model says. If ANTHROPIC_API_KEY is
          unset, the app reports "NO RENDER (key not configured)" rather
          than failing or attempting a call with a blank credential.
          EOF

          cat p38-build-manifest.txt
          cat p38-source-sha256.txt

      - name: Upload Android-P3.8 Torch Numogram Render APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.8-Torch-Numogram-Render
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            p38-build-manifest.txt
            p38-source-sha256.txt
          retention-days: 14
