name: Build Amelia APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Amelia Android shell
        shell: bash
        run: |
          set -euo pipefail

          test -f amelia_symbolic_core.py

          mkdir -p app/src/main/java/com/amelia/app
          mkdir -p app/src/main/python
          mkdir -p app/src/main/res/values

          # Copy only the verified symbolic core. Legacy Kotlin files remain untouched.
          cp amelia_symbolic_core.py app/src/main/python/amelia_symbolic_core.py

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Amelia"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "17.0.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.amelia.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.amelia.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"

                  ndk {
                      abiFilters += listOf("armeabi-v7a", "arm64-v8a")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          chaquopy {
              defaultConfig {
                  version = "3.11"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Amelia</string>
          </resources>
          EOF

          cat > app/src/main/python/amelia_android_entry.py <<'EOF'
          import amelia_symbolic_core


          def reply(text):
              result = amelia_symbolic_core.process(text)
              return result.get("final_response", "Amelia returned no response.")
          EOF

          cat > app/src/main/java/com/amelia/app/MainActivity.kt <<'EOF'
          package com.amelia.app

          import android.app.Activity
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.chaquo.python.Python

          class MainActivity : Activity() {
              private lateinit var input: EditText
              private lateinit var output: TextView
              private lateinit var send: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(20), dp(20), dp(20))
                  }

                  root.addView(TextView(this).apply {
                      text = "AMELIA"
                      textSize = 24f
                      gravity = Gravity.CENTER_HORIZONTAL
                  })

                  output = TextView(this).apply {
                      text = "Amelia is ready. Send a thought to the local symbolic core."
                      textSize = 16f
                      setPadding(0, dp(18), 0, dp(18))
                  }

                  root.addView(
                      ScrollView(this).apply { addView(output) },
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  input = EditText(this).apply {
                      hint = "Write to Amelia"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
                      minLines = 2
                      maxLines = 5
                  }
                  root.addView(input)

                  send = Button(this).apply {
                      text = "Send"
                      setOnClickListener { submit() }
                  }
                  root.addView(send)

                  setContentView(root)
              }

              private fun submit() {
                  val text = input.text.toString().trim()
                  if (text.isEmpty()) return

                  send.isEnabled = false
                  output.text = "Amelia is processing..."

                  Thread {
                      val response = runPython(text)
                      runOnUiThread {
                          output.text = response
                          input.setText("")
                          send.isEnabled = true
                      }
                  }.start()
              }

              private fun runPython(text: String): String = try {
                  Python.getInstance()
                      .getModule("amelia_android_entry")
                      .callAttr("reply", text)
                      .toString()
              } catch (error: Exception) {
                  "Amelia could not process that input: ${error.message ?: "unknown error"}"
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-App-Download
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
