name: Build Amelia Android-P3.10 Numogram Mediated Chat APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify P3.10 source files exist
        shell: bash
        run: |
          set -euo pipefail

          for source in \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt \
            RenderTransport.kt \
            PythonModuleVault.kt \
            EventModulePlanner.kt \
            MediatedChatPromptBuilder.kt \
            P310MainActivity.kt
          do
            if [[ ! -f "$source" ]]; then
              echo "::error file=$source::Required P3.10 source is absent from repository root."
              find . -maxdepth 1 -type f -printf ' - %f\n' | sort
              exit 1
            fi
            echo "Present: $source ($(wc -c < "$source") bytes)"
          done

          echo
          echo "P3.10 source fingerprints:"
          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt \
            RenderTransport.kt \
            PythonModuleVault.kt \
            EventModulePlanner.kt \
            MediatedChatPromptBuilder.kt \
            P310MainActivity.kt

      - name: Seal P3.10 credential attestation
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          P310_KEY="${ANTHROPIC_API_KEY:-}"

          if [[ -z "$P310_KEY" ]]; then
            {
              echo "P310_CREDENTIAL_FINGERPRINT=missing"
              echo "P310_CREDENTIAL_SHAPE=missing"
            } >> "$GITHUB_ENV"
            echo "::warning::ANTHROPIC_API_KEY is unset. P3.10 will execute local Numogram events but make no language relay calls."
          else
            P310_FINGERPRINT="$(printf '%s' "$P310_KEY" | sha256sum | awk '{print $1}')"
            P310_HAS_WHITESPACE=false
            P310_HAS_WRAPPER=false

            if [[ "$P310_KEY" =~ [[:space:]] ]]; then
              P310_HAS_WHITESPACE=true
            fi

            P310_FIRST_CHARACTER="${P310_KEY:0:1}"
            if [[ "$P310_FIRST_CHARACTER" == '"' || "$P310_FIRST_CHARACTER" == "'" || \
                  "$P310_KEY" == "Bearer "* || \
                  "$P310_KEY" == "x-api-key:"* || \
                  "$P310_KEY" == "ANTHROPIC_API_KEY="* ]]; then
              P310_HAS_WRAPPER=true
            fi

            if [[ "$P310_KEY" == sk-ant-* && \
                  "$P310_HAS_WHITESPACE" == false && \
                  "$P310_HAS_WRAPPER" == false ]]; then
              P310_SHAPE=canonical
            else
              P310_SHAPE=noncanonical
            fi

            {
              echo "P310_CREDENTIAL_FINGERPRINT=$P310_FINGERPRINT"
              echo "P310_CREDENTIAL_SHAPE=$P310_SHAPE"
            } >> "$GITHUB_ENV"

            echo "P3.10 credential attestation sealed: shape=$P310_SHAPE; sha256-prefix=${P310_FINGERPRINT:0:16}."
          fi

      - name: Create Android-P3.10 project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/amelia/p310 \
            app/src/main/java/com/amelia/bridge \
            app/src/main/java/com/amelia/renderer \
            app/src/main/java/com/amelia/modules \
            app/src/main/java/com/amelia/orchestration \
            app/src/main/python \
            app/src/main/res/values

          cp bridge_probe.py app/src/main/python/bridge_probe.py
          cp Numogram.py app/src/main/python/Numogram.py
          cp NumogramBridge.kt app/src/main/java/com/amelia/bridge/NumogramBridge.kt
          cp ChaquopyProbe.kt app/src/main/java/com/amelia/bridge/ChaquopyProbe.kt
          cp RenderTransport.kt app/src/main/java/com/amelia/renderer/RenderTransport.kt
          cp PythonModuleVault.kt app/src/main/java/com/amelia/modules/PythonModuleVault.kt
          cp EventModulePlanner.kt app/src/main/java/com/amelia/orchestration/EventModulePlanner.kt
          cp MediatedChatPromptBuilder.kt app/src/main/java/com/amelia/renderer/MediatedChatPromptBuilder.kt
          cp P310MainActivity.kt app/src/main/java/com/amelia/p310/MainActivity.kt

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmeliaAndroidP310"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "16.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          fun asJavaStringLiteral(value: String): String = buildString {
              append('"')
              value.forEach { character ->
                  when (character) {
                      '\\' -> append("\\\\")
                      '"' -> append("\\\"")
                      '\n' -> append("\\n")
                      '\r' -> append("\\r")
                      '\t' -> append("\\t")
                      else -> append(character)
                  }
              }
              append('"')
          }

          val sealedApiKey =
              System.getenv("ANTHROPIC_API_KEY") ?: ""
          val credentialFingerprint =
              System.getenv("P310_CREDENTIAL_FINGERPRINT") ?: "missing"
          val credentialShape =
              System.getenv("P310_CREDENTIAL_SHAPE") ?: "missing"
          val buildRevision =
              (System.getenv("GITHUB_SHA") ?: "local").take(12)

          android {
              namespace = "com.amelia.p310"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.amelia.p310"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.12-android-p3.10-numogram-mediated-chat"

                  ndk {
                      abiFilters += listOf(
                          "armeabi-v7a",
                          "arm64-v8a"
                      )
                  }

                  buildConfigField(
                      "String",
                      "ANTHROPIC_API_KEY",
                      asJavaStringLiteral(sealedApiKey)
                  )
                  buildConfigField(
                      "String",
                      "CREDENTIAL_FINGERPRINT",
                      asJavaStringLiteral(credentialFingerprint)
                  )
                  buildConfigField(
                      "String",
                      "CREDENTIAL_SHAPE",
                      asJavaStringLiteral(credentialShape)
                  )
                  buildConfigField(
                      "String",
                      "BUILD_REVISION",
                      asJavaStringLiteral(buildRevision)
                  )
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          chaquopy {
              defaultConfig {
                  version = "3.8"
                  buildPython("python3.8")

                  pip {
                      install("torch==1.8.1")
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Amelia P3.10</string>
          </resources>
          EOF

      - name: Validate P3.10 source and process contracts
        shell: bash
        run: |
          set -euo pipefail

          python3.8 --version
          python3.8 -m py_compile \
            app/src/main/python/bridge_probe.py \
            app/src/main/python/Numogram.py

          python3.8 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(
              Path("app/src/main/python/Numogram.py").read_text(encoding="utf-8")
          )
          functions = {
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          required = {
              "get_runtime_info",
              "initialize_system",
              "get_status",
              "transition",
              "run_fork",
              "verify_last_fork",
          }

          missing = required - functions
          assert not missing, f"Missing Numogram entry points: {sorted(missing)}"
          print("P3.10 Numogram entry-point contract validated")
          PY

          grep -Fq 'install("torch==1.8.1")' app/build.gradle.kts
          grep -Fq 'buildPython("python3.8")' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml

          grep -Fq 'EventModulePlanner.numogramContext' \
            app/src/main/java/com/amelia/p310/MainActivity.kt
          grep -Fq 'bridge.transition' \
            app/src/main/java/com/amelia/p310/MainActivity.kt
          grep -Fq 'EventModulePlanner.plan' \
            app/src/main/java/com/amelia/p310/MainActivity.kt
          grep -Fq 'EventModulePlanner.executeSelected' \
            app/src/main/java/com/amelia/p310/MainActivity.kt
          grep -Fq 'MediatedChatPromptBuilder.build' \
            app/src/main/java/com/amelia/p310/MainActivity.kt
          grep -Fq 'maxTokens = 1600' \
            app/src/main/java/com/amelia/p310/MainActivity.kt
          grep -Fq 'no_feedback_held' \
            app/src/main/java/com/amelia/p310/MainActivity.kt

          grep -Fq 'amelia_event' \
            app/src/main/java/com/amelia/orchestration/EventModulePlanner.kt
          grep -Fq 'getModule(moduleName)' \
            app/src/main/java/com/amelia/orchestration/EventModulePlanner.kt
          grep -Fq 'STAGED_NOT_IMPORTED' \
            app/src/main/java/com/amelia/orchestration/EventModulePlanner.kt

          grep -Fq 'amelia-p3.10-mediated-payload-v1' \
            app/src/main/java/com/amelia/renderer/MediatedChatPromptBuilder.kt
          grep -Fq 'The sealed event below is authoritative' \
            app/src/main/java/com/amelia/renderer/MediatedChatPromptBuilder.kt

          if rg -n 'put\("temperature"|put\("top_p"|put\("top_k"' \
            app/src/main/java/com/amelia/renderer/RenderTransport.kt
          then
            echo "FAIL: P3.10 must retain provider-default sampling omission."
            exit 1
          fi

          POST_RENDER_BLOCK="$(
            sed -n \
              '/val transport = RenderTransport.execute/,/return result.toString()/p' \
              app/src/main/java/com/amelia/p310/MainActivity.kt
          )"

          if printf '%s' "$POST_RENDER_BLOCK" | \
            rg -n 'bridge\.transition|runFork\(|verifyLastFork\('
          then
            echo "FAIL: language relay output must not re-enter the Numogram."
            exit 1
          fi

          echo
          echo "P3.10 pre-build validation passed."
          echo "Numogram commits one transition before the language relay."
          echo "EventModulePlanner deterministically selects audited staged modules."
          echo "Selected modules can execute only after the transition."
          echo "The provider receives the completed event and cannot feed back."
          echo "Renderer budget is raised to 1600 tokens to prevent short responses."

      - name: Build Android-P3.10 APK
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Record P3.10 build manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt \
            RenderTransport.kt \
            PythonModuleVault.kt \
            EventModulePlanner.kt \
            MediatedChatPromptBuilder.kt \
            P310MainActivity.kt \
            > p310-source-sha256.txt

          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"

          cat > p310-build-manifest.txt <<EOF
          Amelia Android P3.10
          ====================

          Revision:
          ${GITHUB_SHA}

          Architecture:
          user event
            -> deterministic ten-zone input field
            -> committed Numogram transition
            -> event/module synthesis
            -> selected audited Python-module contributions
            -> sealed language relay
            -> post-render no-feedback verification

          Numogram:
          Existing P3.7 tensor substrate retained unchanged.

          Language relay:
          One sealed provider call.
          max_tokens=1600.
          Streaming, tools, function calling, and webhook disabled.
          Provider-default sampling parameters remain omitted.

          Module facility:
          P3.9 source-vault ingestion and lexical audit retained.
          P3.10 introduces a separate, explicit execution boundary in
          EventModulePlanner. Up to three deterministically selected staged
          modules may be called through amelia_event, process, run, or
          transform after the Numogram transition has already occurred.

          Security scope:
          The source audit is a bounded capability filter, not a sandbox.
          Uploaded modules are user-selected and execute only after passing
          the retained audit. No module output is routed back into Numogram.

          Application ID:
          com.amelia.p310

          APK SHA-256:
          ${APK_SHA}

          Acceptance:
          1. User text produces one committed Numogram transition.
          2. The event planner records event class and module families.
          3. Selected staged modules may contribute after the transition.
          4. The language provider renders the completed event.
          5. no_feedback_held is checked against actual Numogram status.
          6. The renderer has a 1600-token ceiling, replacing the prior
             512-token budget that could cut answers short.
          EOF

          cat p310-build-manifest.txt
          cat p310-source-sha256.txt

      - name: Upload Android-P3.10 APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.10-Numogram-Mediated-Chat
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            p310-build-manifest.txt
            p310-source-sha256.txt
          retention-days: 14
