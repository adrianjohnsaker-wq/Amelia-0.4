name: Build Amelia Android-P3.3 Sealed Transport Capsule APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android-P3.3 sealed transport capsule and prospective cohort
        shell: bash
        run: |
          set -euo pipefail
          test -f amelia_symbolic_core.py
          mkdir -p app/src/main/java/com/amelia/p33 app/src/main/python app/src/main/res/values
          # This legacy symbolic routine is packaged only as a named provenance artefact.
          # Android-P3 does not import it into the experimental causal path.
          cp amelia_symbolic_core.py app/src/main/python/amelia_symbolic_core.py

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AmeliaAndroidP33"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "17.0.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("com.chaquo.python") }
          android {
              namespace = "com.amelia.p33"
              compileSdk = 34
              defaultConfig {
                  // P3.3 installs beside P3, P3.1, and P3.2, preserving their local records.
                  applicationId = "com.amelia.p33"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.6-android-p3.3-sealed-transport-capsule"
                  ndk { abiFilters += listOf("armeabi-v7a", "arm64-v8a") }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          kotlin { jvmToolchain(17) }
          chaquopy { defaultConfig { version = "3.11" } }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:name="com.chaquo.python.android.PyApplication" android:allowBackup="true" android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          echo '<resources><string name="app_name">Amelia P3.3 Transport Capsule</string></resources>' > app/src/main/res/values/strings.xml

          cat > app/src/main/python/p3_read_only_renderer.py <<'EOF'
          """Android-P3.2 pure downstream language renderer.

          The module accepts one canonical JSON string containing a whitelisted
          trace projection. It keeps no state, opens no files, imports no runtime
          component, and exposes no callback, router, memory, cohort, or mutation API.
          """
          from __future__ import annotations
          import hashlib
          import json

          RENDERER_SCHEMA = "amelia-p3.2-read-only-language-renderer-v1"
          PAYLOAD_SCHEMA = "amelia-p3.2-sealed-render-payload-v1"
          TRACE_SCHEMA = "amelia-p3-dialogue-trace-v1"
          TRACE_KEYS = (
              "schema", "sequence", "inputDigest", "route", "routeEdges", "modules",
              "kernelDeltaL1", "syzygyFlux", "preTensorNorm", "postTensorNorm",
              "stability", "activeAttractors", "causalDigest",
          )
          BODY_KEYS = (
              "schema", "rendererSchema", "traceDigest", "sequence", "inputDigest",
              "route", "routeEdges", "modules", "telemetry", "payloadContract",
          )
          PAYLOAD_KEYS = BODY_KEYS + ("payloadDigest",)
          CONTRACT = {
              "canonicalJsonOnly": True,
              "rawPromptIncluded": False,
              "routeResultIncluded": True,
              "mayCallRouter": False,
              "mayReadProcessMemory": False,
              "mayReadCohort": False,
              "mayMutate": False,
              "mayInvokeCallback": False,
          }

          def canon(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))

          def digest(value):
              return hashlib.sha256(canon(value).encode("utf-8")).hexdigest()

          def _is_digest(value):
              return isinstance(value, str) and len(value) == 64 and all(c in "0123456789abcdef" for c in value)

          def _require_trace(trace):
              if not isinstance(trace, dict) or set(trace) != set(TRACE_KEYS):
                  raise ValueError("Renderer rejected a non-canonical dialogue trace")
              if trace.get("schema") != TRACE_SCHEMA:
                  raise ValueError("Renderer rejected an unknown dialogue trace schema")
              trace_body = {key: trace[key] for key in TRACE_KEYS if key != "causalDigest"}
              if not _is_digest(trace.get("causalDigest")) or digest(trace_body) != trace["causalDigest"]:
                  raise ValueError("Renderer rejected an unsealed dialogue trace")
              if not isinstance(trace["route"], list) or len(trace["route"]) != 3 or not all(isinstance(z, int) and 0 <= z <= 9 for z in trace["route"]):
                  raise ValueError("Renderer rejected an invalid route projection")
              if not isinstance(trace["modules"], list) or not all(isinstance(item, str) for item in trace["modules"]):
                  raise ValueError("Renderer rejected invalid module labels")

          def seal_trace(trace):
              """Return an immutable canonical JSON payload; no original prompt is included."""
              _require_trace(trace)
              body = {
                  "schema": PAYLOAD_SCHEMA,
                  "rendererSchema": RENDERER_SCHEMA,
                  "traceDigest": trace["causalDigest"],
                  "sequence": trace["sequence"],
                  "inputDigest": trace["inputDigest"],
                  "route": list(trace["route"]),
                  "routeEdges": [{"from": edge["from"], "to": edge["to"], "kind": edge["kind"]} for edge in trace["routeEdges"]],
                  "modules": list(trace["modules"]),
                  "telemetry": {
                      "kernelDeltaL1": trace["kernelDeltaL1"],
                      "syzygyFlux": trace["syzygyFlux"],
                      "preTensorNorm": trace["preTensorNorm"],
                      "postTensorNorm": trace["postTensorNorm"],
                      "stability": trace["stability"],
                      "activeAttractors": list(trace["activeAttractors"]),
                  },
                  "payloadContract": dict(CONTRACT),
              }
              return canon({**body, "payloadDigest": digest(body)})

          def read_payload(payload_json):
              if not isinstance(payload_json, str) or len(payload_json.encode("utf-8")) > 8192:
                  raise ValueError("Renderer accepts only a bounded canonical JSON payload string")
              try:
                  payload = json.loads(payload_json)
              except Exception as error:
                  raise ValueError("Renderer rejected non-JSON payload") from error
              if not isinstance(payload, dict) or set(payload) != set(PAYLOAD_KEYS):
                  raise ValueError("Renderer rejected an unexpected payload shape")
              body = {key: payload[key] for key in BODY_KEYS}
              if payload.get("schema") != PAYLOAD_SCHEMA or payload.get("rendererSchema") != RENDERER_SCHEMA:
                  raise ValueError("Renderer rejected an unknown payload schema")
              if not _is_digest(payload.get("traceDigest")) or not _is_digest(payload.get("inputDigest")):
                  raise ValueError("Renderer rejected an invalid digest field")
              if not _is_digest(payload.get("payloadDigest")) or digest(body) != payload["payloadDigest"]:
                  raise ValueError("Renderer rejected a payload integrity mismatch")
              if payload.get("payloadContract") != CONTRACT:
                  raise ValueError("Renderer rejected a capability-contract mismatch")
              if not isinstance(payload["route"], list) or len(payload["route"]) != 3 or not all(isinstance(z, int) and 0 <= z <= 9 for z in payload["route"]):
                  raise ValueError("Renderer rejected an invalid route result")
              if not isinstance(payload["modules"], list) or not all(isinstance(item, str) for item in payload["modules"]):
                  raise ValueError("Renderer rejected invalid module labels")
              return payload

          def capability_audit():
              return {
                  "schema": "amelia-p3.2-renderer-capability-audit-v1",
                  "rendererSchema": RENDERER_SCHEMA,
                  "allowedInput": "immutable canonical JSON payload string",
                  **CONTRACT,
                  "imports": ["hashlib", "json"],
                  "outputOnly": True,
              }

          def render_payload(payload_json):
              """Pure deterministic language rendering from a verified sealed payload."""
              payload = read_payload(payload_json)
              route = " → ".join(f"Z{zone}" for zone in payload["route"])
              modules = ", ".join(payload["modules"])
              telemetry = payload["telemetry"]
              phases = [
                  "undivided potential", "differential activation", "lateral recombination",
                  "threshold articulation", "hinge pressure", "reciprocal coupling",
                  "syzygetic return", "temporal dispersion", "distributed relay", "terminal modulation",
              ]
              articulation = "; ".join(phases[zone] for zone in payload["route"])
              text = (
                  f"This is a downstream language rendering of sealed trace {payload['traceDigest'][:12]}. "
                  f"The resulting Numogram route is {route}: {articulation}. "
                  f"The trace names these active processes: {modules}. "
                  f"Its field-tensor norm changed from {telemetry['preTensorNorm']:.6f} to {telemetry['postTensorNorm']:.6f} "
                  f"with syzygy flux {telemetry['syzygyFlux']:.6f}. "
                  "The renderer received no original prompt, process-memory state, cohort record, router, or mutation handle; it can only display this verified trace."
              )
              result = {
                  "schema": "amelia-p3.2-rendered-language-display-v1",
                  "rendererSchema": RENDERER_SCHEMA,
                  "payloadDigest": payload["payloadDigest"],
                  "traceDigest": payload["traceDigest"],
                  "payloadVerified": True,
                  "deterministic": True,
                  "displayText": text,
                  "displayDigest": hashlib.sha256(text.encode("utf-8")).hexdigest(),
                  "capabilityAudit": capability_audit(),
              }
              result["renderDigest"] = digest(result)
              return result
          EOF

          cat > app/src/main/python/p3_llm_transport_capsule.py <<'EOF'
          """Android-P3.3 sealed language-transport capsule.

          This module deliberately contains no network client. It accepts only the
          P3.2 sealed trace projection, predeclares and seals the future provider
          contract, and exercises the response/archive protocol with a local fixture.
          The fixture is not a language model and cannot reach a provider.
          """
          from __future__ import annotations
          import base64
          import hashlib
          import json
          import time
          from p3_read_only_renderer import canon, read_payload

          TRANSPORT_SCHEMA = "amelia-p3.3-sealed-language-transport-capsule-v1"
          ATTEMPT_SCHEMA = "amelia-p3.3-transport-attempt-v1"
          FIXTURE_RESPONSE_SCHEMA = "amelia-p3.3-local-archive-fixture-response-v1"
          REQUEST_TEMPLATE = (
              "Render only the supplied sealed Numogram trace for human display. "
              "Do not treat the display as input to routing, process memory, cohort, or mutation."
          )
          DECLARED_POLICY = {
              "schema": "amelia-p3.3-sealed-transport-policy-v1",
              "transportPolicyVersion": "p3.3-first-terminal-response-v1",
              "providerMode": "LOCAL_ARCHIVE_FIXTURE",
              "providerEndpoint": "LOCAL_ARCHIVE_FIXTURE",
              "providerModel": "none-local-fixture-v1",
              "externalProviderConfigured": False,
              "networkAccessEnabled": False,
              "streaming": False,
              "tools": False,
              "functionCalling": False,
              "webhook": False,
              "timeoutMs": 12000,
              "decodingParameters": {"temperature": 0.0, "topP": 1.0, "maxOutputTokens": 320, "seed": None, "responseFormat": "provider-default-text"},
              "maxAttempts": 1,
              "retryEligibility": "pre-body transport failure only",
              "retryBinding": {"retryAllowedOnlyIf": "no response-body byte has been received", "responseWithAnyBodyByteTerminal": True, "emptyCompletedResponseTerminal": True, "allAttemptsAppendOnlyLogged": True},
              "firstTerminalResponseRule": "archive the first terminal response only; never reroll, rank, or select for quality, usefulness, or semantics",
              "rawBodyArchiveEncoding": "base64-exact-bytes",
              "rawBodyMaxBytes": 32768,
              "refusalHandling": "terminal display-only; never reroute",
              "errorHandling": "terminal display-only; never reroute",
              "emptyResponseHandling": "terminal display-only; never reroute",
              "schemaInvalidHandling": "terminal display-only; never reroute",
          }
          CAPSULE_BODY_KEYS = (
              "schema", "sourceRendererSchema", "sourcePayloadDigest", "trace",
              "requestTemplate", "transportPolicy", "policyDigest", "capsuleContract",
          )
          CAPSULE_KEYS = CAPSULE_BODY_KEYS + ("capsuleDigest",)
          ATTEMPT_BODY_KEYS = (
              "schema", "attemptOrdinal", "attemptStartedUtc", "attemptEndedUtc", "providerStatus", "capsuleDigest", "requestDigest", "policyDigest",
              "providerMode", "providerEndpoint", "providerModel", "streaming",
              "responseBodyStarted", "responseBodyBytes", "rawBodyBase64", "responseBodySha256",
              "terminalClass", "terminal", "retryEligible", "retryExecuted", "selectionRule",
              "displayText", "displayDigest", "parsedText", "parsedTextSha256", "parseStatus",
              "fixtureMode", "transportExceptionDigest", "bodyWithinDeclaredLimit",
          )
          ATTEMPT_KEYS = ATTEMPT_BODY_KEYS + ("attemptDigest",)
          CAPSULE_CONTRACT = {
              "rawPromptIncluded": False,
              "traceProjectionOnly": True,
              "mayCallRouter": False,
              "mayReadProcessMemory": False,
              "mayReadCohort": False,
              "mayMutate": False,
              "mayInvokeCallback": False,
              "responseMayEnterRouter": False,
              "responseMayEnterProcessMemory": False,
              "responseMayEnterCohort": False,
              "responseMayMutate": False,
          }

          def _deepcopy(value):
              return json.loads(canon(value))

          def _sha_bytes(value):
              return hashlib.sha256(bytes(value)).hexdigest()

          def _digest(value):
              return hashlib.sha256(canon(value).encode("utf-8")).hexdigest()

          def _is_digest(value):
              return isinstance(value, str) and len(value) == 64 and all(c in "0123456789abcdef" for c in value)

          def _template_digest():
              return _sha_bytes(REQUEST_TEMPLATE.encode("utf-8"))

          def _policy_digest():
              return _digest(DECLARED_POLICY)

          def _utc_now():
              return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())

          def transport_capability_audit():
              return {
                  "schema": "amelia-p3.3-transport-capability-audit-v1",
                  "imports": ["base64", "hashlib", "json", "time", "p3_read_only_renderer"],
                  "networkAccessEnabled": False,
                  "externalProviderConfigured": False,
                  "providerMode": DECLARED_POLICY["providerMode"],
                  "streaming": DECLARED_POLICY["streaming"],
                  "tools": DECLARED_POLICY["tools"],
                  "functionCalling": DECLARED_POLICY["functionCalling"],
                  "webhook": DECLARED_POLICY["webhook"],
                  **CAPSULE_CONTRACT,
              }

          def _trace_projection(payload):
              return {
                  "traceDigest": payload["traceDigest"],
                  "inputDigest": payload["inputDigest"],
                  "sequence": payload["sequence"],
                  "route": list(payload["route"]),
                  "routeEdges": _deepcopy(payload["routeEdges"]),
                  "modules": list(payload["modules"]),
                  "telemetry": _deepcopy(payload["telemetry"]),
              }

          def seal_transport_capsule(payload_json):
              """Seal a future-provider request with no original prompt or mutable handle."""
              payload = read_payload(payload_json)
              body = {
                  "schema": TRANSPORT_SCHEMA,
                  "sourceRendererSchema": payload["rendererSchema"],
                  "sourcePayloadDigest": payload["payloadDigest"],
                  "trace": _trace_projection(payload),
                  "requestTemplate": {
                      "id": "amelia-p3.3-read-only-trace-language-v1",
                      "digest": _template_digest(),
                      "rawPromptIncluded": False,
                  },
                  "transportPolicy": _deepcopy(DECLARED_POLICY),
                  "policyDigest": _policy_digest(),
                  "capsuleContract": _deepcopy(CAPSULE_CONTRACT),
              }
              return canon({**body, "capsuleDigest": _digest(body)})

          def read_transport_capsule(capsule_json):
              if not isinstance(capsule_json, str) or len(capsule_json.encode("utf-8")) > 16384:
                  raise ValueError("Transport rejected an unbounded capsule")
              try:
                  capsule = json.loads(capsule_json)
              except Exception as error:
                  raise ValueError("Transport rejected non-JSON capsule") from error
              if not isinstance(capsule, dict) or set(capsule) != set(CAPSULE_KEYS):
                  raise ValueError("Transport rejected an unexpected capsule shape")
              body = {key: capsule[key] for key in CAPSULE_BODY_KEYS}
              if capsule.get("schema") != TRANSPORT_SCHEMA or not _is_digest(capsule.get("capsuleDigest")):
                  raise ValueError("Transport rejected an unknown capsule schema")
              if _digest(body) != capsule["capsuleDigest"]:
                  raise ValueError("Transport rejected a capsule integrity mismatch")
              if capsule.get("transportPolicy") != DECLARED_POLICY or capsule.get("policyDigest") != _policy_digest():
                  raise ValueError("Transport rejected an unsealed provider policy")
              if capsule.get("capsuleContract") != CAPSULE_CONTRACT:
                  raise ValueError("Transport rejected a capability-contract mismatch")
              if capsule.get("requestTemplate") != {"id": "amelia-p3.3-read-only-trace-language-v1", "digest": _template_digest(), "rawPromptIncluded": False}:
                  raise ValueError("Transport rejected an unsealed request template")
              trace = capsule.get("trace")
              expected_trace = {"traceDigest", "inputDigest", "sequence", "route", "routeEdges", "modules", "telemetry"}
              if not isinstance(trace, dict) or set(trace) != expected_trace:
                  raise ValueError("Transport rejected an invalid trace projection")
              if not _is_digest(trace.get("traceDigest")) or not _is_digest(trace.get("inputDigest")):
                  raise ValueError("Transport rejected an invalid trace digest")
              if not isinstance(trace["route"], list) or len(trace["route"]) != 3 or not all(isinstance(z, int) and 0 <= z <= 9 for z in trace["route"]):
                  raise ValueError("Transport rejected an invalid route projection")
              return capsule

          def _fixture_body(capsule, fixture_mode):
              route = " → ".join("Z" + str(zone) for zone in capsule["trace"]["route"])
              if fixture_mode == "SUCCESS_TEXT":
                  return canon({
                      "schema": FIXTURE_RESPONSE_SCHEMA,
                      "outcome": "SUCCESS_TEXT",
                      "text": "LOCAL ARCHIVE FIXTURE ONLY — no external language model was called. Sealed trace " + capsule["trace"]["traceDigest"][:12] + " follows " + route + ".",
                  }).encode("utf-8")
              if fixture_mode == "REFUSAL":
                  return canon({"schema": FIXTURE_RESPONSE_SCHEMA, "outcome": "REFUSAL", "reason": "Fixture refusal: terminal display-only outcome."}).encode("utf-8")
              if fixture_mode == "PROVIDER_ERROR":
                  return canon({"schema": FIXTURE_RESPONSE_SCHEMA, "outcome": "PROVIDER_ERROR", "error": "Fixture provider error: terminal display-only outcome."}).encode("utf-8")
              if fixture_mode == "SCHEMA_INVALID":
                  return b'{"fixture":"invalid-without-declared-schema"}'
              if fixture_mode == "EMPTY_RESPONSE":
                  return b""
              if fixture_mode == "TRANSPORT_PREBODY_FAILURE":
                  return None
              raise ValueError("Unknown local transport fixture mode")

          def _fixture_status(fixture_mode):
              return {"SUCCESS_TEXT": 200, "REFUSAL": 200, "PROVIDER_ERROR": 503, "SCHEMA_INVALID": 200, "EMPTY_RESPONSE": 204, "TRANSPORT_PREBODY_FAILURE": None}[fixture_mode]

          def _parse_response(raw_body, fixture_mode):
              """Classify only after the exact raw bytes have been archived and digested."""
              if raw_body == b"":
                  return "EMPTY_RESPONSE", "EMPTY_RESPONSE", None, None, "empty-body"
              try:
                  decoded = raw_body.decode("utf-8")
                  parsed = json.loads(decoded)
              except Exception:
                  return "SCHEMA_INVALID", raw_body.decode("utf-8", errors="replace"), None, None, "json-parse-failed"
              if not isinstance(parsed, dict) or parsed.get("schema") != FIXTURE_RESPONSE_SCHEMA:
                  return "SCHEMA_INVALID", decoded, None, None, "unexpected-schema"
              outcome = parsed.get("outcome")
              if outcome == "SUCCESS_TEXT" and isinstance(parsed.get("text"), str) and parsed["text"]:
                  text = parsed["text"]
                  return "SUCCESS_TEXT", text, text, _sha_bytes(text.encode("utf-8")), "text-extracted"
              if outcome == "REFUSAL":
                  return "REFUSAL", decoded, None, None, "refusal-display-verbatim"
              if outcome == "PROVIDER_ERROR":
                  return "PROVIDER_ERROR", decoded, None, None, "error-display-verbatim"
              return "SCHEMA_INVALID", decoded, None, None, "unexpected-outcome"

          def archive_first_terminal_attempt(capsule_json, fixture_mode="SUCCESS_TEXT"):
              """Produce one appendable terminal-attempt record from a non-network fixture.

              The policy has maxAttempts=1. A pre-body failure is therefore logged but
              cannot be retried here; every response body (including refusal, error,
              empty, and malformed bodies) is terminal and never rerouted.
              """
              capsule = read_transport_capsule(capsule_json)
              if DECLARED_POLICY["maxAttempts"] != 1 or DECLARED_POLICY["streaming"] is not False:
                  raise ValueError("P3.3 transport policy is not the sealed fail-closed policy")
              started_utc = _utc_now()
              raw_body = _fixture_body(capsule, fixture_mode)
              base = {
                  "schema": ATTEMPT_SCHEMA,
                  "attemptOrdinal": 1,
                  "attemptStartedUtc": started_utc,
                  "capsuleDigest": capsule["capsuleDigest"],
                  "requestDigest": capsule["capsuleDigest"],
                  "policyDigest": capsule["policyDigest"],
                  "providerMode": DECLARED_POLICY["providerMode"],
                  "providerEndpoint": DECLARED_POLICY["providerEndpoint"],
                  "providerModel": DECLARED_POLICY["providerModel"],
                  "streaming": False,
                  "fixtureMode": fixture_mode,
                  "retryExecuted": False,
                  "selectionRule": DECLARED_POLICY["firstTerminalResponseRule"],
              }
              if raw_body is None:
                  body = {
                      **base,
                      "attemptEndedUtc": _utc_now(),
                      "providerStatus": None,
                      "responseBodyStarted": False,
                      "responseBodyBytes": 0,
                      "rawBodyBase64": None,
                      "responseBodySha256": None,
                      "terminalClass": "TRANSPORT_PREBODY_FAILURE",
                      "terminal": True,
                      "retryEligible": True,
                      "displayText": "TRANSPORT_PREBODY_FAILURE",
                      "displayDigest": _sha_bytes(b"TRANSPORT_PREBODY_FAILURE"),
                      "parsedText": None,
                      "parsedTextSha256": None,
                      "parseStatus": "no-body-received",
                      "transportExceptionDigest": _sha_bytes(b"local fixture pre-body transport failure"),
                      "bodyWithinDeclaredLimit": True,
                  }
              else:
                  raw_body = bytes(raw_body)
                  # These two fields are created before decoding, parsing, or text extraction.
                  raw_body_b64 = base64.b64encode(raw_body).decode("ascii")
                  raw_body_sha256 = _sha_bytes(raw_body)
                  terminal_class, display_text, parsed_text, parsed_text_sha256, parse_status = _parse_response(raw_body, fixture_mode)
                  body = {
                      **base,
                      "attemptEndedUtc": _utc_now(),
                      "providerStatus": _fixture_status(fixture_mode),
                      "responseBodyStarted": True,
                      "responseBodyBytes": len(raw_body),
                      "rawBodyBase64": raw_body_b64,
                      "responseBodySha256": raw_body_sha256,
                      "terminalClass": terminal_class,
                      "terminal": True,
                      "retryEligible": False,
                      "displayText": display_text,
                      "displayDigest": _sha_bytes(display_text.encode("utf-8")),
                      "parsedText": parsed_text,
                      "parsedTextSha256": parsed_text_sha256,
                      "parseStatus": parse_status,
                      "transportExceptionDigest": None,
                      "bodyWithinDeclaredLimit": len(raw_body) <= DECLARED_POLICY["rawBodyMaxBytes"],
                  }
              if set(body) != set(ATTEMPT_BODY_KEYS):
                  raise ValueError("Transport produced a non-canonical attempt archive")
              return {**body, "attemptDigest": _digest(body)}

          def verify_attempt_archive(capsule_json, attempt):
              capsule = read_transport_capsule(capsule_json)
              if not isinstance(attempt, dict) or set(attempt) != set(ATTEMPT_KEYS):
                  raise ValueError("Transport verification rejected an unexpected attempt archive")
              body = {key: attempt[key] for key in ATTEMPT_BODY_KEYS}
              if attempt.get("schema") != ATTEMPT_SCHEMA or _digest(body) != attempt.get("attemptDigest"):
                  raise ValueError("Transport verification rejected an attempt integrity mismatch")
              if attempt["attemptOrdinal"] != 1 or attempt["capsuleDigest"] != capsule["capsuleDigest"] or attempt["requestDigest"] != capsule["capsuleDigest"]:
                  raise ValueError("Transport verification rejected an attempt/capsule mismatch")
              if attempt["policyDigest"] != capsule["policyDigest"] or attempt["streaming"] is not False or attempt["retryExecuted"] is not False:
                  raise ValueError("Transport verification rejected a policy mismatch")
              if attempt["selectionRule"] != DECLARED_POLICY["firstTerminalResponseRule"] or attempt["terminal"] is not True:
