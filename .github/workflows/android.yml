name: Build Amelia Android-P3.2 One-Way Renderer APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android-P3.2 one-way renderer and prospective cohort
        shell: bash
        run: |
          set -euo pipefail
          test -f amelia_symbolic_core.py
          mkdir -p app/src/main/java/com/amelia/p3 app/src/main/python app/src/main/res/values
          # This legacy symbolic routine is packaged only as a named provenance artefact.
          # Android-P3 does not import it into the experimental causal path.
          cp amelia_symbolic_core.py app/src/main/python/amelia_symbolic_core.py

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AmeliaAndroidP32"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "17.0.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("com.chaquo.python") }
          android {
              namespace = "com.amelia.p3"
              compileSdk = 34
              defaultConfig {
                  // P3.2 installs beside P3 and P3.1, preserving their local records.
                  applicationId = "com.amelia.p32"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.5-android-p3.2-one-way-renderer"
                  ndk { abiFilters += listOf("armeabi-v7a", "arm64-v8a") }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          kotlin { jvmToolchain(17) }
          chaquopy { defaultConfig { version = "3.11" } }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:name="com.chaquo.python.android.PyApplication" android:allowBackup="true" android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          echo '<resources><string name="app_name">Amelia P3.2 Renderer</string></resources>' > app/src/main/res/values/strings.xml

          cat > app/src/main/python/p3_read_only_renderer.py <<'EOF'
          """Android-P3.2 pure downstream language renderer.

          The module accepts one canonical JSON string containing a whitelisted
          trace projection. It keeps no state, opens no files, imports no runtime
          component, and exposes no callback, router, memory, cohort, or mutation API.
          """
          from __future__ import annotations
          import hashlib
          import json

          RENDERER_SCHEMA = "amelia-p3.2-read-only-language-renderer-v1"
          PAYLOAD_SCHEMA = "amelia-p3.2-sealed-render-payload-v1"
          TRACE_SCHEMA = "amelia-p3-dialogue-trace-v1"
          TRACE_KEYS = (
              "schema", "sequence", "inputDigest", "route", "routeEdges", "modules",
              "kernelDeltaL1", "syzygyFlux", "preTensorNorm", "postTensorNorm",
              "stability", "activeAttractors", "causalDigest",
          )
          BODY_KEYS = (
              "schema", "rendererSchema", "traceDigest", "sequence", "inputDigest",
              "route", "routeEdges", "modules", "telemetry", "payloadContract",
          )
          PAYLOAD_KEYS = BODY_KEYS + ("payloadDigest",)
          CONTRACT = {
              "canonicalJsonOnly": True,
              "rawPromptIncluded": False,
              "routeResultIncluded": True,
              "mayCallRouter": False,
              "mayReadProcessMemory": False,
              "mayReadCohort": False,
              "mayMutate": False,
              "mayInvokeCallback": False,
          }

          def canon(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))

          def digest(value):
              return hashlib.sha256(canon(value).encode("utf-8")).hexdigest()

          def _is_digest(value):
              return isinstance(value, str) and len(value) == 64 and all(c in "0123456789abcdef" for c in value)

          def _require_trace(trace):
              if not isinstance(trace, dict) or set(trace) != set(TRACE_KEYS):
                  raise ValueError("Renderer rejected a non-canonical dialogue trace")
              if trace.get("schema") != TRACE_SCHEMA:
                  raise ValueError("Renderer rejected an unknown dialogue trace schema")
              trace_body = {key: trace[key] for key in TRACE_KEYS if key != "causalDigest"}
              if not _is_digest(trace.get("causalDigest")) or digest(trace_body) != trace["causalDigest"]:
                  raise ValueError("Renderer rejected an unsealed dialogue trace")
              if not isinstance(trace["route"], list) or len(trace["route"]) != 3 or not all(isinstance(z, int) and 0 <= z <= 9 for z in trace["route"]):
                  raise ValueError("Renderer rejected an invalid route projection")
              if not isinstance(trace["modules"], list) or not all(isinstance(item, str) for item in trace["modules"]):
                  raise ValueError("Renderer rejected invalid module labels")

          def seal_trace(trace):
              """Return an immutable canonical JSON payload; no original prompt is included."""
              _require_trace(trace)
              body = {
                  "schema": PAYLOAD_SCHEMA,
                  "rendererSchema": RENDERER_SCHEMA,
                  "traceDigest": trace["causalDigest"],
                  "sequence": trace["sequence"],
                  "inputDigest": trace["inputDigest"],
                  "route": list(trace["route"]),
                  "routeEdges": [{"from": edge["from"], "to": edge["to"], "kind": edge["kind"]} for edge in trace["routeEdges"]],
                  "modules": list(trace["modules"]),
                  "telemetry": {
                      "kernelDeltaL1": trace["kernelDeltaL1"],
                      "syzygyFlux": trace["syzygyFlux"],
                      "preTensorNorm": trace["preTensorNorm"],
                      "postTensorNorm": trace["postTensorNorm"],
                      "stability": trace["stability"],
                      "activeAttractors": list(trace["activeAttractors"]),
                  },
                  "payloadContract": dict(CONTRACT),
              }
              return canon({**body, "payloadDigest": digest(body)})

          def read_payload(payload_json):
              if not isinstance(payload_json, str) or len(payload_json.encode("utf-8")) > 8192:
                  raise ValueError("Renderer accepts only a bounded canonical JSON payload string")
              try:
                  payload = json.loads(payload_json)
              except Exception as error:
                  raise ValueError("Renderer rejected non-JSON payload") from error
              if not isinstance(payload, dict) or set(payload) != set(PAYLOAD_KEYS):
                  raise ValueError("Renderer rejected an unexpected payload shape")
              body = {key: payload[key] for key in BODY_KEYS}
              if payload.get("schema") != PAYLOAD_SCHEMA or payload.get("rendererSchema") != RENDERER_SCHEMA:
                  raise ValueError("Renderer rejected an unknown payload schema")
              if not _is_digest(payload.get("traceDigest")) or not _is_digest(payload.get("inputDigest")):
                  raise ValueError("Renderer rejected an invalid digest field")
              if not _is_digest(payload.get("payloadDigest")) or digest(body) != payload["payloadDigest"]:
                  raise ValueError("Renderer rejected a payload integrity mismatch")
              if payload.get("payloadContract") != CONTRACT:
                  raise ValueError("Renderer rejected a capability-contract mismatch")
              if not isinstance(payload["route"], list) or len(payload["route"]) != 3 or not all(isinstance(z, int) and 0 <= z <= 9 for z in payload["route"]):
                  raise ValueError("Renderer rejected an invalid route result")
              if not isinstance(payload["modules"], list) or not all(isinstance(item, str) for item in payload["modules"]):
                  raise ValueError("Renderer rejected invalid module labels")
              return payload

          def capability_audit():
              return {
                  "schema": "amelia-p3.2-renderer-capability-audit-v1",
                  "rendererSchema": RENDERER_SCHEMA,
                  "allowedInput": "immutable canonical JSON payload string",
                  **CONTRACT,
                  "imports": ["hashlib", "json"],
                  "outputOnly": True,
              }

          def render_payload(payload_json):
              """Pure deterministic language rendering from a verified sealed payload."""
              payload = read_payload(payload_json)
              route = " → ".join(f"Z{zone}" for zone in payload["route"])
              modules = ", ".join(payload["modules"])
              telemetry = payload["telemetry"]
              phases = [
                  "undivided potential", "differential activation", "lateral recombination",
                  "threshold articulation", "hinge pressure", "reciprocal coupling",
                  "syzygetic return", "temporal dispersion", "distributed relay", "terminal modulation",
              ]
              articulation = "; ".join(phases[zone] for zone in payload["route"])
              text = (
                  f"This is a downstream language rendering of sealed trace {payload['traceDigest'][:12]}. "
                  f"The resulting Numogram route is {route}: {articulation}. "
                  f"The trace names these active processes: {modules}. "
                  f"Its field-tensor norm changed from {telemetry['preTensorNorm']:.6f} to {telemetry['postTensorNorm']:.6f} "
                  f"with syzygy flux {telemetry['syzygyFlux']:.6f}. "
                  "The renderer received no original prompt, process-memory state, cohort record, router, or mutation handle; it can only display this verified trace."
              )
              result = {
                  "schema": "amelia-p3.2-rendered-language-display-v1",
                  "rendererSchema": RENDERER_SCHEMA,
                  "payloadDigest": payload["payloadDigest"],
                  "traceDigest": payload["traceDigest"],
                  "payloadVerified": True,
                  "deterministic": True,
                  "displayText": text,
                  "displayDigest": hashlib.sha256(text.encode("utf-8")).hexdigest(),
                  "capabilityAudit": capability_audit(),
              }
              result["renderDigest"] = digest(result)
              return result
          EOF

          cat > app/src/main/python/p3_cohort_assay.py <<'EOF'
          """Android-P3: sealed prospective ProcessFieldMemory matched-state cohort.

          It is a local, deterministic engineering assay. It contains no language model,
          free-text steering, target vector, outcome blueprint, or relay in its causal path.
          """
          from __future__ import annotations
          import hashlib, json, math, threading, time
          from pathlib import Path
          from p3_read_only_renderer import capability_audit, read_payload, render_payload, seal_trace

          try:
              from p3_build_provenance import BUILD_PROVENANCE
          except Exception:
              BUILD_PROVENANCE = {"revision": "source-only-validation"}

          N, ETA, KAPPA, W = 10, 0.05, 0.25, 20
          DEPTHS, PARENTS, REPS = (128, 256, 384, 432, 480, 512), (101, 202, 303), 10
          CONDITIONS = ("HISTORY_RETAINED", "ABLATED", "NEUTRAL_RESET", "TENSOR_PERMUTED")
          SCHEMA, LEDGER_SCHEMA = "amelia-android-p3-prospective-cohort-v1", "amelia-android-p3-ledger-v1"
          ZERO_FIELD = [round(1.0 / N, 12) for _ in range(N)]
          LOCK, INSTANCES = threading.RLock(), {}

          def canon(v): return json.dumps(v, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
          def dig(v): return hashlib.sha256(canon(v).encode("utf-8")).hexdigest()
          def cp(v): return json.loads(canon(v))
          def norm(v):
              v = [max(0.0, float(x)) for x in v]; total = sum(v)
              if total <= 0: return list(ZERO_FIELD)
              out = [round(x / total, 12) for x in v]; out[-1] = round(1.0 - sum(out[:-1]), 12); return out
          def zero(): return [[0.0 for _ in range(N)] for _ in range(N)]
          def td(t): return dig([[round(float(x), 12) for x in row] for row in t])
          def fd(f): return dig([round(float(x), 12) for x in f])
          def tnorm(t): return round(math.sqrt(sum(float(x) ** 2 for row in t for x in row)), 12)
          def baseline():
              return [[round((0.008 if r == c else 0.0) + (0.004 if r + c == N - 1 else 0.0), 12) for c in range(N)] for r in range(N)]
          M0 = baseline()

          class Mulberry32:
              def __init__(self, seed): self.s = int(seed) & 0xffffffff
              def random(self):
                  self.s = (self.s + 0x6D2B79F5) & 0xffffffff; t = self.s
                  t = ((t ^ (t >> 15)) * (t | 1)) & 0xffffffff
                  t ^= (t + (((t ^ (t >> 7)) * (t | 61)) & 0xffffffff)) & 0xffffffff
                  return ((t ^ (t >> 14)) & 0xffffffff) / 4294967296.0

          def child_seed(parent, depth, rep):
              return int(dig({"algorithm": "sha256-first-32bits-v1", "namespace": "amelia-p3-donor", "parentSeed": parent, "depth": depth, "replicate": rep})[:8], 16)
          def seeded_field(seed):
              rng = Mulberry32(seed); return norm([0.70 + rng.random() + 0.07 * ((seed + z) % 3) for z in range(N)])
          def chassis():
              return {"schema": "amelia-p3-matched-non-pfm-chassis-v1", "fieldState": norm([.93,1.07,1.01,.97,1.05,.95,1.03,.99,1.09,.91]), "sequence": 0, "activeAttractors": [], "lastStability": 1.0, "nativeRegime": "SYZYGETIC_GRID", "nativeAdmissibility": {"operator": "bounded-tension-v1", "externalSteering": False, "targetVector": None, "relay": None}}
          def projection(s):
              return {k: cp(s[k]) if isinstance(s[k], (list, dict)) else s[k] for k in ("fieldState", "sequence", "activeAttractors", "lastStability", "nativeRegime", "nativeAdmissibility")}
          def mbias(t):
              return norm([sum(abs(float(x)) for x in row) for row in t])
          def edges(z): return [{"to": (z + 1) % N, "kind": "ring"}, {"to": N - 1 - z, "kind": "syzygy"}, {"to": (z + 3) % N, "kind": "diagonal"}]
          def route(k):
              a = max(range(N), key=lambda z: (k[z], -z)); e1 = max(edges(a), key=lambda e: (k[e["to"]], -e["to"])); b = e1["to"]
              e2 = max([e for e in edges(b) if e["to"] != a], key=lambda e: (k[e["to"]], -e["to"])); c = e2["to"]
              return [a,b,c], [{"from":a,"to":b,"kind":e1["kind"]},{"from":b,"to":c,"kind":e2["kind"]}]
          def flux(k): return round(.03 * sum(abs(k[z] - k[N - 1 - z]) for z in range(N // 2)) / (N // 2), 12)
          def update_tensor(old, target, f):
              nxt = zero()
              for r in range(N):
                  for c in range(N):
                      v = float(old[r][c]) * (1.0 - .12 * ETA)
                      if r == target or c == target: v += f * ((ETA / .05) ** .08)
                      if r + c == N - 1: v += KAPPA * .02
                      nxt[r][c] = round(min(1.0, max(0.0, v)), 12)
              return nxt

          def conditioning_step(field, tensor, rng, source_id, step):
              pre, old = list(field), cp(tensor); drive = norm([.35 + rng.random() + .05 * ((step + z) % 4) for z in range(N)]); mem = mbias(old)
              k = norm([.34*pre[z] + .34*drive[z] + .16*mem[z] + .09*pre[(z-1)%N] + .07*pre[N-1-z] for z in range(N)])
              r, es = route(k); f = flux(k); post = norm([.84*k[z] + .10*k[(z-1)%N] + .06*k[N-1-z] for z in range(N)]); post[r[0]] += .024 + .012 * mem[r[0]]; post = norm(post); nt = update_tensor(old, r[0], f)
              # Compact append-only raw tuple: step, three selected zones, scaled flux,
              # and scaled terminal tensor norm. The enclosing trace digest binds the full sequence.
              raw = [step, r[0], r[1], r[2], int(round(f * 1000000000000)), int(round(tnorm(nt) * 1000000000000))]
              return post, nt, raw
          def donor(parent, depth, rep):
              seed, sid = child_seed(parent, depth, rep), f"D{depth}-R{rep:02d}-P{parent}"; rng = Mulberry32(seed); field, tensor, rows = seeded_field(seed), zero(), []
              for step in range(1, depth + 1): field, tensor, raw = conditioning_step(field, tensor, rng, sid, step); rows.append(raw)
              out = {"schema":"amelia-p3-donor-source-v1","sourceId":sid,"parentSeed":parent,"childSeed":seed,"depth":depth,"replicate":rep,"conditioningOperator":"seeded-native-conditioning-v1","terminalConditioningField":field,"deformationTensor":tensor,"tensorDigest":td(tensor),"conditioningTraceDigest":dig(rows),"conditioningSteps":depth}
              out["sourceDigest"] = dig(out); return out, rows

          def text_request(raw_input):
              canonical_input = " ".join(raw_input.casefold().split())
              bins = [0.0] * N
              for position, character in enumerate(canonical_input):
                  if "a" <= character <= "z": weight = ord(character) - 96
                  elif character.isdigit(): weight = int(character) + 1
                  else: continue
                  bins[(position + weight) % N] += weight
              if not any(bins): bins[0] = 1.0
              return {"rawInput":raw_input,"canonicalInput":canonical_input,"inputDigest":hashlib.sha256(canonical_input.encode("utf-8")).hexdigest(),"drive":norm(bins)}
          def dialogue_step(state, tensor, request):
              pre, old, drive = list(state["fieldState"]), cp(tensor), request["drive"]; mem = mbias(old)
              k = norm([.37*pre[z] + .37*drive[z] + .16*mem[z] + .05*pre[(z-1)%N] + .05*pre[N-1-z] for z in range(N)])
              r, es = route(k); f = flux(k); post = norm([.88*k[z] + .07*k[(z-1)%N] + .05*k[N-1-z] for z in range(N)]); post[r[0]] += .028 + .014*mem[r[0]]; post = norm(post); nt = update_tensor(old, r[0], f); top=max(post)
              next_state={"schema":"amelia-p3-dialogue-memory-v1","sequence":int(state["sequence"])+1,"fieldState":post,"deformationTensor":nt,"activeAttractors":[z for z,x in enumerate(post) if x>=top*.92],"lastStability":round(max(0.0,1.0-sum(abs(pre[z]-post[z]) for z in range(N))/2.0),12)}
              modules=["numogram_routing","process_field_memory","rhizomatic_recombination"]
              if f >= .001: modules.insert(1,"syzygetic_coupling")
              trace={"schema":"amelia-p3-dialogue-trace-v1","sequence":next_state["sequence"],"inputDigest":request["inputDigest"],"route":r,"routeEdges":es,"modules":modules,"kernelDeltaL1":round(sum(abs(pre[z]-k[z]) for z in range(N)),12),"syzygyFlux":f,"preTensorNorm":tnorm(old),"postTensorNorm":tnorm(nt),"stability":next_state["lastStability"],"activeAttractors":next_state["activeAttractors"]}; trace["causalDigest"]=dig(trace)
              return next_state, trace
          def return_step(state, tensor, condition, branch_id, step, seal):
              pre, old = list(state["fieldState"]), cp(tensor); mem = mbias(old)
              k = norm([.47*pre[z] + .24*mem[z] + .11*pre[(z-1)%N] + .11*pre[(z+1)%N] + .07*pre[N-1-z] for z in range(N)])
              r, es = route(k); f = flux(k); tension = round(sum(abs(pre[z] - mem[z]) for z in range(N)) / 2.0, 12); weight = round(max(.80, 1.0 - .12 * tension), 12)
              post = norm([.86*k[z] + .08*k[(z-1)%N] + .06*k[N-1-z] for z in range(N)]); post[r[0]] += (.022 + .018 * mem[r[0]]) * weight; post = norm(post); nt = update_tensor(old, r[0], f); top = max(post)
              next_state = {**cp(state), "fieldState":post, "sequence":int(state["sequence"])+1, "activeAttractors":[z for z,x in enumerate(post) if x >= top*.92], "lastStability":round(max(0.0, 1.0 - sum(abs(pre[z]-post[z]) for z in range(N))/2.0),12)}
              # Compact append-only raw tuple: step, route, scaled flux/tension/weight/stability.
              # Source tensor, matched chassis, terminal tensor and rawStepsDigest remain separately inspectable.
              raw = [step, r[0], r[1], r[2], int(round(f * 1000000000000)), int(round(tension * 1000000000000)), int(round(weight * 1000000000000)), int(round(next_state["lastStability"] * 1000000000000))]
              return next_state, nt, raw
          def disk(field, tensor):
              strain = [sum(float(x) for x in row) for row in tensor]; weights = [field[z] * (1+.8*math.tanh(strain[z])) for z in range(N)]
              x, y = sum(weights[z]*math.cos(2*math.pi*z/N) for z in range(N)), sum(weights[z]*math.sin(2*math.pi*z/N) for z in range(N)); radius = math.hypot(x,y); tau = sum(abs(strain[z]-strain[N-1-z]) for z in range(N//2))/(N//2)
              if radius < 1e-12: return {"u":0.0,"v":0.0}
              rho = min(.95, math.tanh(1.5*radius+.05*tau)); return {"u":round(rho*x/radius,12),"v":round(rho*y/radius,12)}
          def dh(a,b):
              du,dv = a["u"]-b["u"], a["v"]-b["v"]; ra=min(.999999999999,a["u"]**2+a["v"]**2); rb=min(.999999999999,b["u"]**2+b["v"]**2)
              return round(math.acosh(max(1.0,1+2*(du*du+dv*dv)/((1-ra)*(1-rb)))),12)
          def branch(ch, tensor, condition, bid, source, recipient, donor_label, seal, config, regime):
              state, t, rows, start = cp(ch), cp(tensor), [], dig(projection(ch))
              for step in range(1,W+1): state,t,raw = return_step(state,t,condition,bid,step,seal); rows.append(raw)
              terminal = {"fieldState":state["fieldState"],"deformationTensor":t,"sequence":state["sequence"],"activeAttractors":state["activeAttractors"],"lastStability":state["lastStability"],"projection":disk(state["fieldState"],t)}
              out = {"schema":"amelia-p3-raw-return-branch-v1","branchId":bid,"sourceId":source["sourceId"],"sourceDigest":source["sourceDigest"],"condition":condition,"recipientLabel":recipient,"injectedDonorLabel":donor_label,"sealDigest":seal,"configDigest":config,"commonRegimeDigest":regime,"matchedChassisDigest":dig(ch),"observationProjectionDigest":start,"initialTensorDigest":td(tensor),"rawStepsDigest":dig(rows),"terminal":terminal,"injectedTensorDigest":td(tensor)}
              out["returnDigest"] = dig(terminal); out["causalDigest"] = dig(out); return out, rows
          def pairs(items):
              keys = sorted(items); return [{"pair":f"{keys[i]}/{keys[j]}","D20":dh(items[keys[i]],items[keys[j]])} for i in range(len(keys)) for j in range(i+1,len(keys))]

          class Cohort:
              def __init__(self, root):
                  self.root=Path(root); self.root.mkdir(parents=True,exist_ok=True)
                  self.state_path=self.root/"p3-state.json"; self.ledger_path=self.root/"p3-ledger.jsonl"; self.head_path=self.root/"p3-ledger-head.txt"
                  self.dialogue_path=self.root/"p3-dialogue-memory.json"; self.dialogue_ledger_path=self.root/"p3-dialogue-ledger.jsonl"; self.dialogue_head_path=self.root/"p3-dialogue-ledger-head.txt"
                  self.renderer_state_path=self.root/"p3-renderer-state.json"; self.renderer_ledger_path=self.root/"p3-renderer-ledger.jsonl"; self.renderer_head_path=self.root/"p3-renderer-ledger-head.txt"
                  self.data=self.load(); self.head=self.head_path.read_text().strip() if self.head_path.exists() else "0"*64
                  self.dialogue=self.load_dialogue(); self.dialogue_head=self.dialogue_head_path.read_text().strip() if self.dialogue_head_path.exists() else "0"*64
                  self.renderer_state=self.load_renderer_state(); self.renderer_head=self.renderer_head_path.read_text().strip() if self.renderer_head_path.exists() else "0"*64
