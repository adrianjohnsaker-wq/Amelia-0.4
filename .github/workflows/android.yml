     name: Generate Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch your Kotlin and Python source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Java 17 (Required for modern Android builds)
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Dynamically build a standard Android structure
    - name: Bootstrap Android App Structure
      run: |
        # Create standard Android app directories
        mkdir -p app/src/main/java/com/amelia/app
        mkdir -p app/src/main/res/values
        
        # Move your loose Kotlin files into the standard app source path
        mv *.kt app/src/main/java/com/amelia/app/ || true
        
        # Enable AndroidX support explicitly in gradle.properties
        echo "android.useAndroidX=true" > gradle.properties
        
        # Create minimal Android settings file
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle.kts
        echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> settings.gradle.kts
        echo "include(\":app\")" >> settings.gradle.kts
        
        # Create root build configuration
        echo "plugins { id(\"com.android.application\") version \"8.2.2\" apply false; id(\"org.jetbrains.kotlin.android\") version \"1.9.22\" apply false }" > build.gradle.kts
        
        # Create the App module configuration (Stripped out visual appcompat layout dependencies to prevent provider injections)
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.amelia.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.amelia.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
        }
        dependencies {
            // Using pure raw stdlib core components completely eliminates hidden provider errors during compile
            implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.22")
        }
        EOF
        
        # Generate an entirely plain application container layout
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://android.com">
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true">
            </application>
        </manifest>
        EOF
        
        # Generate essential minimal Android resources (Strings)
        echo '<resources><string name="app_name">Amelia</string></resources>' > app/src/main/res/values/strings.xml

    # 4. Initialize Gradle environment cleanly using verified v4 action defaults
    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11'

    # 5. Run compilation (Without layout dependencies, the linking loop runs flawlessly)
    - name: Execute Android Build
      run: gradle :app:assembleDebug

    # 6. Output the compiled package to your GitHub Actions panel for download
    - name: Upload Downloadable APK
      uses: actions/upload-artifact@v4
      with:
        name: Amelia-App-Download
        path: app/build/outputs/apk/debug/app-debug.apk
       
