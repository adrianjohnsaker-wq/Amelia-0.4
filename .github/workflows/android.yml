                  controls.forEach { it.isEnabled = false }
                  output.text = when (fn) {
                      "run_predeclared_cohort" -> "P3 constructing the sealed cohort. All raw records are written before a descriptive summary..."
                      "run_dialogue_turn" -> "Amelia is committing a local trace, producing the P3.2 template baseline, and sealing a P3.3 provider-neutral capsule..."
                      "verify_last_renderer" -> "P3.2 replaying the sealed template payload without touching local memory or the cohort..."
                      "run_local_transport_fixture" -> "P3.3 is archiving one terminal response from a local non-network fixture. It will not call an external model..."
                      "verify_last_transport_archive" -> "P3.3 is checking raw-byte archive integrity and no-feedback invariants..."
                      else -> "P3 provenance operation running..."
                  }
                  Thread {
                      val raw = try { val module = Python.getInstance().getModule("p3_cohort_assay"); if (input == null) module.callAttr(fn, storageDir).toString() else module.callAttr(fn, input, storageDir).toString() } catch (e: Exception) { JSONObject().put("ok", false).put("error", e.message ?: "Android/Python failure").toString() }
                      runOnUiThread { render(raw); if (input != null) prompt.setText(""); controls.forEach { it.isEnabled = true } }
                  }.start()
              }
              private fun render(raw: String) {
                  val r = JSONObject(raw)
                  if (!r.optBoolean("ok", false)) { output.text = "P3.3 FAIL-CLOSED · do not interpret an outcome."; telemetry.text = "TELEMETRY · ERROR\n${r.optString("error")}"; return }
                  when (r.optString("kind")) {
                      "dialogue" -> dialogue(r)
                      "render_verify" -> rendererVerify(r)
                      "transport_fixture" -> transportFixture(r)
                      "transport_verify" -> transportVerify(r)
                      "transport_reset" -> transportReset(r)
                      "dialogue_reset" -> dialogueReset(r)
                      "cohort" -> cohort(r)
                      "verify" -> verify(r)
                      else -> reset(r)
                  }
              }
              private fun dialogue(r: JSONObject) {
                  val t=r.getJSONObject("trace"); val rendered=r.getJSONObject("renderer"); val audit=rendered.getJSONObject("capabilityAudit")
                  val capsule=r.getJSONObject("transportCapsule"); val policy=capsule.getJSONObject("transportPolicy"); val transportAudit=r.getJSONObject("transportCapabilityAudit")
                  output.text="AMELIA LOCAL TEMPLATE DISPLAY\n\n${rendered.optString("displayText")}\n\nP3.3 SEALED TRANSPORT CAPSULE\nCapsule: ${short(capsule.optString("capsuleDigest"))}\nTrace: ${short(capsule.getJSONObject("trace").optString("traceDigest"))}\nEndpoint: ${policy.optString("providerEndpoint")}\nModel: ${policy.optString("providerModel")}\n\nThe template display above is deterministic P3.2 baseline output. The P3.3 capsule is sealed for one later transport attempt; no external provider has been called."
                  telemetry.text="BOUNDARY & CAPSULE TELEMETRY\nTurn: ${t.optInt("sequence")}\nInput digest: ${short(t.optString("inputDigest"))}\nRoute: ${zones(t.getJSONArray("route"))}\nTensor: ${n(t.optDouble("preTensorNorm"))} → ${n(t.optDouble("postTensorNorm"))}\nFlux: ${n(t.optDouble("syzygyFlux"))}\n\nTemplate payload verified: ${rendered.optBoolean("payloadVerified")}\nTemplate raw prompt included: ${audit.optBoolean("rawPromptIncluded")}\n\nExternal provider configured: ${transportAudit.optBoolean("externalProviderConfigured")}\nNetwork enabled: ${transportAudit.optBoolean("networkAccessEnabled")}\nStreaming: ${policy.optBoolean("streaming")}\nMax attempts: ${policy.optInt("maxAttempts")}\nFirst terminal response rule: sealed\nResponse can route: ${transportAudit.optBoolean("responseMayEnterRouter")}\nResponse can mutate: ${transportAudit.optBoolean("responseMayMutate")}\nCohort record unchanged: ${r.optBoolean("cohortRecordUnchanged")}\nTransport ledger: ${short(r.optString("transportLedgerHead"))}"
              }
              private fun rendererVerify(r: JSONObject) {
                  val c=r.getJSONObject("checks")
                  output.text="P3.2 TEMPLATE RENDERER VERIFIED · the deterministic template display was reproduced solely from its sealed, read-only payload."
                  telemetry.text="TEMPLATE RENDERER REPLAY\nPayload integrity: ${c.optBoolean("payloadDigest")}\nTrace binding: ${c.optBoolean("traceDigest")}\nTemplate display reproduced: ${c.optBoolean("displayDigest")}\nCapability contract: ${c.optBoolean("capabilityContract")}\nDialogue memory unchanged: ${c.optBoolean("dialogueMemoryUnchanged")}\nCohort record unchanged: ${c.optBoolean("cohortRecordUnchanged")}\nPayload: ${short(r.optString("payloadDigest"))}\nRenderer ledger: ${short(r.optString("renderLedgerHead"))}"
              }
              private fun transportFixture(r: JSONObject) {
                  val capsule=r.getJSONObject("capsule"); val attempt=r.getJSONObject("attempt"); val checks=r.getJSONObject("runChecks")
                  output.text="P3.3 LOCAL TRANSPORT FIXTURE ARCHIVED\n\n${attempt.optString("displayText")}\n\nThis is a local, non-network fixture response — not an external LLM response. Its exact raw bytes were archived before parsing; this terminal result cannot route, alter ProcessFieldMemory, alter the template renderer record, or alter the cohort."
                  telemetry.text="TRANSPORT ATTEMPT\nCapsule: ${short(capsule.optString("capsuleDigest"))}\nTrace: ${short(capsule.getJSONObject("trace").optString("traceDigest"))}\nClass: ${attempt.optString("terminalClass")}\nAttempt: ${attempt.optInt("attemptOrdinal")}\nStatus: ${attempt.optString("providerStatus", "none")}\nTerminal: ${attempt.optBoolean("terminal")}\nRetry eligible: ${attempt.optBoolean("retryEligible")}\nRetry executed: ${attempt.optBoolean("retryExecuted")}\nRaw bytes: ${attempt.optInt("responseBodyBytes")}\nRaw SHA-256: ${short(attempt.optString("responseBodySha256"))}\nParsed text SHA-256: ${short(attempt.optString("parsedTextSha256"))}\nRaw within declared limit: ${attempt.optBoolean("bodyWithinDeclaredLimit")}\nRaw archived before parse: true\nDialogue unchanged: ${checks.optBoolean("dialogueMemoryUnchanged")}\nCohort unchanged: ${checks.optBoolean("cohortRecordUnchanged")}\nTemplate record unchanged: ${checks.optBoolean("templateRendererRecordUnchanged")}\nNetwork enabled: ${!checks.optBoolean("externalNetworkDisabled")}\nTransport ledger: ${short(r.optString("transportLedgerHead"))}"
              }
              private fun transportVerify(r: JSONObject) {
                  val c=r.getJSONObject("checks")
                  output.text="P3.3 TRANSPORT ARCHIVE VERIFIED · the sealed capsule, exact raw archive, terminal classification, and no-feedback boundary held. This verifies archive integrity, not LLM reproducibility; no external provider was called."
                  telemetry.text="TRANSPORT ARCHIVE VERIFICATION\nCapsule integrity: ${c.optBoolean("capsuleIntegrity")}\nPolicy predeclared: ${c.optBoolean("policyPredeclared")}\nStreaming disabled: ${c.optBoolean("streamingDisabled")}\nSingle attempt budget: ${c.optBoolean("singleAttemptBudget")}\nFirst terminal response: ${c.optBoolean("firstTerminalResponse")}\nAttempt metadata: ${c.optBoolean("attemptMetadata")}\nRaw response digest: ${c.optBoolean("rawResponseDigest")}\nRaw within declared limit: ${c.optBoolean("rawResponseWithinDeclaredLimit")}\nRaw response archived before parse: ${c.optBoolean("rawResponseArchivedBeforeParse")}\nParsed text integrity: ${c.optBoolean("parsedTextIntegrity")}\nDisplay integrity: ${c.optBoolean("displayIntegrity")}\nResponse display-only: ${c.optBoolean("responseOnlyDisplay")}\nExternal network disabled: ${c.optBoolean("externalNetworkDisabled")}\nCapability contract: ${c.optBoolean("capabilityContract")}\nDialogue unchanged at attempt: ${c.optBoolean("atAttemptDialogueMemoryUnchanged")}\nCohort unchanged at attempt: ${c.optBoolean("atAttemptCohortRecordUnchanged")}\nVerification non-mutating: ${c.optBoolean("verificationDialogueMemoryUnchanged") && c.optBoolean("verificationCohortRecordUnchanged")}\nAttempt: ${short(r.optString("attemptDigest"))}\nTransport ledger: ${short(r.optString("transportLedgerHead"))}"
              }
              private fun transportReset(r: JSONObject) { output.text="P3.3 active transport record reset. Append-only capsule and response archives are retained; dialogue, template renderer, and P3 cohort records were untouched."; val c=r.getJSONObject("checks"); telemetry.text="TRANSPORT RESET\nCapsules sealed: ${r.optInt("capsuleCounter")}\nDialogue unchanged: ${c.optBoolean("dialogueMemoryUnchanged")}\nCohort unchanged: ${c.optBoolean("cohortRecordUnchanged")}\nTemplate record unchanged: ${c.optBoolean("templateRendererRecordUnchanged")}\nTransport ledger: ${short(r.optString("transportLedgerHead"))}" }
              private fun dialogueReset(r: JSONObject) { output.text="Amelia dialogue memory reset. Earlier renderer records remain separately archived; the P3 cohort record is unchanged."; telemetry.text="DIALOGUE RESET\nSequence: ${r.optInt("sequence")}\nDialogue ledger: ${short(r.optString("dialogueLedgerHead"))}" }
              private fun cohort(r: JSONObject) {
                  val m=r.getJSONObject("manifest"); val s=m.getJSONObject("schedule"); val g=r.getJSONObject("gates"); val l=r.getJSONObject("ledger")
                  output.text = "P3 SEALED PROSPECTIVE COHORT\n\nExecution: ${m.optString("executionId")}\nSeal: ${short(m.optString("sealDigest"))}\n\n${s.optInt("triads")} triads · ${s.optInt("donorSources")} donor sources · ${s.optInt("forkBranches")} return branches\n${s.optInt("conditioningSteps")} conditioning + ${s.optInt("returnSteps")} return = ${s.optInt("totalRawSteps")} raw steps\n\nAndroid-P3.3 implementation readout only; template rendering and transport records remain outside this causal record.\n\n${depths(r.getJSONArray("depthSummaries"))}"
                  telemetry.text = "PROVENANCE GATES\nRaw before scoring: ${g.optBoolean("rawRecordedBeforeScoring")}\nMatched non-PFM chassis: ${g.optBoolean("matchedNonPfmState")}\nProjection identity: ${g.optBoolean("observationProjection")}\nDistinct donor tensors: ${g.optBoolean("distinctDonorTensors")}\nSame-tensor transfer: ${g.optBoolean("sameTensorReturnIdentity")}\nNull-control collapse: ${g.optBoolean("nullControlCollapse")}\nRetained D20 positive: ${g.optBoolean("historyRetainedPositive")}\n\nRaw: ${short(l.optString("returns"))}\nSummary: ${short(l.optString("measurement"))}"
              }
              private fun verify(r: JSONObject) { output.text=if(r.optBoolean("allMatch")) "P3 COHORT VERIFIED · every sealed source and return branch reproduced." else "P3 COHORT MISMATCH · do not interpret outcomes."; telemetry.text="DETERMINISTIC REPLAY\nSources: ${r.optInt("sourcesMatched")}/${r.optInt("sourcesExpected")}\nBranches: ${r.optInt("branchesMatched")}/${r.optInt("branchesExpected")}\nLedger: ${short(r.optString("ledgerHead"))}" }
              private fun reset(r: JSONObject) { output.text="P3 active cohort record reset. The append-only provenance ledger is retained."; telemetry.text="RESET\nCohort counter: ${r.optInt("cohortCounter")}\nReset counter: ${r.optInt("resetCounter")}\nLedger: ${short(r.optString("ledgerHead"))}" }
              private fun depths(a: JSONArray)=(0 until a.length()).joinToString("\n") { i -> val d=a.getJSONObject(i); "D=${d.optInt("depth")}: retained=${n(d.optDouble("HISTORY_RETAINED"))}; ablated=${n(d.optDouble("ABLATED"))}; reset=${n(d.optDouble("NEUTRAL_RESET"))}; permuted=${n(d.optDouble("TENSOR_PERMUTED"))}" }
              private fun zones(a: JSONArray)=(0 until a.length()).joinToString(" → ") { i -> "Z${a.optInt(i)}" }
              private fun JSONArray.joinText()=(0 until length()).joinToString(", ") { i -> optString(i) }
              private fun n(v: Double)=String.format(Locale.US,"%.6f",v)
              private fun short(v: String)=if(v.length<=12)v else v.take(12)
              private fun dp(v: Int)=(v*resources.displayMetrics.density).toInt()
          }
          EOF

      - name: Validate P3.3 transport capsule, dialogue isolation, and cohort provenance
        run: |
          python3 -m py_compile app/src/main/python/amelia_symbolic_core.py app/src/main/python/p3_read_only_renderer.py app/src/main/python/p3_llm_transport_capsule.py app/src/main/python/p3_cohort_assay.py app/src/main/python/p3_build_provenance.py
          P3_TEST_DIR="$(mktemp -d)"; export P3_TEST_DIR
          PYTHONPATH=app/src/main/python python3 - <<'PY'
          import base64, hashlib, inspect, json, os
          import p3_read_only_renderer as renderer
          import p3_llm_transport_capsule as transport
          from p3_cohort_assay import (
              reset_transport_record, run_dialogue_turn, run_local_transport_fixture,
              run_predeclared_cohort, verify_last_cohort, verify_last_renderer,
              verify_last_transport_archive,
          )
          root = os.environ["P3_TEST_DIR"]
          dialogue = json.loads(run_dialogue_turn("A declared local dialogue probe", root))
          assert dialogue["ok"] and dialogue["kind"] == "dialogue", dialogue
          assert dialogue["trace"]["sequence"] == 1 and dialogue["cohortRecordUnchanged"], dialogue
          assert "response" not in dialogue, dialogue
          payload, rendered, capsule = dialogue["renderingPayload"], dialogue["renderer"], dialogue["transportCapsule"]
          assert "A declared local dialogue probe" not in json.dumps(payload, sort_keys=True), payload
          assert "A declared local dialogue probe" not in json.dumps(capsule, sort_keys=True), capsule
          assert payload["payloadContract"]["rawPromptIncluded"] is False, payload
          assert payload["payloadContract"]["mayCallRouter"] is False, payload
          assert payload["payloadContract"]["mayReadProcessMemory"] is False, payload
          assert payload["payloadContract"]["mayReadCohort"] is False, payload
          assert payload["payloadContract"]["mayMutate"] is False, payload
          assert rendered["payloadVerified"] and rendered["deterministic"], rendered
          assert renderer.render_payload(renderer.canon(payload))["renderDigest"] == rendered["renderDigest"], rendered
          tampered = dict(payload); tampered["route"] = [9, 9, 9]
          try:
              renderer.render_payload(renderer.canon(tampered))
              raise AssertionError("Tampered rendering payload was accepted")
          except ValueError:
              pass
          renderer_source = inspect.getsource(renderer)
          for forbidden in ("p3_cohort_assay", "pathlib", "open(", "os.", "socket", "subprocess", "threading", "requests"):
              assert forbidden not in renderer_source, forbidden
          policy, capsule_contract = capsule["transportPolicy"], capsule["capsuleContract"]
          assert policy["providerMode"] == "LOCAL_ARCHIVE_FIXTURE" and policy["providerEndpoint"] == "LOCAL_ARCHIVE_FIXTURE", policy
          assert policy["externalProviderConfigured"] is False and policy["networkAccessEnabled"] is False, policy
          assert policy["streaming"] is False and policy["tools"] is False and policy["functionCalling"] is False and policy["webhook"] is False, policy
          assert policy["maxAttempts"] == 1 and "first terminal response" in policy["firstTerminalResponseRule"], policy
          assert policy["decodingParameters"] == {"temperature": 0.0, "topP": 1.0, "maxOutputTokens": 320, "seed": None, "responseFormat": "provider-default-text"}, policy
          assert policy["retryBinding"]["responseWithAnyBodyByteTerminal"] and policy["retryBinding"]["emptyCompletedResponseTerminal"] and policy["retryBinding"]["allAttemptsAppendOnlyLogged"], policy
          assert capsule_contract["responseMayEnterRouter"] is False and capsule_contract["responseMayEnterProcessMemory"] is False and capsule_contract["responseMayEnterCohort"] is False and capsule_contract["responseMayMutate"] is False, capsule_contract
          assert transport.read_transport_capsule(renderer.canon(capsule))["capsuleDigest"] == capsule["capsuleDigest"], capsule
          tampered_capsule = dict(capsule); tampered_capsule["trace"] = dict(capsule["trace"]); tampered_capsule["trace"]["route"] = [9, 9, 9]
          try:
              transport.read_transport_capsule(renderer.canon(tampered_capsule))
              raise AssertionError("Tampered transport capsule was accepted")
          except ValueError:
              pass
          transport_source = inspect.getsource(transport)
          for forbidden in ("p3_cohort_assay", "pathlib", "open(", "os.", "socket", "subprocess", "threading", "requests", "urllib", "http.client", "websocket"):
              assert forbidden not in transport_source, forbidden
          assert "INTERNET" not in open("app/src/main/AndroidManifest.xml", encoding="utf-8").read()
          renderer_check = json.loads(verify_last_renderer(root))
          assert renderer_check["ok"] and all(renderer_check["checks"].values()), renderer_check
          fixture = json.loads(run_local_transport_fixture(root))
          assert fixture["ok"] and fixture["kind"] == "transport_fixture", fixture
          attempt = fixture["attempt"]
          assert attempt["attemptOrdinal"] == 1 and attempt["terminal"] and not attempt["retryExecuted"], attempt
          assert attempt["terminalClass"] == "SUCCESS_TEXT" and attempt["responseBodyStarted"], attempt
          assert attempt["providerStatus"] == 200 and attempt["attemptStartedUtc"] and attempt["attemptEndedUtc"], attempt
          raw = base64.b64decode(attempt["rawBodyBase64"].encode("ascii"), validate=True)
          assert hashlib.sha256(raw).hexdigest() == attempt["responseBodySha256"], attempt
          assert hashlib.sha256(attempt["parsedText"].encode("utf-8")).hexdigest() == attempt["parsedTextSha256"], attempt
          assert all(fixture["runChecks"].values()), fixture
          transport_check = json.loads(verify_last_transport_archive(root))
          assert transport_check["ok"] and all(transport_check["checks"].values()), transport_check
          tampered_attempt = dict(attempt); tampered_attempt["rawBodyBase64"] = "AA=="
          try:
              transport.verify_attempt_archive(renderer.canon(capsule), tampered_attempt)
              raise AssertionError("Tampered raw response archive was accepted")
          except ValueError:
              pass
          for fixture_mode, expected in (("REFUSAL", "REFUSAL"), ("PROVIDER_ERROR", "PROVIDER_ERROR"), ("EMPTY_RESPONSE", "EMPTY_RESPONSE"), ("SCHEMA_INVALID", "SCHEMA_INVALID"), ("TRANSPORT_PREBODY_FAILURE", "TRANSPORT_PREBODY_FAILURE")):
              terminal = transport.archive_first_terminal_attempt(renderer.canon(capsule), fixture_mode)
              assert terminal["terminalClass"] == expected and terminal["terminal"] and not terminal["retryExecuted"], terminal
              assert all(transport.verify_attempt_archive(renderer.canon(capsule), terminal)["checks"].values()), terminal
          reset_transport = json.loads(reset_transport_record(root))
          assert reset_transport["ok"] and all(reset_transport["checks"].values()), reset_transport
          cohort = json.loads(run_predeclared_cohort(root))
          assert cohort["ok"], cohort
          assert all(cohort["gates"].values()), cohort["gates"]
          schedule = cohort["manifest"]["schedule"]
          assert (schedule["triads"], schedule["donorSources"], schedule["forkBranches"], schedule["returnSteps"], schedule["totalRawSteps"]) == (60, 180, 720, 14400, 80160)
          after = json.loads(run_dialogue_turn("A second local dialogue probe", root))
          assert after["ok"] and after["trace"]["sequence"] == 2 and after["cohortRecordUnchanged"], after
          after_renderer_check = json.loads(verify_last_renderer(root))
          assert after_renderer_check["ok"] and all(after_renderer_check["checks"].values()), after_renderer_check
          after_fixture = json.loads(run_local_transport_fixture(root))
          assert after_fixture["ok"] and all(after_fixture["runChecks"].values()), after_fixture
          after_transport_check = json.loads(verify_last_transport_archive(root))
          assert after_transport_check["ok"] and all(after_transport_check["checks"].values()), after_transport_check
          check = json.loads(verify_last_cohort(root))
          assert check["ok"] and check["allMatch"], check
          assert (check["sourcesMatched"], check["branchesMatched"]) == (180, 720)
          print("P3.3 transport capsule, template renderer, prospective cohort, and full replay validation passed")
          PY

      - name: Build Android-P3.3 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload Android-P3.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.3-Sealed-Transport-Capsule
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
