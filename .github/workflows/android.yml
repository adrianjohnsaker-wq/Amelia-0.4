name: Build Amelia Android-P3.9 Chat Faithfulness Vault APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify P3.9 source files exist
        shell: bash
        run: |
          set -euo pipefail

          for source in \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt \
            RenderTransport.kt \
            RenderPromptBuilder.kt \
            RendererFaithfulness.kt \
            ChatPromptBuilder.kt \
            PythonModuleVault.kt \
            P39MainActivity.kt
          do
            if [[ ! -f "$source" ]]; then
              echo "::error file=$source::Required P3.9 source is absent from repository root."
              find . -maxdepth 1 -type f -printf ' - %f\n' | sort
              exit 1
            fi
            echo "Present: $source ($(wc -c < "$source") bytes)"
          done

          echo
          echo "P3.9 source fingerprints:"
          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt \
            RenderTransport.kt \
            RenderPromptBuilder.kt \
            RendererFaithfulness.kt \
            ChatPromptBuilder.kt \
            PythonModuleVault.kt \
            P39MainActivity.kt

      # This uses the same direct-provider research-build pattern that P3.8.2
      # proved. It is deliberately attested before packaging, but is not a
      # production secret-distribution mechanism: the private APK contains the
      # compiled key. A missing/noncanonical/mismatched key prevents all calls.
      - name: Seal P3.9 credential attestation
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          P39_KEY="${ANTHROPIC_API_KEY:-}"
          if [[ -z "$P39_KEY" ]]; then
            {
              echo "P39_CREDENTIAL_FINGERPRINT=missing"
              echo "P39_CREDENTIAL_SHAPE=missing"
            } >> "$GITHUB_ENV"
            echo "::warning::ANTHROPIC_API_KEY is unset. P3.9 will run locally but make no provider calls."
          else
            P39_FINGERPRINT="$(printf '%s' "$P39_KEY" | sha256sum | awk '{print $1}')"
            P39_HAS_WHITESPACE=false
            P39_HAS_WRAPPER=false

            if [[ "$P39_KEY" =~ [[:space:]] ]]; then
              P39_HAS_WHITESPACE=true
            fi
            P39_FIRST_CHARACTER="${P39_KEY:0:1}"
            if [[ "$P39_FIRST_CHARACTER" == '"' || "$P39_FIRST_CHARACTER" == "'" || \
                  "$P39_KEY" == "Bearer "* || \
                  "$P39_KEY" == "x-api-key:"* || \
                  "$P39_KEY" == "ANTHROPIC_API_KEY="* ]]; then
              P39_HAS_WRAPPER=true
            fi

            if [[ "$P39_KEY" == sk-ant-* && "$P39_HAS_WHITESPACE" == false && "$P39_HAS_WRAPPER" == false ]]; then
              P39_SHAPE=canonical
            else
              P39_SHAPE=noncanonical
            fi

            {
              echo "P39_CREDENTIAL_FINGERPRINT=$P39_FINGERPRINT"
              echo "P39_CREDENTIAL_SHAPE=$P39_SHAPE"
            } >> "$GITHUB_ENV"
            echo "P3.9 credential attestation sealed: shape=$P39_SHAPE; sha256-prefix=${P39_FINGERPRINT:0:16}."
          fi

      - name: Create Android-P3.9 Chat Faithfulness Vault project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/amelia/p39 \
            app/src/main/java/com/amelia/bridge \
            app/src/main/java/com/amelia/renderer \
            app/src/main/java/com/amelia/modules \
            app/src/main/python \
            app/src/main/res/values

          cp bridge_probe.py app/src/main/python/bridge_probe.py
          cp Numogram.py app/src/main/python/Numogram.py
          cp NumogramBridge.kt app/src/main/java/com/amelia/bridge/NumogramBridge.kt
          cp ChaquopyProbe.kt app/src/main/java/com/amelia/bridge/ChaquopyProbe.kt
          cp RenderTransport.kt app/src/main/java/com/amelia/renderer/RenderTransport.kt
          cp RenderPromptBuilder.kt app/src/main/java/com/amelia/renderer/RenderPromptBuilder.kt
          cp RendererFaithfulness.kt app/src/main/java/com/amelia/renderer/RendererFaithfulness.kt
          cp ChatPromptBuilder.kt app/src/main/java/com/amelia/renderer/ChatPromptBuilder.kt
          cp PythonModuleVault.kt app/src/main/java/com/amelia/modules/PythonModuleVault.kt
          cp P39MainActivity.kt app/src/main/java/com/amelia/p39/MainActivity.kt

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmeliaAndroidP39"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "16.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          fun asJavaStringLiteral(value: String): String = buildString {
              append('"')
              value.forEach { character ->
                  when (character) {
                      '\\' -> append("\\\\")
                      '"' -> append("\\\"")
                      '\n' -> append("\\n")
                      '\r' -> append("\\r")
                      '\t' -> append("\\t")
                      else -> append(character)
                  }
              }
              append('"')
          }

          val sealedApiKey = System.getenv("ANTHROPIC_API_KEY") ?: ""
          val credentialFingerprint =
              System.getenv("P39_CREDENTIAL_FINGERPRINT") ?: "missing"
          val credentialShape =
              System.getenv("P39_CREDENTIAL_SHAPE") ?: "missing"
          val buildRevision =
              (System.getenv("GITHUB_SHA") ?: "local").take(12)

          android {
              namespace = "com.amelia.p39"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.amelia.p39"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.11-android-p3.9-chat-faithfulness-vault"

                  ndk {
                      abiFilters += listOf(
                          "armeabi-v7a",
                          "arm64-v8a"
                      )
                  }

                  buildConfigField(
                      "String",
                      "ANTHROPIC_API_KEY",
                      asJavaStringLiteral(sealedApiKey)
                  )
                  buildConfigField(
                      "String",
                      "CREDENTIAL_FINGERPRINT",
                      asJavaStringLiteral(credentialFingerprint)
                  )
                  buildConfigField(
                      "String",
                      "CREDENTIAL_SHAPE",
                      asJavaStringLiteral(credentialShape)
                  )
                  buildConfigField(
                      "String",
                      "BUILD_REVISION",
                      asJavaStringLiteral(buildRevision)
                  )
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          chaquopy {
              defaultConfig {
                  version = "3.8"
                  buildPython("python3.8")
                  pip {
                      install("torch==1.8.1")
                  }
              }
          }
          EOF

          # ACTION_OPEN_DOCUMENT supplies a user-selected document. No broad
          # storage permission is declared. INTERNET is the explicit P3.8+
          # boundary for the sealed direct provider calls.
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Amelia P3.9 Chat</string>
          </resources>
          EOF

      - name: Validate P3.9 source and boundary contracts
        shell: bash
        run: |
          set -euo pipefail

          python3.8 --version
          python3.8 -m py_compile \
            app/src/main/python/bridge_probe.py \
            app/src/main/python/Numogram.py

          python3.8 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("app/src/main/python/Numogram.py").read_text(encoding="utf-8"))
          functions = {
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required = {
              "get_runtime_info",
              "initialize_system",
              "get_status",
              "transition",
              "run_fork",
              "verify_last_fork",
          }
          missing = required - functions
          assert not missing, f"Missing Numogram entry points: {sorted(missing)}"
          print("P3.9 Numogram entry-point contract validated")
          PY

          grep -Fq 'install("torch==1.8.1")' app/build.gradle.kts
          grep -Fq 'buildPython("python3.8")' app/build.gradle.kts
          grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -Fq 'ACTION_OPEN_DOCUMENT' app/src/main/java/com/amelia/p39/MainActivity.kt
          grep -Fq 'PythonModuleVault.ingest' app/src/main/java/com/amelia/p39/MainActivity.kt
          grep -Fq 'STAGED_NOT_IMPORTED' app/src/main/java/com/amelia/modules/PythonModuleVault.kt
          grep -Fq 'CONTRADICTION_DETECTED' app/src/main/java/com/amelia/renderer/RendererFaithfulness.kt
          grep -Fq 'UNVERIFIABLE' app/src/main/java/com/amelia/renderer/RendererFaithfulness.kt
          grep -Fq 'amelia-p3.9-render-response-v1' app/src/main/java/com/amelia/renderer/RenderPromptBuilder.kt
          grep -Fq 'same_probability_distribution_only' app/src/main/java/com/amelia/renderer/RenderPromptBuilder.kt
          grep -Fq 'ChatPromptBuilder.build' app/src/main/java/com/amelia/p39/MainActivity.kt
          grep -Fq 'RenderPromptBuilder.buildFromForkResult' app/src/main/java/com/amelia/p39/MainActivity.kt
          grep -Fq 'RenderTransport.execute' app/src/main/java/com/amelia/p39/MainActivity.kt
          grep -Fq 'noFeedbackHeld' app/src/main/java/com/amelia/p39/MainActivity.kt

          CHAT_EXECUTE_BODY="$(
            sed -n \
              '/private fun executeChat(/,/^    private fun renderChatResult/p' \
              app/src/main/java/com/amelia/p39/MainActivity.kt
          )"
          if printf '%s' "$CHAT_EXECUTE_BODY" | \
            rg -n 'NumogramBridge|PythonModuleVault|runFork|transition\('
          then
            echo "FAIL: P3.9 chat must not call the substrate or module vault."
            exit 1
          fi

          # The staged module vault must not obtain a Chaquopy handle or call
          # an uploaded module. Its lexical audit is intentionally not called
          # a sandbox; P3.9's safety property is non-execution.
          if rg -n 'Python\.getInstance|getModule\(|callAttr\(' \
            app/src/main/java/com/amelia/modules/PythonModuleVault.kt
          then
            echo "FAIL: P3.9 module vault must not import or execute uploaded source."
            exit 1
          fi

          if rg -n 'put\("temperature"|put\("top_p"|put\("top_k"' \
            app/src/main/java/com/amelia/renderer/RenderTransport.kt
          then
            echo "FAIL: P3.9 must retain provider-default sampling omission."
            exit 1
          fi

          echo
          echo "P3.9 pre-build validation passed."
          echo "Chat and trace calls use a one-attempt sealed transport capsule."
          echo "Trace prose must be structured and checked against the sealed branch table."
          echo "Uploaded Python is staged in app-private storage and is not imported."

      - name: Build Android-P3.9 Chat Faithfulness Vault APK
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Record P3.9 build manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt \
            RenderTransport.kt \
            RenderPromptBuilder.kt \
            RendererFaithfulness.kt \
            ChatPromptBuilder.kt \
            PythonModuleVault.kt \
            P39MainActivity.kt \
            > p39-source-sha256.txt

          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"

          cat > p39-build-manifest.txt <<EOF
          Amelia Android P3.9
          ==================

          Revision:
          ${GITHUB_SHA}

          Android Gradle Plugin:
          8.7.3

          Gradle:
          8.9

          Java:
          17

          Chaquopy:
          16.1.0

          Android Python:
          3.8

          Torch requirement:
          torch==1.8.1

          Application ID:
          com.amelia.p39

          Chat lane:
          User text is sealed into a display-only chat capsule and sent in
          one provider call only when the attested credential is usable.
          Chat has no NumogramBridge reference and cannot become Numogram
          context, routing, mutation, cohort, or module invocation input.

          Trace renderer:
          The fixed Numogram fork is displayed as an authoritative sealed
          branch table. The provider must return a structured destination
          claim table plus prose. RendererFaithfulness compares the claims
          and the ABLATED_BOTH/NEUTRAL_RESET relation against the archived
          fork. Contradictory prose is rejected without retry; unparseable
          output is visibly labelled unverified.

          Module facility:
          ACTION_OPEN_DOCUMENT picks a .py source file without broad storage
          permission. P3.9 enforces a 128 KiB, UTF-8, filename, and lexical
          capability policy, then stores accepted source in app-private
          storage with SHA-256 provenance. This is a staging audit, not a
          sandbox: accepted modules are never added to sys.path, imported,
          or executed in P3.9.

          Provider credential:
          Same P3.8.2 private research-build model. The key is compiled into
          this APK after the runner fingerprint attestation passes. Keep the
          repository and artifact private; this is not a production key
          distribution design.

          Provider policy:
          Endpoint/model/attempt budget are sealed before each call.
          maxAttempts=1. Streaming, tools, function calling, and webhook are
          disabled. temperature, top_p, and top_k are omitted entirely.

          Runtime INTERNET permission:
          DECLARED for explicit user chat and sealed renderer calls.

          APK SHA-256:
          ${APK_SHA}

          Acceptance conditions:
          1. Chat response appears after one sealed display-only provider call
             and does not invoke Numogram or uploaded code.
          2. The trace screen displays a sealed branch table and reports
             VERIFIED only when structured renderer claims match it and
             no_feedback_held is true.
          3. A picked safe .py file appears as STAGED_NOT_IMPORTED; it is
             never automatically executed.
          EOF

          cat p39-build-manifest.txt
          cat p39-source-sha256.txt

      - name: Upload Android-P3.9 Chat Faithfulness Vault APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.9-Chat-Faithfulness-Vault
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            p39-build-manifest.txt
            p39-source-sha256.txt
          retention-days: 14
