name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch code using the latest runner version
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Java using v5 (which natively supports Node 24)
    - name: Set up JDK 11
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. Verify location and make the Gradle wrapper executable
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Build the application (assembleDebug is standard for Android CI)
    - name: Build with Gradle
      run: ./gradlew assembleDebug
