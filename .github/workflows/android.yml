name: Build Amelia Android-P2 Fork Assay APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android-P2 sealed matched-state fork assay
        shell: bash
        run: |
          set -euo pipefail
          test -f amelia_symbolic_core.py
          mkdir -p app/src/main/java/com/amelia/p2 app/src/main/python app/src/main/res/values
          # Preserved for provenance only. P2 never imports this symbolic text routine.
          cp amelia_symbolic_core.py app/src/main/python/amelia_symbolic_core.py

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AmeliaAndroidP2"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "17.0.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("com.chaquo.python") }
          android {
              namespace = "com.amelia.p2"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.amelia.p2"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.4-android-p2-fork"
                  ndk { abiFilters += listOf("armeabi-v7a", "arm64-v8a") }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          kotlin { jvmToolchain(17) }
          chaquopy { defaultConfig { version = "3.11" } }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:name="com.chaquo.python.android.PyApplication" android:allowBackup="true" android:label="@string/app_name" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          echo '<resources><string name="app_name">Amelia P2 Fork Assay</string></resources>' > app/src/main/res/values/strings.xml

          cat > app/src/main/python/p2_fork_assay.py <<'EOF'
          """Android-P2: local sealed, matched-state, non-mutating fork assay."""
          from __future__ import annotations

          import hashlib
          import json
          import math
          import threading
          import time
          from pathlib import Path
          from typing import Any, Dict, List, Sequence

          ZONES = 10
          SCHEMA = "amelia-android-p2-fork-assay-v1"
          ZERO = [round(1.0 / ZONES, 12) for _ in range(ZONES)]
          LOCK = threading.RLock()
          RUNTIMES: Dict[str, "ForkAssay"] = {}

          def canonical(value: Any) -> str:
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))

          def digest(value: Any) -> str:
              return hashlib.sha256(canonical(value).encode("utf-8")).hexdigest()

          def clone(value: Any) -> Any:
              return json.loads(canonical(value))

          def normalise(values: Sequence[float]) -> List[float]:
              values = [max(0.0, float(value)) for value in values]
              total = sum(values)
              if total <= 0.0:
                  return list(ZERO)
              result = [round(value / total, 12) for value in values]
              result[-1] = round(1.0 - sum(result[:-1]), 12)
              return result

          def zeros() -> List[List[float]]:
              return [[0.0 for _ in range(ZONES)] for _ in range(ZONES)]

          def l1(left: Sequence[float], right: Sequence[float]) -> float:
              return round(sum(abs(float(a) - float(b)) for a, b in zip(left, right)), 12)

          def tensor_norm(tensor: Sequence[Sequence[float]]) -> float:
              return round(math.sqrt(sum(float(value) ** 2 for row in tensor for value in row)), 12)

          def input_record(raw_input: str) -> Dict[str, Any]:
              canonical_input = " ".join(raw_input.casefold().split())
              bins = [0.0] * ZONES
              for position, character in enumerate(canonical_input):
                  if "a" <= character <= "z":
                      weight = ord(character) - 96
                  elif character.isdigit():
                      weight = int(character) + 1
                  else:
                      continue
                  bins[(position + weight) % ZONES] += weight
              if not any(bins):
                  bins[0] = 1.0
              return {
                  "rawInput": raw_input,
                  "canonicalInput": canonical_input,
                  "inputDigest": hashlib.sha256(canonical_input.encode("utf-8")).hexdigest(),
                  "inputLength": len(canonical_input),
                  "drive": normalise(bins),
              }

          class ForkAssay:
              def __init__(self, storage_dir: str) -> None:
                  self.root = Path(storage_dir)
                  self.root.mkdir(parents=True, exist_ok=True)
                  self.memory_path = self.root / "process_field_memory.json"
                  self.ledger_path = self.root / "p2-ledger.jsonl"
                  self.head_path = self.root / "p2-ledger-head.txt"
                  self.data = self._load()
                  self.head = self.head_path.read_text(encoding="utf-8").strip() if self.head_path.exists() else "0" * 64
                  self.config = {
                      "schema": SCHEMA,
                      "conditions": ["FULL", "ABLATED", "NEUTRAL_RESET"],
                      "stochasticity": "none; deterministic paired stream p2-deterministic-0",
                      "observationWindow": {"steps": 1, "selection": "declared single transition"},
                      "rawBeforeScoring": True,
                      "languageLayer": "display-only; no LLM or Governor in causal loop",
                      "measures": ["fieldDeltaL1", "fullBranchDeltaL1", "route", "stability", "tensorNorm", "activeAttractors"],
                  }
                  self.config_digest = digest(self.config)

              def _fresh(self) -> Dict[str, Any]:
                  return {
                      "schema": SCHEMA,
                      "sequence": 0,
                      "fieldState": list(ZERO),
                      "deformationTensor": zeros(),
                      "fieldHistory": [],
                      "recentTransitions": [],
                      "activeAttractors": [],
                      "lastStability": 1.0,
                      "forkCounter": 0,
                      "lastFork": None,
                  }

              def _load(self) -> Dict[str, Any]:
                  if not self.memory_path.exists():
                      fresh = self._fresh()
                      self._write(fresh)
                      return fresh
                  data = json.loads(self.memory_path.read_text(encoding="utf-8"))
                  if data.get("schema") != SCHEMA or len(data.get("fieldState", [])) != ZONES:
                      raise ValueError("Invalid Android-P2 ProcessFieldMemory")
                  if len(data.get("deformationTensor", [])) != ZONES:
                      raise ValueError("Invalid Android-P2 deformation tensor")
                  return data

              def _write(self, data: Dict[str, Any]) -> None:
                  temporary = self.memory_path.with_suffix(".tmp")
                  temporary.write_text(canonical(data), encoding="utf-8")
                  temporary.replace(self.memory_path)

              def _field_digest(self) -> str:
                  return digest({
                      "sequence": self.data["sequence"],
                      "fieldState": self.data["fieldState"],
                      "deformationTensor": self.data["deformationTensor"],
                      "fieldHistory": self.data["fieldHistory"],
                      "recentTransitions": self.data["recentTransitions"],
                      "activeAttractors": self.data["activeAttractors"],
                      "lastStability": self.data["lastStability"],
                  })

              def _append(self, kind: str, payload: Dict[str, Any]) -> Dict[str, str]:
                  record = {"schema": "amelia-android-p2-ledger-v1", "kind": kind, "previous": self.head, "payload": payload}
                  record["recordDigest"] = digest(record)
                  record["chainDigest"] = digest({"previous": self.head, "record": record["recordDigest"]})
                  with self.ledger_path.open("a", encoding="utf-8") as stream:
                      stream.write(canonical(record) + "\n")
                  self.head = record["chainDigest"]
                  temporary = self.head_path.with_suffix(".tmp")
                  temporary.write_text(self.head, encoding="utf-8")
                  temporary.replace(self.head_path)
                  return {"recordDigest": record["recordDigest"], "chainDigest": self.head}

              def _source_snapshot(self) -> Dict[str, Any]:
                  return {
                      "sequence": int(self.data["sequence"]),
                      "fieldState": clone(self.data["fieldState"]),
                      "deformationTensor": clone(self.data["deformationTensor"]),
                      "fieldHistory": clone(self.data["fieldHistory"]),
                      "recentTransitions": clone(self.data["recentTransitions"]),
                      "activeAttractors": clone(self.data["activeAttractors"]),
                      "lastStability": float(self.data["lastStability"]),
                      "sourceFieldDigest": self._field_digest(),
                  }

              def _memory_bias(self, tensor: Sequence[Sequence[float]]) -> List[float]:
                  weights = [sum(abs(float(value)) for value in row) for row in tensor]
                  return normalise(weights if any(weights) else [1.0] * ZONES)

              def _branch_snapshot(self, source: Dict[str, Any], condition: str, seal_digest: str) -> Dict[str, Any]:
                  if condition == "FULL":
                      return {**clone(source), "condition": condition, "memoryEnabled": True, "branchParentSeal": seal_digest}
                  if condition == "ABLATED":
                      return {
                          **clone(source),
                          "condition": condition,
                          "deformationTensor": zeros(),
                          "memoryEnabled": False,
                          "branchParentSeal": seal_digest,
                      }
                  if condition == "NEUTRAL_RESET":
                      return {
                          "condition": condition,
                          "sequence": 0,
                          "fieldState": list(ZERO),
                          "deformationTensor": zeros(),
                          "fieldHistory": [],
                          "recentTransitions": [],
                          "activeAttractors": [],
                          "lastStability": 1.0,
                          "sourceFieldDigest": source["sourceFieldDigest"],
                          "memoryEnabled": False,
                          "branchParentSeal": seal_digest,
                      }
                  raise ValueError("Unknown fork condition")

              def _transition(self, request: Dict[str, Any], snap: Dict[str, Any]) -> Dict[str, Any]:
                  pre = snap["fieldState"]
                  memory = self._memory_bias(snap["deformationTensor"])
                  kernel = []
                  for zone in range(ZONES):
                      ring = 0.5 * (pre[(zone - 1) % ZONES] + pre[(zone + 1) % ZONES])
                      kernel.append(0.42 * pre[zone] + 0.32 * request["drive"][zone] + 0.18 * memory[zone] + 0.05 * ring + 0.03 * pre[9 - zone])
                  kernel = normalise(kernel)
                  first = max(range(ZONES), key=lambda zone: (kernel[zone], -zone))
                  def edges(zone: int) -> List[Dict[str, Any]]:
                      return [{"to": (zone + 1) % ZONES, "kind": "ring"}, {"to": 9 - zone, "kind": "syzygy"}, {"to": (zone + 3) % ZONES, "kind": "diagonal"}]
                  edge_one = max(edges(first), key=lambda edge: (kernel[edge["to"]], -edge["to"]))
                  second = edge_one["to"]
                  edge_two = max([edge for edge in edges(second) if edge["to"] != first], key=lambda edge: (kernel[edge["to"]], -edge["to"]))
                  third = edge_two["to"]
                  flux = round(sum(abs(kernel[zone] - kernel[9 - zone]) for zone in range(5)) / 5.0, 12)
                  field = list(kernel)
                  modules: List[Dict[str, str]] = []
                  if flux >= 0.025:
                      field = normalise([0.88 * field[zone] + 0.12 * field[9 - zone] for zone in range(ZONES)])
                      modules.append({"module": "syzygetic_coupling", "effect": "complement-weighted update"})
                  field = normalise([0.92 * field[zone] + 0.04 * (field[(zone - 1) % ZONES] + field[(zone + 1) % ZONES]) for zone in range(ZONES)])
                  modules.append({"module": "rhizomatic_recombination", "effect": "ring-neighbour diffusion"})
                  field[first] += 0.035 + 0.015 * memory[first]
                  field = normalise(field)
                  modules.append({"module": "attractor_consolidation", "effect": "route-dominant bounded reinforcement"})
                  new_tensor = zeros()
                  if snap["memoryEnabled"]:
                      for row in range(ZONES):
                          for column in range(ZONES):
                              syzygy = field[row] - field[column] if row + column == 9 else 0.0
                              new_tensor[row][column] = round(0.988 * snap["deformationTensor"][row][column] + 0.055 * field[row] * pre[column] + 0.016 * syzygy, 12)
                  else:
                      new_tensor = clone(snap["deformationTensor"])
                  entropy = round(-sum(value * math.log(value) for value in kernel if value > 0.0) / math.log(ZONES), 12)
                  top = max(field)
                  trace = {
                      "schema": "amelia-android-p2-raw-transition-v1",
                      "condition": snap["condition"],
                      "branchParentSeal": snap["branchParentSeal"],
                      "sourceFieldDigest": snap["sourceFieldDigest"],
                      "sequence": int(snap["sequence"]) + 1,
                      "inputDigest": request["inputDigest"],
                      "preState": clone(pre),
                      "preTensorNorm": tensor_norm(snap["deformationTensor"]),
                      "kernelState": kernel,
                      "fieldState": field,
                      "nextTensor": new_tensor,
                      "postTensorNorm": tensor_norm(new_tensor),
                      "route": [first, second, third],
                      "routeEdges": [{"from": first, "to": second, "kind": edge_one["kind"]}, {"from": second, "to": third, "kind": edge_two["kind"]}],
                      "modules": modules,
                      "kernelDeltaL1": l1(pre, kernel),
                      "fieldEntropy": entropy,
                      "syzygyFlux": flux,
                      "postStability": round(max(0.0, 1.0 - l1(pre, field) / 2.0), 12),
                      "activeAttractors": [zone for zone, value in enumerate(field) if value >= top * 0.92],
                      "memoryEnabled": bool(snap["memoryEnabled"]),
                      "configDigest": self.config_digest,
                  }
                  trace["causalDigest"] = digest(trace)
                  return trace

              def develop(self, raw_input: str) -> Dict[str, Any]:
                  if not raw_input.strip():
                      raise ValueError("A non-empty developmental input is required")
                  request = input_record(raw_input)
                  source = self._source_snapshot()
                  snap = self._branch_snapshot(source, "FULL", "developmental-turn")
                  trace = self._transition(request, snap)
                  event = {"sequence": trace["sequence"], "inputDigest": trace["inputDigest"], "route": trace["route"], "causalDigest": trace["causalDigest"], "stability": trace["postStability"]}
                  self.data["sequence"] = trace["sequence"]
                  self.data["fieldState"] = trace["fieldState"]
                  self.data["deformationTensor"] = trace["nextTensor"]
                  self.data["activeAttractors"] = trace["activeAttractors"]
                  self.data["lastStability"] = trace["postStability"]
                  self.data["fieldHistory"] = (self.data["fieldHistory"] + [event])[-200:]
                  self.data["recentTransitions"] = (self.data["recentTransitions"] + [event])[-50:]
                  self._write(self.data)
                  ledger = self._append("developmental_full_turn", {"rawInput": raw_input, "trace": trace, "fieldDigest": self._field_digest()})
                  return {"ok": True, "kind": "development", "trace": trace, "history": len(self.data["fieldHistory"]), "fieldDigest": self._field_digest(), "ledgerHead": ledger["chainDigest"]}

              def fork(self, raw_input: str) -> Dict[str, Any]:
                  if not raw_input.strip():
                      raise ValueError("A non-empty fork input is required")
                  before_field_digest = self._field_digest()
                  source = self._source_snapshot()
                  request = input_record(raw_input)
                  self.data["forkCounter"] = int(self.data.get("forkCounter", 0)) + 1
                  created = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
                  identity = {"counter": self.data["forkCounter"], "source": source["sourceFieldDigest"], "input": request["inputDigest"], "createdUtc": created}
                  fork_id = "P2-FORK-" + digest(identity)[:16]
                  capsule = {
                      "schema": "amelia-android-p2-sealed-fork-v1",
                      "studyId": "AMELIA-ANDROID-P2-MATCHED-FORK",
                      "executionId": fork_id,
                      "createdUtc": created,
                      "sourceSnapshot": source,
                      "sourceFieldDigest": source["sourceFieldDigest"],
                      "request": request,
                      "conditions": {
                          "FULL": "exact source state and full deformation tensor",
                          "ABLATED": "exact source present state with zero deformation tensor and memory disabled",
                          "NEUTRAL_RESET": "same sealed request with zero field/tensor/history reset baseline",
                      },
                      "pairedStream": "p2-deterministic-0; no PRNG",
                      "observationWindow": self.config["observationWindow"],
                      "predeclaredMeasures": self.config["measures"],
                      "effectFormula": "fieldDeltaL1 = L1(branch.fieldState, source.fieldState); fullBranchDeltaL1 = L1(branch.fieldState, FULL.fieldState)",
                      "thresholds": "none; descriptive raw assay only",
                      "configDigest": self.config_digest,
                  }
                  seal_digest = digest(capsule)
                  capsule["sealDigest"] = seal_digest
                  seal = self._append("fork_sealed_before_execution", capsule)
                  try:
                      branches = {condition: self._transition(request, self._branch_snapshot(source, condition, seal_digest)) for condition in ("FULL", "ABLATED", "NEUTRAL_RESET")}
                  except Exception as error:
                      self._append("fork_failure", {"executionId": fork_id, "sealDigest": seal_digest, "errorType": type(error).__name__, "error": str(error)})
                      raise
                  raw = self._append("fork_raw_transitions_before_scoring", {"executionId": fork_id, "sealDigest": seal_digest, "branches": branches})
                  summary = {}
                  full_state = branches["FULL"]["fieldState"]
                  for condition, branch in branches.items():
                      summary[condition] = {
                          "route": branch["route"],
                          "fieldDeltaL1": l1(branch["fieldState"], source["fieldState"]),
                          "fullBranchDeltaL1": l1(branch["fieldState"], full_state),
                          "stability": branch["postStability"],
                          "tensorNorm": branch["postTensorNorm"],
                          "activeAttractors": branch["activeAttractors"],
                          "causalDigest": branch["causalDigest"],
                      }
                  after_field_digest = self._field_digest()
                  invariants = {
                      "fullAndAblatedSamePreState": branches["FULL"]["preState"] == branches["ABLATED"]["preState"],
                      "fullAndAblatedSameSourceDigest": branches["FULL"]["sourceFieldDigest"] == branches["ABLATED"]["sourceFieldDigest"],
                      "neutralExplicitResetBaseline": branches["NEUTRAL_RESET"]["preState"] == ZERO and not branches["NEUTRAL_RESET"]["memoryEnabled"],
                      "sourceFieldUnmutated": before_field_digest == after_field_digest,
                      "rawLedgerHead": raw["chainDigest"],
                  }
                  scored = self._append("fork_descriptive_measurement", {"executionId": fork_id, "sealDigest": seal_digest, "summary": summary, "invariants": invariants})
                  self.data["lastFork"] = {"capsule": capsule, "expected": {condition: branch["causalDigest"] for condition, branch in branches.items()}, "summary": summary, "invariants": invariants}
                  self._write(self.data)
                  return {"ok": True, "kind": "fork", "capsule": capsule, "branches": branches, "summary": summary, "invariants": invariants, "ledger": {"seal": seal["chainDigest"], "raw": raw["chainDigest"], "measurement": scored["chainDigest"]}}

              def verify(self) -> Dict[str, Any]:
                  last = self.data.get("lastFork")
                  if not last:
                      raise ValueError("Seal and run one fork before verification")
                  capsule = last["capsule"]
                  source = capsule["sourceSnapshot"]
                  request = capsule["request"]
                  observed = {condition: self._transition(request, self._branch_snapshot(source, condition, capsule["sealDigest"])) for condition in ("FULL", "ABLATED", "NEUTRAL_RESET")}
                  matches = {condition: observed[condition]["causalDigest"] == last["expected"][condition] for condition in observed}
                  record = self._append("fork_deterministic_verification", {"executionId": capsule["executionId"], "sealDigest": capsule["sealDigest"], "matches": matches, "observed": {condition: observed[condition]["causalDigest"] for condition in observed}})
                  return {"ok": True, "kind": "verify", "executionId": capsule["executionId"], "matches": matches, "allMatch": all(matches.values()), "ledgerHead": record["chainDigest"]}

              def reset(self) -> Dict[str, Any]:
                  self.data = self._fresh()
                  self._write(self.data)
                  record = self._append("explicit_p2_memory_reset", {"sequence": 0})
                  return {"ok": True, "kind": "reset", "sequence": 0, "ledgerHead": record["chainDigest"]}

          def instance(storage_dir: str) -> ForkAssay:
              key = str(Path(storage_dir))
              if key not in RUNTIMES:
                  RUNTIMES[key] = ForkAssay(key)
              return RUNTIMES[key]

          def guarded(action):
              try:
                  with LOCK:
                      return json.dumps(action(), ensure_ascii=False, sort_keys=True)
              except Exception as error:
                  return json.dumps({"ok": False, "errorType": type(error).__name__, "error": str(error)}, ensure_ascii=False, sort_keys=True)

          def develop_memory(raw_input: str, storage_dir: str) -> str:
              return guarded(lambda: instance(storage_dir).develop(raw_input))

          def seal_and_run_fork(raw_input: str, storage_dir: str) -> str:
              return guarded(lambda: instance(storage_dir).fork(raw_input))

          def verify_last_fork(storage_dir: str) -> str:
              return guarded(lambda: instance(storage_dir).verify())

          def reset_p2(storage_dir: str) -> str:
              return guarded(lambda: instance(storage_dir).reset())
          EOF

          cat > app/src/main/java/com/amelia/p2/MainActivity.kt <<'EOF'
          package com.amelia.p2

          import android.app.Activity
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.chaquo.python.Python
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.util.Locale

          class MainActivity : Activity() {
              private lateinit var input: EditText
              private lateinit var output: TextView
              private lateinit var telemetry: TextView
              private lateinit var develop: Button
              private val storageDir by lazy { File(filesDir, "amelia_p2").apply { mkdirs() }.absolutePath }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(16), dp(16), dp(16)) }
                  root.addView(TextView(this).apply { text = "AMELIA · ANDROID-P2"; textSize = 23f; gravity = Gravity.CENTER_HORIZONTAL })
                  root.addView(TextView(this).apply { text = "Sealed matched-state fork · local only · no language model in causal loop"; textSize = 12f; gravity = Gravity.CENTER_HORIZONTAL; setPadding(0, dp(5), 0, dp(8)) })
                  val readout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  output = TextView(this).apply { text = "Develop P2 ProcessFieldMemory, then seal one three-branch fork. Fork branches never mutate the source field."; textSize = 15f; setPadding(0, dp(8), 0, dp(8)) }
                  telemetry = TextView(this).apply { text = "TELEMETRY · no sealed fork yet"; textSize = 13f; setPadding(dp(8), dp(8), dp(8), dp(8)) }
                  readout.addView(output); readout.addView(telemetry)
                  root.addView(ScrollView(this).apply { addView(readout) }, LinearLayout.LayoutParams(-1, 0, 1f))
                  input = EditText(this).apply { hint = "Declared local input"; inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE; minLines = 2; maxLines = 4 }
                  root.addView(input)
                  develop = Button(this).apply { text = "DEVELOP FULL MEMORY"; setOnClickListener { submit("develop_memory") } }
                  root.addView(develop)
                  root.addView(Button(this).apply { text = "SEAL & RUN THREE-BRANCH FORK"; setOnClickListener { submit("seal_and_run_fork") } })
                  root.addView(Button(this).apply { text = "VERIFY LAST SEALED FORK"; setOnClickListener { invoke("verify_last_fork", null) } })
                  root.addView(Button(this).apply { text = "RESET P2 MEMORY"; setOnClickListener { invoke("reset_p2", null) } })
                  setContentView(root)
              }

              private fun submit(function: String) { val text = input.text.toString().trim(); if (text.isNotEmpty()) invoke(function, text) }

              private fun invoke(function: String, rawInput: String?) {
                  develop.isEnabled = false; output.text = "P2 local operation running..."
                  Thread {
                      val result = try {
                          val module = Python.getInstance().getModule("p2_fork_assay")
                          if (rawInput == null) module.callAttr(function, storageDir).toString() else module.callAttr(function, rawInput, storageDir).toString()
                      } catch (error: Exception) { JSONObject().put("ok", false).put("error", error.message ?: "Android/Python failure").toString() }
                      runOnUiThread { render(result); input.setText(""); develop.isEnabled = true }
                  }.start()
              }

              private fun render(raw: String) {
                  val result = JSONObject(raw)
                  if (!result.optBoolean("ok", false)) { output.text = "P2 operation failed."; telemetry.text = "TELEMETRY · ERROR\n${result.optString("error")}"; return }
                  when (result.optString("kind")) {
                      "development" -> development(result)
                      "fork" -> fork(result)
                      "verify" -> verification(result)
                      else -> { output.text = "P2 memory reset."; telemetry.text = "RESET\nSequence: ${result.optInt("sequence")}\nLedger: ${short(result.optString("ledgerHead"))}" }
                  }
              }

              private fun development(result: JSONObject) {
                  val trace = result.getJSONObject("trace")
                  output.text = "P2 DEVELOPMENT TURN\n\nRoute: ${zones(trace.optJSONArray("route"))}\nHistory: ${result.optInt("history")}\nField: ${short(result.optString("fieldDigest"))}"
                  telemetry.text = "DEVELOPMENT\nStability: ${n(trace.optDouble("postStability"))}\nTensor: ${n(trace.optDouble("postTensorNorm"))}\nCausal: ${short(trace.optString("causalDigest"))}\nLedger: ${short(result.optString("ledgerHead"))}"
              }

              private fun fork(result: JSONObject) {
                  val capsule = result.getJSONObject("capsule"); val branches = result.getJSONObject("branches"); val summary = result.getJSONObject("summary"); val check = result.getJSONObject("invariants"); val ledger = result.getJSONObject("ledger")
                  output.text = "P2 SEALED MATCHED-STATE FORK\n\nExecution: ${capsule.optString("executionId")}\nSource: ${short(capsule.optString("sourceFieldDigest"))}\nSeal: ${short(capsule.optString("sealDigest"))}\n\nFULL: ${branchText(branches.getJSONObject("FULL"), summary.getJSONObject("FULL"))}\nABLATED: ${branchText(branches.getJSONObject("ABLATED"), summary.getJSONObject("ABLATED"))}\nNEUTRAL_RESET: ${branchText(branches.getJSONObject("NEUTRAL_RESET"), summary.getJSONObject("NEUTRAL_RESET"))}"
                  telemetry.text = "FORK INVARIANTS\nFULL/ABLATED pre-state matched: ${check.optBoolean("fullAndAblatedSamePreState")}\nSource unmutated: ${check.optBoolean("sourceFieldUnmutated")}\nNeutral reset explicit: ${check.optBoolean("neutralExplicitResetBaseline")}\nRaw: ${short(ledger.optString("raw"))}\nMeasurement: ${short(ledger.optString("measurement"))}"
              }

              private fun verification(result: JSONObject) {
                  val matches = result.getJSONObject("matches")
                  output.text = if (result.optBoolean("allMatch")) "SEALED FORK VERIFIED · all three causal digests reproduced." else "SEALED FORK MISMATCH · inspect the ledger; do not interpret outcomes."
                  telemetry.text = "FORK VERIFICATION\nFULL: ${matches.optBoolean("FULL")}\nABLATED: ${matches.optBoolean("ABLATED")}\nNEUTRAL_RESET: ${matches.optBoolean("NEUTRAL_RESET")}\nLedger: ${short(result.optString("ledgerHead"))}"
              }

              private fun branchText(branch: JSONObject, summary: JSONObject): String = "${zones(branch.optJSONArray("route"))}; Δ=${n(summary.optDouble("fieldDeltaL1"))}; FΔ=${n(summary.optDouble("fullBranchDeltaL1"))}"
              private fun zones(values: JSONArray?): String = if (values == null) "—" else (0 until values.length()).joinToString(" → ") { "Z${values.optInt(it)}" }
              private fun n(value: Double): String = String.format(Locale.US, "%.6f", value)
              private fun short(value: String): String = if (value.length <= 12) value else value.take(12)
              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()
          }
          EOF

      - name: Validate sealed fork invariants
        run: |
          python3 -m py_compile app/src/main/python/amelia_symbolic_core.py app/src/main/python/p2_fork_assay.py
          P2_TEST_DIR="$(mktemp -d)"; export P2_TEST_DIR
          PYTHONPATH=app/src/main/python python3 -c 'import json, os; from p2_fork_assay import develop_memory, seal_and_run_fork, verify_last_fork; root=os.environ["P2_TEST_DIR"]; first=json.loads(develop_memory("developmental field", root)); assert first["ok"]; assay=json.loads(seal_and_run_fork("paired test input", root)); assert assay["ok"] and assay["invariants"]["fullAndAblatedSamePreState"] and assay["invariants"]["sourceFieldUnmutated"]; verify=json.loads(verify_last_fork(root)); assert verify["ok"] and verify["allMatch"]'

      - name: Build Android-P2 APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload Android-P2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P2-Fork-Assay
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
