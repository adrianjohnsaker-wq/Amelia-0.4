name: Build Amelia Android-P3.6 Torch Numogram Probe APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # P3.6 stays on the P3.5A-proven Chaquopy 16.1 / Python 3.8 lane.
      # The new variable is exactly one native package: torch==1.8.1.
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify P3.6 source files exist
        shell: bash
        run: |
          set -euo pipefail

          for source in bridge_probe.py Numogram.py NumogramBridge.kt ChaquopyProbe.kt; do
            if [[ ! -f "$source" ]]; then
              echo "::error file=$source::Required P3.6 source is absent from repository root."
              echo "Repository root contents:"
              find . -maxdepth 1 -type f -printf ' - %f\n' | sort
              exit 1
            fi
            echo "Present: $source ($(wc -c < "$source") bytes)"
          done

          echo
          echo "P3.6 source fingerprints:"
          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt

      - name: Create Android-P3.6 Torch Numogram probe project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/amelia/p36 \
            app/src/main/java/com/amelia/bridge \
            app/src/main/python \
            app/src/main/res/values

          # Preserve the four root sources as the build inputs. P3.6 imports
          # Numogram.py through NumogramBridge; the P3.5A probe pair remains
          # packaged solely as source provenance and is not invoked.
          cp bridge_probe.py \
            app/src/main/python/bridge_probe.py

          cp Numogram.py \
            app/src/main/python/Numogram.py

          cp NumogramBridge.kt \
            app/src/main/java/com/amelia/bridge/NumogramBridge.kt

          cp ChaquopyProbe.kt \
            app/src/main/java/com/amelia/bridge/ChaquopyProbe.kt

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmeliaAndroidP36"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "16.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # P3.6's sole new dependency is the Chaquopy-native Android Torch
          # wheel selected by this exact requirement. It is intentionally not
          # supplemented by a language model, network client, or persistence
          # package.
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.amelia.p36"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.amelia.p36"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.8-android-p3.6-torch-numogram-probe"

                  ndk {
                      abiFilters += listOf(
                          "armeabi-v7a",
                          "arm64-v8a"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          chaquopy {
              defaultConfig {
                  version = "3.8"
                  buildPython("python3.8")

                  pip {
                      install("torch==1.8.1")
                  }
              }
          }
          EOF

          # P3.6 remains a local substrate assay. It has no INTERNET
          # permission and no outbound provider path.
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Amelia P3.6 Torch Numogram</string>
          </resources>
          EOF

          # P3.6's on-device experiment is intentionally fixed and small:
          #
          # Kotlin -> NumogramBridge -> Numogram.py -> Torch
          #        -> initialize(seed=3606, dimension=3)
          #        -> status
          #        -> transition(origin=Z3, context={})
          #        -> status -> Kotlin
          #
          # No free-text input, network call, language model, persistent
          # memory store, or external routing surface participates here.
          cat > app/src/main/java/com/amelia/p36/MainActivity.kt <<'EOF'
          package com.amelia.p36

          import android.app.Activity
          import android.os.Bundle
          import android.util.Log
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.amelia.bridge.NumogramBridge
          import kotlin.math.abs
          import org.json.JSONObject

          class MainActivity : Activity() {

              companion object {
                  private const val LOG_TAG = "AMELIA_P36"
                  private const val PROBE_SEED = 3606
                  private const val PROBE_DIMENSION = 3
                  private const val PROBE_ORIGIN = 3
              }

              private lateinit var statusView: TextView
              private lateinit var detailView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(24), dp(20), dp(24))
                  }

                  root.addView(
                      TextView(this).apply {
                          text = "AMELIA · P3.6"
                          textSize = 25f
                          gravity = Gravity.CENTER_HORIZONTAL
                      }
                  )

                  root.addView(
                      TextView(this).apply {
                          text = "Chaquopy 16.1 · Python 3.8 · Torch 1.8.1 · live Numogram probe"
                          textSize = 14f
                          gravity = Gravity.CENTER_HORIZONTAL
                          setPadding(0, dp(8), 0, dp(18))
                      }
                  )

                  statusView = TextView(this).apply {
                      text = "P3.6 tensor probe starting…"
                      textSize = 20f
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(8), dp(18), dp(8), dp(18))
                  }

                  detailView = TextView(this).apply {
                      text = "Waiting for Torch import and the sealed Numogram lifecycle."
                      textSize = 14f
                      setPadding(dp(8), dp(12), dp(8), dp(12))
                  }

                  root.addView(statusView)
                  root.addView(detailView)

                  root.addView(
                      TextView(this).apply {
                          text =
                              "\nP3.6 boundary:\n\n" +
                              "Kotlin\n" +
                              "  ↓\n" +
                              "NumogramBridge\n" +
                              "  ↓\n" +
                              "Python 3.8 · Numogram.py\n" +
                              "  ↓\n" +
                              "Torch 1.8.1 tensor field\n" +
                              "  ↓\n" +
                              "initialize → status → transition → status\n" +
                              "  ↓\n" +
                              "Kotlin\n\n" +
                              "Fixed probe: seed 3606 · dimension 3 · origin Z3 · context {}\n\n" +
                              "No language model. No network. Persistence disabled."
                          textSize = 14f
                      }
                  )

                  scroll.addView(root)
                  setContentView(scroll)
                  runProbe()
              }

              private fun runProbe() {
                  Thread {
                      val raw = try {
                          executeProbe()
                      } catch (t: Throwable) {
                          JSONObject()
                              .put("schema", "amelia-p3.6-probe-result-v1")
                              .put("status", "error")
                              .put("error_type", t::class.java.simpleName)
                              .put("message", t.message ?: "Unknown Android, Chaquopy, or Torch error")
                              .toString()
                      }

                      Log.i(LOG_TAG, raw)
                      runOnUiThread {
                          renderProbeResult(raw)
                      }
                  }.start()
              }

              private fun executeProbe(): String {
                  val bridge = NumogramBridge(applicationContext)
                  val runtime = JSONObject(bridge.runtimeInfo())
                  val before = JSONObject(bridge.status())
                  val initialized = JSONObject(bridge.initialize(PROBE_SEED, PROBE_DIMENSION))
                  val ready = JSONObject(bridge.status())
                  val transitioned = JSONObject(bridge.transition(PROBE_ORIGIN, "{}"))
                  val finalStatus = JSONObject(bridge.status())

                  return JSONObject()
                      .put("schema", "amelia-p3.6-probe-result-v1")
                      .put("status", "completed")
                      .put("runtime", runtime)
                      .put("before", before)
                      .put("initialized", initialized)
                      .put("ready", ready)
                      .put("transitioned", transitioned)
                      .put("final", finalStatus)
                      .toString()
              }

              private fun renderProbeResult(raw: String) {
                  try {
                      val result = JSONObject(raw)
                      val runtime = result.optJSONObject("runtime")
                          ?: throw IllegalStateException("Missing Torch runtime record")
                      val before = result.optJSONObject("before")
                          ?: throw IllegalStateException("Missing pre-initialization status")
                      val initialized = result.optJSONObject("initialized")
                          ?: throw IllegalStateException("Missing initialization result")
                      val ready = result.optJSONObject("ready")
                          ?: throw IllegalStateException("Missing ready status")
                      val transitioned = result.optJSONObject("transitioned")
                          ?: throw IllegalStateException("Missing transition result")
                      val finalStatus = result.optJSONObject("final")
                          ?: throw IllegalStateException("Missing final status")

                      val initializedSystem = initialized.optJSONObject("system")
                          ?: throw IllegalStateException("Missing initialized system")
                      val readySystem = ready.optJSONObject("system")
                          ?: throw IllegalStateException("Missing ready system")
                      val event = transitioned.optJSONObject("event")
                          ?: throw IllegalStateException("Missing transition event")
                      val finalSystem = finalStatus.optJSONObject("system")
                          ?: throw IllegalStateException("Missing final system")
                      val probabilities = event.optJSONArray("probabilities")
                          ?: throw IllegalStateException("Missing probability vector")

                      var probabilityMass = 0.0
                      var finiteProbabilities = true
                      for (index in 0 until probabilities.length()) {
                          val value = probabilities.optDouble(index, Double.NaN)
                          if (value.isNaN() || value.isInfinite()) {
                              finiteProbabilities = false
                          } else {
                              probabilityMass += value
                          }
                      }

                      val torchVersion = runtime.optString("torch_version", "")
                      val torchReady =
                          runtime.optString("status", "") == "torch_ready" &&
                              torchVersion.startsWith("1.8.1") &&
                              runtime.optInt("zone_count", -1) == 10 &&
                              !runtime.optBoolean("persistence_default", true)

                      val initializationHeld =
                          initialized.optString("status", "") == "initialized" &&
                              initializedSystem.optInt("seed", -1) == PROBE_SEED &&
                              initializedSystem.optInt("dimension", -1) == PROBE_DIMENSION &&
                              initializedSystem.optInt("evolution_step", -1) == 0 &&
                              initializedSystem.optInt("transition_history", -1) == 0 &&
                              !initializedSystem.optBoolean("persistence_enabled", true)

                      val readyHeld =
                          ready.optString("status", "") == "ready" &&
                              readySystem.optInt("evolution_step", -1) == 0 &&
                              readySystem.optInt("transition_history", -1) == 0

                      val transitionHeld =
                          transitioned.optString("status", "") == "transitioned" &&
                              event.optInt("step", -1) == 1 &&
                              event.optInt("from", -1) == PROBE_ORIGIN &&
                              event.optInt("to", -1) in 0 until 10 &&
                              !event.optBoolean("fallback", true) &&
                              probabilities.length() == 10 &&
                              finiteProbabilities &&
                              abs(probabilityMass - 1.0) <= 0.00001

                      val finalHeld =
                          finalStatus.optString("status", "") == "ready" &&
                              finalSystem.optInt("evolution_step", -1) == 1 &&
                              finalSystem.optInt("transition_history", -1) == 1 &&
                              !finalSystem.optBoolean("persistence_enabled", true)

                      val passed =
                          result.optString("status", "") == "completed" &&
                              torchReady &&
                              initializationHeld &&
                              readyHeld &&
                              transitionHeld &&
                              finalHeld

                      val transitionLine =
                          "Z" + event.optInt("from") + " → Z" + event.optInt("to")

                      if (passed) {
                          statusView.text = "P3.6 PASSED ✓"
                          detailView.text =
                              "Torch imported and the live tensor Numogram lifecycle completed.\n\n" +
                                  "Torch: " + torchVersion + "\n" +
                                  "Before initialization: " + before.optString("status") + "\n" +
                                  "Seed: " + initializedSystem.optInt("seed") + "\n" +
                                  "Dimension: " + initializedSystem.optInt("dimension") + "\n" +
                                  "Transition: " + transitionLine + "\n" +
                                  "Step: " + event.optInt("step") + "\n" +
                                  "Probability mass: " + probabilityMass + "\n" +
                                  "Fallback: " + event.optBoolean("fallback") + "\n" +
                                  "History: " + finalSystem.optInt("transition_history") + "\n" +
                                  "Persistence: " + finalSystem.optBoolean("persistence_enabled")
                      } else {
                          statusView.text = "P3.6 FAIL-CLOSED"
                          detailView.text =
                              "A Torch/Numogram response was received, but it did not satisfy " +
                                  "the sealed P3.6 contract.\n\n" +
                                  "Torch ready: " + torchReady + "\n" +
                                  "Initialization: " + initializationHeld + "\n" +
                                  "Ready state: " + readyHeld + "\n" +
                                  "Transition: " + transitionHeld + "\n" +
                                  "Final state: " + finalHeld + "\n\n" +
                                  "Raw response:\n" + raw
                      }
                  } catch (t: Throwable) {
                      statusView.text = "P3.6 FAIL-CLOSED"
                      detailView.text =
                          "The returned Torch/Numogram value was not valid P3.6 probe JSON.\n\n" +
                              "Error: " + (t.message ?: "Unknown parsing error") + "\n\n" +
                              "Raw response:\n" + raw
                  }
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }
          }
          EOF

      # Numogram.py is compiled and structurally audited on the Python 3.8
      # build host. Its Torch import is deliberately exercised only in the
      # Android build and on-device probe, using the Chaquopy Android wheel.
      - name: Validate P3.6 source and lifecycle contract
        shell: bash
        run: |
          set -euo pipefail

          python3.8 --version

          python3.8 -m py_compile \
            app/src/main/python/bridge_probe.py \
            app/src/main/python/Numogram.py

          python3.8 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("app/src/main/python/Numogram.py").read_text(encoding="utf-8"))
          functions = {
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required = {
              "get_runtime_info",
              "initialize_system",
              "get_status",
              "transition",
          }
          missing = required - functions
          assert not missing, f"Missing Numogram entry points: {sorted(missing)}"
          print("P3.6 Numogram entry-point contract validated")
          PY

          grep -Fq 'install("torch==1.8.1")' app/build.gradle.kts
          grep -Fq 'buildPython("python3.8")' app/build.gradle.kts
          grep -Fq 'getModule("Numogram")' app/src/main/java/com/amelia/bridge/NumogramBridge.kt
          grep -Fq 'runtimeInfo()' app/src/main/java/com/amelia/bridge/NumogramBridge.kt
          grep -Fq 'bridge.initialize' app/src/main/java/com/amelia/p36/MainActivity.kt
          grep -Fq 'bridge.status' app/src/main/java/com/amelia/p36/MainActivity.kt
          grep -Fq 'bridge.transition' app/src/main/java/com/amelia/p36/MainActivity.kt

          if grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "FAIL: P3.6 must not declare INTERNET permission."
            exit 1
          fi

          echo
          echo "P3.6 pre-build validation passed."
          echo "Torch requirement is exact: torch==1.8.1"
          echo "Runtime lifecycle is fixed: initialize -> status -> transition -> status."
          echo "No runtime INTERNET permission is present."

      # This build is the first point at which the Chaquopy resolver retrieves
      # the Android-native Torch wheel and packages it for both selected ABIs.
      - name: Build Android-P3.6 Torch Numogram APK
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Record P3.6 build manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt \
            > p36-source-sha256.txt

          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"

          cat > p36-build-manifest.txt <<EOF
          Amelia Android P3.6
          ===================

          Revision:
          $GITHUB_SHA

          Android Gradle Plugin:
          8.7.3

          Gradle:
          8.9

          Java:
          17

          Chaquopy:
          16.1.0

          Android Python:
          3.8

          Torch requirement:
          torch==1.8.1

          Numogram imported:
          YES — only through NumogramBridge in the P3.6 probe.

          Runtime lifecycle:
          get_runtime_info
          initialize(seed=3606, dimension=3)
          status
          transition(origin=Z3, context={})
          status

          Persistence:
          DISABLED

          Runtime INTERNET permission:
          NOT DECLARED

          ABIs:
          armeabi-v7a
          arm64-v8a

          APK SHA-256:
          $APK_SHA

          Acceptance condition:
          App displays "P3.6 PASSED ✓" only after Torch reports version
          1.8.1, the Numogram initializes with the sealed seed and dimension,
          and one non-fallback Z3 transition commits to history.
          EOF

          cat p36-build-manifest.txt
          cat p36-source-sha256.txt

      - name: Upload Android-P3.6 Torch Numogram APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.6-Torch-Numogram-Probe
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            p36-build-manifest.txt
            p36-source-sha256.txt
          retention-days: 14
