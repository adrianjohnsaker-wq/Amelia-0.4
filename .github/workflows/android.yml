name: Build Amelia Android-P3.6.1 Torch Numogram Probe APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # P3.6.1 stays on the same Chaquopy 16.1 / Python 3.8 lane P3.6
      # validated on-device. Nothing about the toolchain changes here --
      # only the Numogram facade's reinitialization behaviour, and the
      # probe UI's acceptance contract to match it.
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify P3.6.1 source files exist
        shell: bash
        run: |
          set -euo pipefail

          for source in bridge_probe.py Numogram.py NumogramBridge.kt ChaquopyProbe.kt; do
            if [[ ! -f "$source" ]]; then
              echo "::error file=$source::Required P3.6.1 source is absent from repository root."
              echo "Repository root contents:"
              find . -maxdepth 1 -type f -printf ' - %f\n' | sort
              exit 1
            fi
            echo "Present: $source ($(wc -c < "$source") bytes)"
          done

          echo
          echo "P3.6.1 source fingerprints:"
          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt

      - name: Create Android-P3.6.1 Torch Numogram probe project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/amelia/p361 \
            app/src/main/java/com/amelia/bridge \
            app/src/main/python \
            app/src/main/res/values

          # Preserve the four root sources as the build inputs. Only
          # Numogram.py's content changed for P3.6.1 (digest-matched
          # reattachment, exception-safe facade functions); NumogramBridge.kt,
          # ChaquopyProbe.kt, and bridge_probe.py are copied as-is.
          cp bridge_probe.py \
            app/src/main/python/bridge_probe.py

          cp Numogram.py \
            app/src/main/python/Numogram.py

          cp NumogramBridge.kt \
            app/src/main/java/com/amelia/bridge/NumogramBridge.kt

          cp ChaquopyProbe.kt \
            app/src/main/java/com/amelia/bridge/ChaquopyProbe.kt

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmeliaAndroidP361"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "16.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # Same single dependency as P3.6: torch==1.8.1. P3.6.1 changes
          # facade logic, not the dependency lane.
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.amelia.p361"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.amelia.p361"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.8.1-android-p3.6.1-torch-numogram-reattach"

                  ndk {
                      abiFilters += listOf(
                          "armeabi-v7a",
                          "arm64-v8a"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          chaquopy {
              defaultConfig {
                  version = "3.8"
                  buildPython("python3.8")

                  pip {
                      install("torch==1.8.1")
                  }
              }
          }
          EOF

          # Same as P3.6: local substrate assay only, no INTERNET permission.
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Amelia P3.6.1 Torch Numogram</string>
          </resources>
          EOF

          # P3.6.1's on-device experiment is the same fixed probe as P3.6:
          #
          # Kotlin -> NumogramBridge -> Numogram.py -> Torch
          #        -> initialize(seed=3606, dimension=3)   [fresh OR reattach]
          #        -> status
          #        -> transition(origin=Z3, context={})
          #        -> status -> Kotlin
          #
          # The difference is what counts as passing: a repeat launch that
          # reattaches to an already-running, digest-matched system is now a
          # valid pass, and the step/history checks compare against this
          # run's own baseline rather than hardcoded absolute values -- so
          # the screen stays correct on the second, third, or Nth launch,
          # not just a cold start.
          cat > app/src/main/java/com/amelia/p361/MainActivity.kt <<'ACTIVITY_EOF'
          package com.amelia.p361

          import android.app.Activity
          import android.os.Bundle
          import android.util.Log
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import com.amelia.bridge.NumogramBridge
          import kotlin.math.abs
          import org.json.JSONObject

          class MainActivity : Activity() {

              companion object {
                  private const val LOG_TAG = "AMELIA_P361"
                  private const val PROBE_SEED = 3606
                  private const val PROBE_DIMENSION = 3
                  private const val PROBE_ORIGIN = 3
              }

              private lateinit var statusView: TextView
              private lateinit var detailView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(24), dp(20), dp(24))
                  }

                  root.addView(
                      TextView(this).apply {
                          text = "AMELIA · P3.6.1"
                          textSize = 25f
                          gravity = Gravity.CENTER_HORIZONTAL
                      }
                  )

                  root.addView(
                      TextView(this).apply {
                          text = "Chaquopy 16.1 · Python 3.8 · Torch 1.8.1 · digest-matched reattachment"
                          textSize = 14f
                          gravity = Gravity.CENTER_HORIZONTAL
                          setPadding(0, dp(8), 0, dp(18))
                      }
                  )

                  statusView = TextView(this).apply {
                      text = "P3.6.1 tensor probe starting…"
                      textSize = 20f
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(8), dp(18), dp(8), dp(18))
                  }

                  detailView = TextView(this).apply {
                      text = "Waiting for Torch import and the sealed Numogram lifecycle."
                      textSize = 14f
                      setPadding(dp(8), dp(12), dp(8), dp(12))
                  }

                  root.addView(statusView)
                  root.addView(detailView)

                  root.addView(
                      TextView(this).apply {
                          text =
                              "\nP3.6.1 boundary:\n\n" +
                              "Kotlin\n" +
                              "  ↓\n" +
                              "NumogramBridge\n" +
                              "  ↓\n" +
                              "Python 3.8 · Numogram.py\n" +
                              "  ↓\n" +
                              "Torch 1.8.1 tensor field\n" +
                              "  ↓\n" +
                              "initialize (fresh OR digest-matched reattach) → status → transition → status\n" +
                              "  ↓\n" +
                              "Kotlin\n\n" +
                              "Fixed probe: seed 3606 · dimension 3 · origin Z3 · context {}\n\n" +
                              "No language model. No network. Persistence disabled.\n\n" +
                              "A repeat launch reattaches to the already-running system (same " +
                              "seed/dimension) rather than silently discarding its history, and " +
                              "this screen checks that exactly one transition happened this run " +
                              "-- not that the step count is 1 -- so it stays correct whether " +
                              "this is the first launch or the fifth."
                          textSize = 14f
                      }
                  )

                  scroll.addView(root)
                  setContentView(scroll)
                  runProbe()
              }

              private fun runProbe() {
                  Thread {
                      val raw = try {
                          executeProbe()
                      } catch (t: Throwable) {
                          JSONObject()
                              .put("schema", "amelia-p3.6.1-probe-result-v1")
                              .put("status", "error")
                              .put("error_type", t::class.java.simpleName)
                              .put("message", t.message ?: "Unknown Android, Chaquopy, or Torch error")
                              .toString()
                      }

                      Log.i(LOG_TAG, raw)
                      runOnUiThread {
                          renderProbeResult(raw)
                      }
                  }.start()
              }

              private fun executeProbe(): String {
                  val bridge = NumogramBridge(applicationContext)
                  val runtime = JSONObject(bridge.runtimeInfo())
                  val before = JSONObject(bridge.status())
                  val initialized = JSONObject(bridge.initialize(PROBE_SEED, PROBE_DIMENSION))
                  val ready = JSONObject(bridge.status())
                  val transitioned = JSONObject(bridge.transition(PROBE_ORIGIN, "{}"))
                  val finalStatus = JSONObject(bridge.status())

                  return JSONObject()
                      .put("schema", "amelia-p3.6.1-probe-result-v1")
                      .put("status", "completed")
                      .put("runtime", runtime)
                      .put("before", before)
                      .put("initialized", initialized)
                      .put("ready", ready)
                      .put("transitioned", transitioned)
                      .put("final", finalStatus)
                      .toString()
              }

              private fun renderProbeResult(raw: String) {
                  try {
                      val result = JSONObject(raw)
                      val runtime = result.optJSONObject("runtime")
                          ?: throw IllegalStateException("Missing Torch runtime record")
                      val before = result.optJSONObject("before")
                          ?: throw IllegalStateException("Missing pre-initialization status")
                      val initialized = result.optJSONObject("initialized")
                          ?: throw IllegalStateException("Missing initialization result")
                      val ready = result.optJSONObject("ready")
                          ?: throw IllegalStateException("Missing ready status")
                      val transitioned = result.optJSONObject("transitioned")
                          ?: throw IllegalStateException("Missing transition result")
                      val finalStatus = result.optJSONObject("final")
                          ?: throw IllegalStateException("Missing final status")

                      val initializedSystem = initialized.optJSONObject("system")
                          ?: throw IllegalStateException("Missing initialized system")
                      val readySystem = ready.optJSONObject("system")
                          ?: throw IllegalStateException("Missing ready system")
                      val event = transitioned.optJSONObject("event")
                          ?: throw IllegalStateException("Missing transition event")
                      val finalSystem = finalStatus.optJSONObject("system")
                          ?: throw IllegalStateException("Missing final system")
                      val probabilities = event.optJSONArray("probabilities")
                          ?: throw IllegalStateException("Missing probability vector")

                      var probabilityMass = 0.0
                      var finiteProbabilities = true
                      for (index in 0 until probabilities.length()) {
                          val value = probabilities.optDouble(index, Double.NaN)
                          if (value.isNaN() || value.isInfinite()) {
                              finiteProbabilities = false
                          } else {
                              probabilityMass += value
                          }
                      }

                      val torchVersion = runtime.optString("torch_version", "")
                      val torchReady =
                          runtime.optString("status", "") == "torch_ready" &&
                              torchVersion.startsWith("1.8.1") &&
                              runtime.optInt("zone_count", -1) == 10 &&
                              !runtime.optBoolean("persistence_default", true)

                      val initStatus = initialized.optString("status", "")
                      val digestMatchedReattachment =
                          initStatus == "already_initialized" &&
                              initialized.optBoolean("state_unchanged", false) &&
                              initialized.optString("init_digest", "").isNotBlank() &&
                              initialized.optString("init_digest", "") ==
                                  initialized.optString("attempted_init_digest", "")

                      val initializationHeld =
                          (initStatus == "initialized" || digestMatchedReattachment) &&
                              initializedSystem.optInt("seed", -1) == PROBE_SEED &&
                              initializedSystem.optInt("dimension", -1) == PROBE_DIMENSION &&
                              !initializedSystem.optBoolean("persistence_enabled", true)

                      val baselineStep = readySystem.optInt("evolution_step", -1)
                      val baselineHistory = readySystem.optInt("transition_history", -1)

                      val readyHeld =
                          ready.optString("status", "") == "ready" &&
                              baselineStep >= 0 &&
                              baselineHistory >= 0

                      val transitionHeld =
                          transitioned.optString("status", "") == "transitioned" &&
                              event.optInt("step", -1) == baselineStep + 1 &&
                              event.optInt("from", -1) == PROBE_ORIGIN &&
                              event.optInt("to", -1) in 0 until 10 &&
                              !event.optBoolean("fallback", true) &&
                              probabilities.length() == 10 &&
                              finiteProbabilities &&
                              abs(probabilityMass - 1.0) <= 0.00001

                      val finalHeld =
                          finalStatus.optString("status", "") == "ready" &&
                              finalSystem.optInt("evolution_step", -1) == baselineStep + 1 &&
                              finalSystem.optInt("transition_history", -1) == baselineHistory + 1 &&
                              !finalSystem.optBoolean("persistence_enabled", true)

                      val passed =
                          result.optString("status", "") == "completed" &&
                              torchReady &&
                              initializationHeld &&
                              readyHeld &&
                              transitionHeld &&
                              finalHeld

                      val transitionLine =
                          "Z" + event.optInt("from") + " → Z" + event.optInt("to")
                      val initKind = if (initStatus == "already_initialized") {
                          "reattached to existing system (digest-matched)"
                      } else {
                          "fresh initialization"
                      }

                      if (passed) {
                          statusView.text = "P3.6.1 PASSED ✓"
                          detailView.text =
                              "Torch imported and the live tensor Numogram lifecycle completed.\n\n" +
                                  "Torch: " + torchVersion + "\n" +
                                  "Before initialization: " + before.optString("status") + "\n" +
                                  "Initialization: " + initKind + "\n" +
                                  "Seed: " + initializedSystem.optInt("seed") + "\n" +
                                  "Dimension: " + initializedSystem.optInt("dimension") + "\n" +
                                  "Step baseline going in: " + baselineStep + "\n" +
                                  "Transition: " + transitionLine + "\n" +
                                  "Step after: " + event.optInt("step") + "\n" +
                                  "Probability mass: " + probabilityMass + "\n" +
                                  "Fallback: " + event.optBoolean("fallback") + "\n" +
                                  "History: " + finalSystem.optInt("transition_history") + "\n" +
                                  "Persistence: " + finalSystem.optBoolean("persistence_enabled")
                      } else {
                          statusView.text = "P3.6.1 FAIL-CLOSED"
                          detailView.text =
                              "A Torch/Numogram response was received, but it did not satisfy " +
                                  "the sealed P3.6.1 contract.\n\n" +
                                  "Torch ready: " + torchReady + "\n" +
                                  "Initialization: " + initializationHeld + " (" + initStatus + ")\n" +
                                  "Ready state: " + readyHeld + "\n" +
                                  "Transition: " + transitionHeld + "\n" +
                                  "Final state: " + finalHeld + "\n\n" +
                                  "Raw response:\n" + raw
                      }
                  } catch (t: Throwable) {
                      statusView.text = "P3.6.1 FAIL-CLOSED"
                      detailView.text =
                          "The returned Torch/Numogram value was not valid P3.6.1 probe JSON.\n\n" +
                              "Error: " + (t.message ?: "Unknown parsing error") + "\n\n" +
                              "Raw response:\n" + raw
                  }
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }
          }
          ACTIVITY_EOF

      # Numogram.py is compiled and structurally audited on the Python 3.8
      # build host, same as P3.6. P3.6.1 adds checks for the digest-matched
      # reattachment logic specifically, so a regression back to the old
      # unconditional-overwrite behaviour would fail the build rather than
      # only being caught on-device.
      - name: Validate P3.6.1 source and lifecycle contract
        shell: bash
        run: |
          set -euo pipefail

          python3.8 --version

          python3.8 -m py_compile \
            app/src/main/python/bridge_probe.py \
            app/src/main/python/Numogram.py

          python3.8 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("app/src/main/python/Numogram.py").read_text(encoding="utf-8"))
          functions = {
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required = {
              "get_runtime_info",
              "initialize_system",
              "get_status",
              "transition",
              "_config_digest",
          }
          missing = required - functions
          assert not missing, f"Missing Numogram entry points: {sorted(missing)}"
          print("P3.6.1 Numogram entry-point contract validated")
          PY

          grep -Fq 'install("torch==1.8.1")' app/build.gradle.kts
          grep -Fq 'buildPython("python3.8")' app/build.gradle.kts
          grep -Fq 'getModule("Numogram")' app/src/main/java/com/amelia/bridge/NumogramBridge.kt

          # P3.6.1-specific: the reattachment fix must actually be present,
          # not just the four original entry points.
          grep -Fq 'already_initialized' app/src/main/python/Numogram.py
          grep -Fq '_config_digest' app/src/main/python/Numogram.py
          grep -Fq 'attempted_init_digest' app/src/main/python/Numogram.py

          grep -Fq 'bridge.initialize' app/src/main/java/com/amelia/p361/MainActivity.kt
          grep -Fq 'bridge.status' app/src/main/java/com/amelia/p361/MainActivity.kt
          grep -Fq 'bridge.transition' app/src/main/java/com/amelia/p361/MainActivity.kt
          grep -Fq 'digestMatchedReattachment' app/src/main/java/com/amelia/p361/MainActivity.kt
          grep -Fq 'baselineStep' app/src/main/java/com/amelia/p361/MainActivity.kt

          if grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "FAIL: P3.6.1 must not declare INTERNET permission."
            exit 1
          fi

          echo
          echo "P3.6.1 pre-build validation passed."
          echo "Torch requirement is exact: torch==1.8.1"
          echo "Reinitialization is digest-matched, not unconditional overwrite."
          echo "Acceptance contract checks step/history deltas, not hardcoded absolutes."
          echo "No runtime INTERNET permission is present."

      - name: Build Android-P3.6.1 Torch Numogram APK
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Record P3.6.1 build manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          sha256sum \
            bridge_probe.py \
            Numogram.py \
            NumogramBridge.kt \
            ChaquopyProbe.kt \
            > p361-source-sha256.txt

          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"

          cat > p361-build-manifest.txt <<EOF
          Amelia Android P3.6.1
          ======================

          Revision:
          $GITHUB_SHA

          Android Gradle Plugin:
          8.7.3

          Gradle:
          8.9

          Java:
          17

          Chaquopy:
          16.1.0

          Android Python:
          3.8

          Torch requirement:
          torch==1.8.1

          Changed from P3.6:
          Numogram.py -- initialize_system() now checks a canonical digest of
          (seed, dimension) before reattaching to an already-running system,
          instead of unconditionally overwriting it. initialize_system() and
          transition() now catch their own exceptions and return a structured
          error string instead of raising across the Chaquopy boundary.
          MainActivity.kt -- acceptance contract now accepts a digest-matched
          reattachment as a pass, and checks the evolution_step/history delta
          produced by this run rather than hardcoded absolute values, so a
          second or later launch is judged correctly rather than failing
          closed on stale-looking state.

          Runtime lifecycle:
          get_runtime_info
          initialize_system(seed=3606, dimension=3)  [fresh OR reattach]
          status
          transition(origin=Z3, context={})
          status

          Persistence:
          DISABLED

          Runtime INTERNET permission:
          NOT DECLARED

          ABIs:
          armeabi-v7a
          arm64-v8a

          Application ID:
          com.amelia.p361 (separate from com.amelia.p36; P3.6 install is preserved)

          APK SHA-256:
          $APK_SHA

          Acceptance condition:
          App displays "P3.6.1 PASSED ✓" when Torch reports version 1.8.1, the
          Numogram either freshly initializes or digest-matched-reattaches with
          the sealed seed and dimension, and exactly one non-fallback Z3
          transition commits relative to this run's own baseline step/history.
          EOF

          cat p361-build-manifest.txt
          cat p361-source-sha256.txt

      - name: Upload Android-P3.6.1 Torch Numogram APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.6.1-Torch-Numogram-Reattach
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            p361-build-manifest.txt
            p361-source-sha256.txt
          retention-days: 14
