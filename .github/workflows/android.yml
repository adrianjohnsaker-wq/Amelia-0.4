name: Build Amelia Android-P3.13 Renderer Faithfulness Side-by-Side APK

on:
  push:
    branches: ["main"]
    paths:
      - "P313MainActivity.kt"
      - "P313RendererFaithfulness.kt"
      - "P312AssayCore.py"
      - "P312AssayBridge.kt"
      - "P312PromptBuilder.kt"
      - "ProcessFieldMemory.py"
      - "Numogram.py"
      - "RenderTransport.kt"
      - ".github/workflows/p313.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify P3.13 source files exist
        shell: bash
        run: |
          set -euo pipefail

          for source in \
            Numogram.py \
            RenderTransport.kt \
            ProcessFieldMemory.py \
            P312AssayCore.py \
            P312AssayBridge.kt \
            P312PromptBuilder.kt \
            P313RendererFaithfulness.kt \
            P313MainActivity.kt
          do
            if [[ ! -f "$source" ]]; then
              echo "::error file=$source::Required P3.13 source is absent from repository root."
              find . -maxdepth 1 -type f -printf ' - %f\n' | sort
              exit 1
            fi
            echo "Present: $source ($(wc -c < "$source") bytes)"
          done

          echo
          echo "P3.13 source fingerprints:"
          sha256sum \
            Numogram.py \
            RenderTransport.kt \
            ProcessFieldMemory.py \
            P312AssayCore.py \
            P312AssayBridge.kt \
            P312PromptBuilder.kt \
            P313RendererFaithfulness.kt \
            P313MainActivity.kt

      - name: Seal P3.13 credential attestation
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          P313_KEY="${ANTHROPIC_API_KEY:-}"

          if [[ -z "$P313_KEY" ]]; then
            {
              echo "P313_CREDENTIAL_FINGERPRINT=missing"
              echo "P313_CREDENTIAL_SHAPE=missing"
            } >> "$GITHUB_ENV"
          else
            P313_FINGERPRINT="$(
              printf '%s' "$P313_KEY" | sha256sum | awk '{print $1}'
            )"

            if [[ "$P313_KEY" == sk-ant-* ]] && \
               [[ ! "$P313_KEY" =~ [[:space:]] ]]; then
              P313_SHAPE=canonical
            else
              P313_SHAPE=noncanonical
            fi

            {
              echo "P313_CREDENTIAL_FINGERPRINT=$P313_FINGERPRINT"
              echo "P313_CREDENTIAL_SHAPE=$P313_SHAPE"
            } >> "$GITHUB_ENV"

            echo "P3.13 credential sealed: shape=$P313_SHAPE; sha256-prefix=${P313_FINGERPRINT:0:16}."
          fi

      - name: Validate frozen P3.12 Python causal contracts
        shell: bash
        run: |
          set -euo pipefail

          python3.8 --version
          python3.8 -m py_compile \
            Numogram.py \
            ProcessFieldMemory.py \
            P312AssayCore.py

          python3.8 - <<'PY'
          import ast
          import re
          from pathlib import Path

          core = Path("P312AssayCore.py").read_text(encoding="utf-8")
          pfm = Path("ProcessFieldMemory.py").read_text(encoding="utf-8")

          core_tree = ast.parse(core)
          core_functions = {
              n.name
              for n in core_tree.body
              if isinstance(n, ast.FunctionDef)
          }

          required = {
              "run_assay",
              "get_branch_status",
          }
          missing = required - core_functions
          assert not missing, sorted(missing)

          pfm_tree = ast.parse(pfm)
          pfm_functions = {
              n.name
              for n in pfm_tree.body
              if isinstance(n, ast.FunctionDef)
          }
          assert "amelia_event" in pfm_functions

          assert '"B_RETAINED"' in core
          assert '"C_RESET"' in core
          assert "_reload_pfm()" in core
          assert "causal_memory_contrast_held" in core

          forbidden = [
              r"\bsubprocess\b",
              r"\bos\.system\b",
              r"\bsocket\b",
              r"\brequests\b",
              r"\bopen\s*\(",
              r"\bpathlib\b",
              r"\bctypes\b",
              r"\bchaquopy\b",
          ]
          hits = [
              pattern
              for pattern in forbidden
              if re.search(pattern, pfm, re.I)
          ]
          assert not hits, hits

          print("Frozen P3.12 Python source contracts validated")
          PY

      - name: Create isolated Android-P3.13 project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/amelia/p313 \
            app/src/main/java/com/amelia/assay \
            app/src/main/java/com/amelia/renderer \
            app/src/main/python \
            app/src/main/res/values

          cp Numogram.py \
            app/src/main/python/Numogram.py
          cp ProcessFieldMemory.py \
            app/src/main/python/ProcessFieldMemory.py
          cp P312AssayCore.py \
            app/src/main/python/P312AssayCore.py

          cp P312AssayBridge.kt \
            app/src/main/java/com/amelia/assay/P312AssayBridge.kt
          cp P312PromptBuilder.kt \
            app/src/main/java/com/amelia/renderer/P312PromptBuilder.kt
          cp P313RendererFaithfulness.kt \
            app/src/main/java/com/amelia/renderer/P313RendererFaithfulness.kt
          cp RenderTransport.kt \
            app/src/main/java/com/amelia/renderer/RenderTransport.kt
          cp P313MainActivity.kt \
            app/src/main/java/com/amelia/p313/MainActivity.kt

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmeliaAndroidP313"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "16.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          fun javaString(value: String): String = buildString {
              append('"')
              value.forEach { c ->
                  when (c) {
                      '\\' -> append("\\\\")
                      '"' -> append("\\\"")
                      '\n' -> append("\\n")
                      '\r' -> append("\\r")
                      '\t' -> append("\\t")
                      else -> append(c)
                  }
              }
              append('"')
          }

          val apiKey =
              System.getenv("ANTHROPIC_API_KEY") ?: ""
          val credentialFingerprint =
              System.getenv("P313_CREDENTIAL_FINGERPRINT") ?: "missing"
          val credentialShape =
              System.getenv("P313_CREDENTIAL_SHAPE") ?: "missing"
          val revision =
              (System.getenv("GITHUB_SHA") ?: "local").take(12)

          android {
              namespace = "com.amelia.p313"
              compileSdk = 34

              defaultConfig {
                  // CRITICAL: distinct from frozen P3.12 com.amelia.p312.
                  applicationId = "com.amelia.p313"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 13
                  versionName = "0.15-android-p3.13-renderer-faithfulness-side-by-side"

                  ndk {
                      abiFilters += listOf(
                          "armeabi-v7a",
                          "arm64-v8a"
                      )
                  }

                  buildConfigField(
                      "String",
                      "ANTHROPIC_API_KEY",
                      javaString(apiKey)
                  )
                  buildConfigField(
                      "String",
                      "CREDENTIAL_FINGERPRINT",
                      javaString(credentialFingerprint)
                  )
                  buildConfigField(
                      "String",
                      "CREDENTIAL_SHAPE",
                      javaString(credentialShape)
                  )
                  buildConfigField(
                      "String",
                      "BUILD_REVISION",
                      javaString(revision)
                  )
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          chaquopy {
              defaultConfig {
                  version = "3.8"
                  buildPython("python3.8")

                  pip {
                      install("torch==1.8.1")
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Amelia P3.13</string>
          </resources>
          EOF

      - name: Validate P3.13 side-by-side and faithfulness contracts
        shell: bash
        run: |
          set -euo pipefail

          # P3.12 causal substrate remains the source of the primary endpoint.
          grep -Fq 'A_ABSENT' \
            app/src/main/python/P312AssayCore.py
          grep -Fq 'B_RETAINED' \
            app/src/main/python/P312AssayCore.py
          grep -Fq 'C_RESET' \
            app/src/main/python/P312AssayCore.py
          grep -Fq 'causal_memory_contrast_held' \
            app/src/main/python/P312AssayCore.py

          # P3.13 package MUST remain separate from P3.12.
          grep -Fq 'namespace = "com.amelia.p313"' \
            app/build.gradle.kts
          grep -Fq 'applicationId = "com.amelia.p313"' \
            app/build.gradle.kts

          if grep -Fq 'applicationId = "com.amelia.p312"' \
            app/build.gradle.kts
          then
            echo "FAIL: P3.13 would collide with frozen P3.12."
            exit 1
          fi

          # Pre-render seal must occur before transport execution in source.
          PRE_LINE="$(
            grep -n 'archivePreRender' \
              app/src/main/java/com/amelia/p313/MainActivity.kt \
              | head -1 | cut -d: -f1
          )"
          SEND_LINE="$(
            grep -n 'RenderTransport.execute' \
              app/src/main/java/com/amelia/p313/MainActivity.kt \
              | head -1 | cut -d: -f1
          )"
          POST_LINE="$(
            grep -n 'auditAndArchive' \
              app/src/main/java/com/amelia/p313/MainActivity.kt \
              | head -1 | cut -d: -f1
          )"

          test -n "$PRE_LINE"
          test -n "$SEND_LINE"
          test -n "$POST_LINE"
          test "$PRE_LINE" -lt "$SEND_LINE"
          test "$SEND_LINE" -lt "$POST_LINE"

          grep -Fq 'positiveControl()' \
            app/src/main/java/com/amelia/p313/MainActivity.kt
          grep -Fq 'verifyArchiveChain' \
            app/src/main/java/com/amelia/p313/MainActivity.kt
          grep -Fq 'CONTRADICTION' \
            app/src/main/java/com/amelia/renderer/P313RendererFaithfulness.kt
          grep -Fq 'POST_RENDER_AUDIT' \
            app/src/main/java/com/amelia/renderer/P313RendererFaithfulness.kt
          grep -Fq 'PRE_RENDER' \
            app/src/main/java/com/amelia/renderer/P313RendererFaithfulness.kt

          # Preserve provider-default sealed transport policy.
          if rg -n 'put\("temperature"|put\("top_p"|put\("top_k"' \
            app/src/main/java/com/amelia/renderer/RenderTransport.kt
          then
            echo "FAIL: P3.13 must retain sealed provider-default transport."
            exit 1
          fi

          echo
          echo "P3.13 pre-build contract validation passed."
          echo "Side-by-side package: com.amelia.p313"
          echo "Frozen package retained: com.amelia.p312"
          echo "Ordering: PRE_RENDER seal -> provider -> POST_RENDER audit"
          echo "Positive control and hash-chain verification are required."

      - name: Build Android-P3.13 side-by-side APK
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Record P3.13 build manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          cp "$APK" Amelia-P3.13-Side-by-Side.apk

          sha256sum \
            Numogram.py \
            RenderTransport.kt \
            ProcessFieldMemory.py \
            P312AssayCore.py \
            P312AssayBridge.kt \
            P312PromptBuilder.kt \
            P313RendererFaithfulness.kt \
            P313MainActivity.kt \
            > p313-source-sha256.txt

          APK_SHA="$(sha256sum Amelia-P3.13-Side-by-Side.apk | awk '{print $1}')"
          PFM_SHA="$(sha256sum ProcessFieldMemory.py | awk '{print $1}')"

          cat > p313-build-manifest.txt <<EOF
          Amelia Android P3.13
          ====================

          Revision:
          ${GITHUB_SHA}

          Purpose:
          Renderer-faithfulness validation layered downstream of the frozen
          P3.12 matched causal incorporation assay.

          Installation isolation:
          P3.12 application ID: com.amelia.p312
          P3.13 application ID: com.amelia.p313

          The two APKs are intentionally installable side by side.

          P3.13 sequence:
          frozen P3.12 primary endpoint
          -> exact Event-2 relay payload PRE_RENDER archive
          -> one sealed provider call
          -> returned prose POST_RENDER archive
          -> deterministic closed-set contradiction audit
          -> deliberate-false-text positive control
          -> SHA-256 archive-chain verification
          -> existing post-render Numogram-isolation check

          Seed:
          3606

          ProcessFieldMemory SHA-256:
          ${PFM_SHA}

          APK SHA-256:
          ${APK_SHA}
          EOF

          cat p313-build-manifest.txt
          cat p313-source-sha256.txt

      - name: Upload Android-P3.13 side-by-side APK
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.13-Renderer-Faithfulness-Side-by-Side
          path: |
            Amelia-P3.13-Side-by-Side.apk
            p313-build-manifest.txt
            p313-source-sha256.txt
          retention-days: 14
