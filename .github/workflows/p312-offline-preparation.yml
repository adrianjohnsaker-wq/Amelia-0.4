name: Amelia 0.4 matched Numogram pre-render preparation

on:
  push:
    branches:
      - research/p312-offline-20261127

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Verify frozen 0.4 source and test cases
        run: python experiments/communication_20261127/run.py --selftest
      - name: Install P3.13-era CPU tensor dependency
        run: python -m pip install 'numpy==1.24.4' 'torch==1.8.1+cpu' -f https://download.pytorch.org/whl/torch_stable.html
      - name: Prepare the matched pre-render payloads without provider calls
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -u experiments/communication_20261127/prepare_offline.py
      - name: Preserve prepared 0.4 payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-0.4-P312-pre-render-${{ github.run_id }}
          path: experiments/communication_20261127/offline_output/
          if-no-files-found: warn
