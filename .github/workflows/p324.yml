name: P3.24 Histogram-Balanced Order Transduction

on:
  push:
    branches: ["p324-histogram-balanced-transduction-20261031"]
    paths:
      - "FullNumogram.py"
      - "experiments/p316/DynamicNumogram.py"
      - "experiments/p317/run.py"
      - "experiments/p324/**"
      - ".github/workflows/p324.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p324-histogram-balanced-order
  cancel-in-progress: false

jobs:
  acquire-and-assay:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p324-histogram-balanced-transduction-20261031
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight sealed registration and code
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum FullNumogram.py | cut -d' ' -f1)" = "b6edbe76ab4929e93c01059fb56cef900effa9bca1cec78d0039eafb8fbebdf8"
          test "$(sha256sum experiments/p316/DynamicNumogram.py | cut -d' ' -f1)" = "ac482882858c1e47f578523452eff0bc20aa82b5978299c9c8808ff6127c5cd6"
          REG_SHA="$(cat experiments/p324/SEALED_REGISTRATION_SHA.txt)"
          test "$REG_SHA" = "980e12933a8de67e351a3838fb4ad4e7195acab4"
          REG_UNIX="$(git show -s --format=%ct "$REG_SHA")"
          AMEND_UNIX="$(git log -1 --format=%ct -- experiments/p324/AMENDMENT_1.md)"
          test "$AMEND_UNIX" -lt "$((REG_UNIX+90))"
          node --check experiments/p324/acquire.mjs
          python -m py_compile experiments/p324/run.py
          python - <<'PY'
          import sys
          sys.path.insert(0,"experiments/p324")
          import run
          expected=sorted([z for z in range(10) for _ in range(3)])
          synthetic=list(range(10))*3
          assert sorted(synthetic)==expected and len(synthetic)==30
          assert run.relation_profile([4]*17)==[0.0]*12
          p=run.DynamicNumogramProcess(current_zone=4)
          prof,path=run.encounter(p,synthetic)
          assert len(prof)==12 and len(path)==17
          for i in range(run.REWIRES):
              g=run.p317.rewired_gates(999324+i)
              assert run.p317.degree_signature(g)==run.p317.degree_signature(run.p317.FULL_NUMOGRAM_GATES)
              assert run.p317.self_loop_count(g)==run.p317.self_loop_count(run.p317.FULL_NUMOGRAM_GATES)
          print("P3.24 preflight PASS")
          PY

      - name: Install pinned drand verification client
        run: npm install --no-save --package-lock=false drand-client@1.4.2

      - name: Record pre-reveal provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiments/p324/results
          sha256sum FullNumogram.py experiments/p316/DynamicNumogram.py experiments/p317/run.py experiments/p324/REGISTRATION.md experiments/p324/AMENDMENT_1.md experiments/p324/SEALED_REGISTRATION_SHA.txt experiments/p324/acquire.mjs experiments/p324/run.py > experiments/p324/results/PRE_RUN_SHA256SUMS.txt
          {
            echo "registration_commit=$(cat experiments/p324/SEALED_REGISTRATION_SHA.txt)"
            echo "registration_commit_unix=$(git show -s --format=%ct $(cat experiments/p324/SEALED_REGISTRATION_SHA.txt))"
            echo "workflow_head=$GITHUB_SHA"
            echo "node=$(node --version)"
            echo "python=$(python --version 2>&1)"
            echo "drand_client=1.4.2"
          } > experiments/p324/results/PRE_REVEAL_PROVENANCE.txt

      - name: Acquire prospectively fixed verified drand rounds
        shell: bash
        run: |
          set -euo pipefail
          export SEAL_UNIX="$(git show -s --format=%ct $(cat experiments/p324/SEALED_REGISTRATION_SHA.txt))"
          node experiments/p324/acquire.mjs | tee experiments/p324/results/acquisition-summary.json

      - name: Run first registered P3.24 assay
        shell: bash
        run: |
          set -euo pipefail
          python experiments/p324/run.py --out experiments/p324/results | tee experiments/p324/results/console-summary.json

      - name: Display report
        run: |
          cat experiments/p324/results/REPORT.md
          sed -n '1,260p' experiments/p324/results/ATLAS.md

      - name: Commit compact first result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             experiments/p324/results/BEACON.json             experiments/p324/results/REPORT.md             experiments/p324/results/ATLAS.md             experiments/p324/results/summary.json             experiments/p324/results/PRE_RUN_SHA256SUMS.txt             experiments/p324/results/PRE_REVEAL_PROVENANCE.txt             experiments/p324/results/acquisition-summary.json             experiments/p324/results/console-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "P3.24: archive first histogram-balanced order result [skip ci]"
            git push origin HEAD:p324-histogram-balanced-transduction-20261031
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: P3.24-histogram-balanced-order-evidence
          path: experiments/p324/results/
          retention-days: 90
