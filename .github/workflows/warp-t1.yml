name: WARP-T1 Entry Passage Transformation

on:
  push:
    branches: ["warp-transformation-20261030"]
    paths:
      - "FullNumogram.py"
      - "experiments/p316/DynamicNumogram.py"
      - "experiments/p317/run.py"
      - "experiments/warp_t1/**"
      - ".github/workflows/warp-t1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warp-t1
  cancel-in-progress: false

jobs:
  assay:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: warp-transformation-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight
        run: |
          set -euo pipefail
          test "$(sha256sum FullNumogram.py | cut -d' ' -f1)" = "b6edbe76ab4929e93c01059fb56cef900effa9bca1cec78d0039eafb8fbebdf8"
          test "$(sha256sum experiments/p316/DynamicNumogram.py | cut -d' ' -f1)" = "ac482882858c1e47f578523452eff0bc20aa82b5978299c9c8808ff6127c5cd6"
          python -m py_compile experiments/warp_t1/run.py
          python - <<'PY'
          import sys,copy
          sys.path.insert(0,"experiments/warp_t1")
          import run
          from DynamicNumogram import DynamicNumogramProcess
          p=DynamicNumogramProcess(current_zone=2)
          before=run.metrics(p)
          # non-registered synthetic step only
          out=run.forced_step(p,3,target=3,mode="normal")
          assert out["source"]==2 and out["target"]==3 and p.current_zone==3
          q=DynamicNumogramProcess(current_zone=2)
          run.forced_step(q,3,target=3,mode="inscription_only")
          assert q.current_zone==2
          run.open_warp_after_entry(p)
          assert any(int(g["source"])==3 and int(g["target"])==1 for g in p.gates)
          print("WARP-T1 preflight PASS")
          PY
      - name: Record provenance
        run: |
          mkdir -p experiments/warp_t1/results
          sha256sum FullNumogram.py experiments/p316/DynamicNumogram.py experiments/p317/run.py experiments/warp_t1/REGISTRATION.md experiments/warp_t1/AMENDMENT_1.md experiments/warp_t1/run.py > experiments/warp_t1/results/PRE_RUN_SHA256SUMS.txt
      - name: Run first registered assay
        run: python experiments/warp_t1/run.py --out experiments/warp_t1/results | tee experiments/warp_t1/results/console-summary.json
      - name: Display report
        run: cat experiments/warp_t1/results/REPORT.md
      - name: Commit compact result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/warp_t1/results/REPORT.md experiments/warp_t1/results/summary.json experiments/warp_t1/results/PRE_RUN_SHA256SUMS.txt experiments/warp_t1/results/console-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "WARP-T1: archive first entry-transformation result [skip ci]"
            git push origin HEAD:warp-transformation-20261030
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WARP-T1-entry-passage-evidence
          path: experiments/warp_t1/results/
          retention-days: 90
