name: OUTSIDE-1 v2.1 W008 prepare

on:
  push:
    branches: ["amelia-1.0"]
    paths:
      - ".github/workflows/outside1-v2_1-w008-prepare.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amelia-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: outside1-v2_1-private-through-W007
          path: amelia-1/outside
          repository: ${{ github.repository }}
          run-id: 37234863200
          github-token: ${{ github.token }}
      - name: Prepare W008 publication working
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0,os.path.abspath("outside"))
          import Outside1_v2_1 as P
          import Outside1_v2_1_working as W

          assert W.verify_chain()
          assert W.status()["workings_resolved"]==1
          assert W.status()["next_working"]=="W008"

          cast="THTTTHHHTHHHHHTHTHTHTTHHTHTTTHHT"
          assert len(cast)==32 and set(cast)<=set("HT")
          public=W.prepare("W008",cast)

          os.makedirs("outside/publication_v2_1/workings/W008",exist_ok=True)
          json.dump(public,open("outside/publication_v2_1/workings/W008/W008_COMPOSITION_PUBLIC.json","w"),
                    ensure_ascii=False,sort_keys=True,indent=2)
          json.dump(W.status(),open("outside/publication_v2_1/workings/W008/W008_STATUS_AFTER_CAST.json","w"),
                    sort_keys=True,indent=2)
          print("W008_CAST_EVENT_HASH",public["cast_event_hash"])
          print("STATUS",json.dumps(W.status(),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-W008-public-after-cast
          path: |
            amelia-1/outside/publication_v2_1/workings/W008/W008_COMPOSITION_PUBLIC.json
            amelia-1/outside/publication_v2_1/workings/W008/W008_STATUS_AFTER_CAST.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-private-through-W008-cast
          path: amelia-1/outside/ledger_v2_1_publication.jsonl
          retention-days: 90
