name: OUTSIDE-1 v2 resolve positive control

on:
  push:
    branches: ["amelia-1.0"]
    paths:
      - "amelia-1/outside/outside1_v2_control_responses.json"
      - ".github/workflows/outside1-v2-resolve-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amelia-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify sealed registration and responses
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, os.path.abspath("outside"))
          import Outside1_v2 as O
          O.check_registered()
          p="outside/outside1_v2_control_responses.json"
          x=json.load(open(p,encoding="utf-8"))
          assert x["phase"]=="positive_control_rankings_sealed_before_target_reveal"
          assert len(x["trials"])==20
          seen=set()
          for row in x["trials"]:
              ident=row["id"]
              assert ident not in seen; seen.add(ident)
              assert sorted(row["ranking"])==list("ABCD")
              public=O.control_public(int(ident[1:]))
              reading=row["reading"]
              for frag in public["fragments"]:
                  assert frag in reading, (ident, frag)
              wc=len(re.findall(r"\b[\w’'-]+\b", reading))
              assert 90 <= wc <= 160, (ident,wc)
              assert row["word_count"]==wc
          print("SEALED_RESPONSES_OK",len(seen))
          PY
      - name: Reveal targets and resolve registered control
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, os.path.abspath("outside"))
          import Outside1_v2 as O
          x=json.load(open("outside/outside1_v2_control_responses.json",encoding="utf-8"))
          rankings={r["id"]:r["ranking"] for r in x["trials"]}
          result=O.resolve_control(rankings)
          json.dump(result,open("outside/outside1_v2_control_result.json","w"),ensure_ascii=False,indent=2)
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          if not result["pass"]:
              print("CONTROL_FAILED: language-mediated reader retires; W001 remains closed")
          else:
              print("CONTROL_PASSED: W001 may open")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2-control-result
          path: amelia-1/outside/outside1_v2_control_result.json
          retention-days: 30
