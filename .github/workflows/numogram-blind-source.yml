name: Amelia 0.4 blinded Numogram source pilot

on:
  push:
    branches:
      - research/numogram-blind-20261127-r1

permissions:
  contents: read

jobs:
  source-to-numogram:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Verify source identity and isolation fixtures
        run: |
          python experiments/numogram_blind_20261127/run.py --selftest
          python experiments/numogram_blind_20261127/mock_check.py
      - name: Install the same CPU tensor dependencies used by the earlier 0.4 assay
        run: python -m pip install 'numpy==1.24.4' 'torch==1.8.1+cpu' -f https://download.pytorch.org/whl/torch_stable.html
      - name: Run the known-source Numogram interaction without provider calls
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -u experiments/numogram_blind_20261127/run.py
      - name: Preserve source, blinded decisions, audit and relay-ready prompts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-0.4-blind-Numogram-${{ github.run_id }}
          path: experiments/numogram_blind_20261127/output/
          if-no-files-found: warn
          retention-days: 14
