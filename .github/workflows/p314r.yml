name: Build Amelia Android-P3.14R 666 Replication APK

on:
  push:
    branches: ["main"]
    paths:
      - "Numogram.py"
      - "P314RExperiment.py"
      - "P314RExperimentBridge.kt"
      - "P314RMainActivity.kt"
      - "P314R_666_Replication_Protocol.md"
      - ".github/workflows/p314r.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify P3.14R source files
        shell: bash
        run: |
          set -euo pipefail

          for source in \
            Numogram.py \
            P314RExperiment.py \
            P314RExperimentBridge.kt \
            P314RMainActivity.kt \
            P314R_666_Replication_Protocol.md
          do
            test -f "$source" || {
              echo "::error file=$source::Required P3.14R source is absent from repository root."
              exit 1
            }
            echo "Present: $source ($(wc -c < "$source") bytes)"
          done

          python3.8 -m py_compile Numogram.py P314RExperiment.py

      - name: Validate locked replication contract
        shell: bash
        run: |
          set -euo pipefail

          python3.8 - <<'PY'
          import ast
          from pathlib import Path

          source = Path("P314RExperiment.py").read_text(encoding="utf-8")
          tree = ast.parse(source)

          functions = {
              node.name
              for node in tree.body
              if isinstance(node, ast.FunctionDef)
          }
          required = {
              "protocol_manifest",
              "checkpoint_status",
              "run_next",
              "digital_root",
          }
          missing = required - functions
          assert not missing, sorted(missing)

          exact_strings = [
              "TARGET_CODE = 666",
              "tuple(range(3001, 3041))",
              "tuple(range(3001, 3021))",
              "tuple(range(3021, 3041))",
              "PULSE_AMPLITUDE = 0.20",
              "BURN_IN_STEPS = 32",
              "PULSE_STEPS = 24",
              "WASHOUT_STEPS = 32",
              "OBSERVATION_STEPS = 64",
              "SCHEDULE_SEED = 666314",
              "from Numogram import TensorBasedNumogramSystem",
              "fda4127884f25d679fe563a7a70d56b63d5e33ff295fd53c38ef241bb002a391",
          ]
          for item in exact_strings:
              assert item in source, item

          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split(".")[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split(".")[0])

          forbidden = {
              "requests",
              "socket",
              "urllib",
              "httpx",
              "ProcessFieldMemory",
              "RenderTransport",
              "anthropic",
              "openai",
          }
          hits = sorted(imported & forbidden)
          assert not hits, hits

          print("P3.14R locked replication contract validated")
          PY

      - name: Seal build-time source fingerprints
        shell: bash
        run: |
          set -euo pipefail

          NUMOGRAM_SHA="$(sha256sum Numogram.py | awk '{print $1}')"
          EXPERIMENT_SHA="$(sha256sum P314RExperiment.py | awk '{print $1}')"
          PROTOCOL_FILE_SHA="$(sha256sum P314R_666_Replication_Protocol.md | awk '{print $1}')"

          {
            echo "P314R_NUMOGRAM_SHA=$NUMOGRAM_SHA"
            echo "P314R_EXPERIMENT_SHA=$EXPERIMENT_SHA"
            echo "P314R_PROTOCOL_FILE_SHA=$PROTOCOL_FILE_SHA"
          } >> "$GITHUB_ENV"

          echo "Numogram SHA-256: $NUMOGRAM_SHA"
          echo "Experiment SHA-256: $EXPERIMENT_SHA"
          echo "Protocol-file SHA-256: $PROTOCOL_FILE_SHA"

      - name: Create isolated Android-P3.14R project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/amelia/p314r \
            app/src/main/java/com/amelia/exp1r \
            app/src/main/python \
            app/src/main/res/values

          cp Numogram.py app/src/main/python/Numogram.py
          cp P314RExperiment.py app/src/main/python/P314RExperiment.py
          cp P314RExperimentBridge.kt \
            app/src/main/java/com/amelia/exp1r/P314RExperimentBridge.kt
          cp P314RMainActivity.kt \
            app/src/main/java/com/amelia/p314r/MainActivity.kt

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AmeliaAndroidP314R"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "16.1.0" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          fun quoted(value: String): String =
              "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\""

          val revision =
              (System.getenv("GITHUB_SHA") ?: "local").take(12)
          val numogramSha =
              System.getenv("P314R_NUMOGRAM_SHA") ?: "missing"
          val experimentSha =
              System.getenv("P314R_EXPERIMENT_SHA") ?: "missing"
          val protocolFileSha =
              System.getenv("P314R_PROTOCOL_FILE_SHA") ?: "missing"

          android {
              namespace = "com.amelia.p314r"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.amelia.p314r"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 15
                  versionName = "0.17-android-p3.14r-666-replication"

                  ndk {
                      abiFilters += listOf(
                          "armeabi-v7a",
                          "arm64-v8a"
                      )
                  }

                  buildConfigField(
                      "String",
                      "BUILD_REVISION",
                      quoted(revision)
                  )
                  buildConfigField(
                      "String",
                      "NUMOGRAM_SHA256",
                      quoted(numogramSha)
                  )
                  buildConfigField(
                      "String",
                      "EXPERIMENT_SHA256",
                      quoted(experimentSha)
                  )
                  buildConfigField(
                      "String",
                      "PROTOCOL_FILE_SHA256",
                      quoted(protocolFileSha)
                  )
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }

          chaquopy {
              defaultConfig {
                  version = "3.8"
                  buildPython("python3.8")

                  pip {
                      install("torch==1.8.1")
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:name="com.chaquo.python.android.PyApplication"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Amelia P3.14R</string>
          </resources>
          EOF

      - name: Validate P3.14R Android isolation
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'applicationId = "com.amelia.p314r"' app/build.gradle.kts

          if grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          then
            echo "FAIL: P3.14R must remain offline."
            exit 1
          fi

          cmp -s Numogram.py app/src/main/python/Numogram.py

          grep -Fq 'START / RESUME SEALED 666 REPLICATION' \
            app/src/main/java/com/amelia/p314r/MainActivity.kt
          grep -Fq 'Partial statistics: WITHHELD' \
            app/src/main/java/com/amelia/p314r/MainActivity.kt
          grep -Fq 'P3.14B topology/label-shuffle falsification' \
            app/src/main/python/P314RExperiment.py

          echo "P3.14R Android isolation contracts passed."

      - name: Build Android-P3.14R APK
        run: |
          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Record P3.14R build manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" Amelia-P3.14R-666-Replication.apk

          APK_SHA="$(sha256sum Amelia-P3.14R-666-Replication.apk | awk '{print $1}')"

          sha256sum \
            Numogram.py \
            P314RExperiment.py \
            P314RExperimentBridge.kt \
            P314RMainActivity.kt \
            P314R_666_Replication_Protocol.md \
            > p314r-source-sha256.txt

          cat > p314r-build-manifest.txt <<EOF
          Amelia Android P3.14R — 666 Fresh-Seed Replication
          ==================================================

          Revision:
          ${GITHUB_SHA}

          Antecedent P3.14A evidence:
          fda4127884f25d679fe563a7a70d56b63d5e33ff295fd53c38ef241bb002a391

          Package:
          com.amelia.p314r

          Fresh seeds:
          3001-3040

          Cohort A:
          3001-3020

          Cohort B:
          3021-3040

          Target:
          666

          Root-9 controls:
          all three-digit digital-root-9 integers excluding 333, 360 and 666

          Numogram SHA-256:
          ${P314R_NUMOGRAM_SHA}

          Experiment SHA-256:
          ${P314R_EXPERIMENT_SHA}

          Protocol-file SHA-256:
          ${P314R_PROTOCOL_FILE_SHA}

          APK SHA-256:
          ${APK_SHA}
          EOF

          cat p314r-build-manifest.txt

      - name: Upload Android-P3.14R artifact
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-Android-P3.14R-666-Replication
          path: |
            Amelia-P3.14R-666-Replication.apk
            p314r-build-manifest.txt
            p314r-source-sha256.txt
            P314R_666_Replication_Protocol.md
          retention-days: 14
