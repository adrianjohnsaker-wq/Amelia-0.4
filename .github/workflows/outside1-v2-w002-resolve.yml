name: OUTSIDE-1 v2 W002 resolve

on:
  push:
    branches: ["amelia-1.0"]
    paths:
      - ".github/workflows/outside1-v2-w002-resolve.yml"

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amelia-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: outside1-v2-private-through-w002-readings
          path: amelia-1/outside
          repository: ${{ github.repository }}
          run-id: 37153343292
          github-token: ${{ github.token }}
      - name: Seal rankings and draw W002 target
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0,os.path.abspath('outside'))
          import Outside1_v2_working as W
          W.seal_ranking('W002','R1',['D','B','C','A'])
          W.seal_ranking('W002','R2',['B','D','A','C'])
          fb=W.draw('W002')
          json.dump(fb,open('outside/w002-feedback.json','w'),ensure_ascii=False,indent=2)
          json.dump(W.public_status(),open('outside/w002-status.json','w'),sort_keys=True,indent=2)
          print(json.dumps(W.public_status(),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2-w002-feedback
          path: |
            amelia-1/outside/w002-feedback.json
            amelia-1/outside/w002-status.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2-private-through-w002
          path: amelia-1/outside/ledger_v2_workings.jsonl
          retention-days: 30