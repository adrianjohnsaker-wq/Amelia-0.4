name: OUTSIDE-1 v2 W001 prepare

on:
  push:
    branches: ["amelia-1.0"]
    paths:
      - ".github/workflows/outside1-v2-w001-prepare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amelia-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare W001 from operator cast
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, os.path.abspath("outside"))
          import Outside1_v2 as O
          import Outside1_v2_working as W
          O.check_registered()
          tosses="HHHHHTTHTHHTHTTHTTHHHTTHTHHTTHTT"
          assert len(tosses)==32 and set(tosses)<=set("HT")
          public=W.prepare("W001", tosses)
          json.dump(public, open("outside/w001-public.json","w"), ensure_ascii=False, indent=2)
          print("W001_PREPARED", tosses, "slots", sorted(public["slots"]))
          print("STATUS", json.dumps(W.public_status(), sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2-w001-public
          path: amelia-1/outside/w001-public.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2-w001-private-state
          path: amelia-1/outside/ledger_v2_workings.jsonl
          retention-days: 30
