name: OUTSIDE-1 v2.1 W007 seal readings

on:
  push:
    branches: ["amelia-1.0"]
    paths:
      - ".github/workflows/outside1-v2_1-w007-readings.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  readings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amelia-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: outside1-v2_1-private-through-W007-cast
          path: amelia-1/outside
          repository: ${{ github.repository }}
          run-id: 37234661873
          github-token: ${{ github.token }}
      - name: Seal exact W007 composition transcripts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,sys
          sys.path.insert(0,os.path.abspath("outside"))
          import Outside1_v2_1 as P
          import Outside1_v2_1_working as W

          method=P.language_method(
              provider="OpenAI",
              model="GPT-5.6 Sol",
              interface="ChatGPT text conversation",
              reasoning_effort="High",
              temperature_status="not exposed by ChatGPT interface",
              provider_request_id_status="not exposed by ChatGPT interface",
              generation_time_status="sealed in GitHub immediately after generation"
          )
          r1="Within one continuous arrangement, the plane of the third-eye stands beside the metallic ocean of the earth’s iron core, while limbic drift extends toward (meta)static pod-deliria and techno-immortalism. Beyond them are Hyperborean or Wendigo mythology and ‘delta-phase’ or terminal deliria, followed by missing time and alien abduction beside geoconvulsions. Further across the same scene appear the Gate of Pandemonium and prehuman cultures of the Old Ones, then the ultimate unutterable mystery of vocal nullity and the metallic ocean of the earth’s iron core. The elements remain in this exact order, joined only by direct spatial relations and continuation. Earlier elements remain nearer one another, later elements extend across the same scene, and nothing else is introduced beyond what was dealt."
          r2="Within one continuous arrangement, the plane of the third-eye stands beside (meta)static pod-deliria and techno-immortalism, while limbic drift extends toward the metallic ocean of the earth’s iron core. Beyond them are Hyperborean or Wendigo mythology and shallow seas, followed by dreams beside armored fish creatures. Further across the same scene appear enduring ideas, historical time and remembrance and (meta)static pod-deliria and techno-immortalism, then shallow seas and trance-states. The elements remain in this exact order, joined only by direct spatial relations and continuation. Earlier elements remain nearer one another, later elements extend across the same scene, and nothing else is introduced beyond what was dealt."
          e1=W.seal_reading("W007","R1",r1,method)
          e2=W.seal_reading("W007","R2",r2,method)

          public={
            "working":"W007",
            "reading_event_hashes":{"R1":e1["event_hash"],"R2":e2["event_hash"]},
            "R1":W.judge_material("W007","R1"),
            "R2":W.judge_material("W007","R2")
          }
          os.makedirs("outside/publication_v2_1/workings/W007",exist_ok=True)
          json.dump(public,open("outside/publication_v2_1/workings/W007/W007_JUDGE_PUBLIC.json","w"),
                    ensure_ascii=False,sort_keys=True,indent=2)
          json.dump(W.status(),open("outside/publication_v2_1/workings/W007/W007_STATUS_AFTER_READINGS.json","w"),
                    sort_keys=True,indent=2)
          print("R1_EVENT_HASH",e1["event_hash"])
          print("R2_EVENT_HASH",e2["event_hash"])
          print("STATUS",json.dumps(W.status(),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-W007-judge-public
          path: |
            amelia-1/outside/publication_v2_1/workings/W007/W007_JUDGE_PUBLIC.json
            amelia-1/outside/publication_v2_1/workings/W007/W007_STATUS_AFTER_READINGS.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-private-through-W007-readings
          path: amelia-1/outside/ledger_v2_1_publication.jsonl
          retention-days: 90
