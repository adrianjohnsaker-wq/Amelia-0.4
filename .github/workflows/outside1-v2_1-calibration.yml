name: OUTSIDE-1 v2.1 publication calibration materials

on:
  push:
    branches: ["amelia-1.0"]
    paths:
      - ".github/workflows/outside1-v2_1-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amelia-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify sealed registration and generate fresh calibration
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sys
          sys.path.insert(0,os.path.abspath("outside"))
          import Outside1_v2 as O
          import Outside1_v2_1 as P

          r=P.check_registration()
          for name,s in r["sources"].items():
              path=os.path.normpath(os.path.join("outside",s["path"]))
              got=hashlib.sha256(open(path,"rb").read()).hexdigest()
              assert got==s["sha256"],(name,got,s["sha256"])

          d1=P.diagnose_D1()
          assert d1["pass"],d1
          json.dump(d1,open("outside/outside1_v2_1_D1.json","w"),ensure_ascii=False,sort_keys=True,indent=2)

          d2=P.d2_panel()
          json.dump(d2,open("outside/outside1_v2_1_D2_panel.json","w"),ensure_ascii=False,sort_keys=True,indent=2)

          pc=[P.positive_control_public(i) for i in range(1,P.CONTROL_TRIALS+1)]
          json.dump(pc,open("outside/outside1_v2_1_PC_public.json","w"),ensure_ascii=False,sort_keys=True,indent=2)

          manifest={
            "created_utc":P.utc_now(),
            "series_id":P.SERIES_ID,
            "protocol_sha256":P.PROTOCOL_SHA256,
            "registration_sha256":r["registration_sha256"],
            "D1_sha256":hashlib.sha256(open("outside/outside1_v2_1_D1.json","rb").read()).hexdigest(),
            "D2_panel_sha256":hashlib.sha256(open("outside/outside1_v2_1_D2_panel.json","rb").read()).hexdigest(),
            "PC_public_sha256":hashlib.sha256(open("outside/outside1_v2_1_PC_public.json","rb").read()).hexdigest(),
          }
          json.dump(manifest,open("outside/outside1_v2_1_calibration_materials_manifest.json","w"),sort_keys=True,indent=2)
          print("D1_PASS",d1["mean_jaccard_canonical_null"],d1["rows_sha256"])
          print("D2_PANEL",len(d2))
          print("PC_TRIALS",len(pc))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-calibration-materials
          path: |
            amelia-1/outside/outside1_v2_1_D1.json
            amelia-1/outside/outside1_v2_1_D2_panel.json
            amelia-1/outside/outside1_v2_1_PC_public.json
            amelia-1/outside/outside1_v2_1_calibration_materials_manifest.json
          retention-days: 90
