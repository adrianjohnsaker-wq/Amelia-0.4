name: OUTSIDE-1 v2.1 W007 prepare

on:
  push:
    branches: ["amelia-1.0"]
    paths:
      - ".github/workflows/outside1-v2_1-w007-prepare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amelia-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pre-W007 seal and prepare first publication working
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0,os.path.abspath("outside"))
          import Outside1_v2_1 as P
          import Outside1_v2_1_working as W

          pre=json.load(open("outside/publication_v2_1/PRE_W007_AUDIT.json"))
          assert pre["status"]=="PASS"
          assert pre["publication_event_count"]==0
          assert pre["first_authorized_working"]=="W007"
          assert not os.path.exists(P.LEDGER)

          cast="HHTTTHHHTHHHHTTHHHHHTTTHTHTHTHTH"
          assert len(cast)==32 and set(cast)<=set("HT")
          public=W.prepare("W007",cast)

          os.makedirs("outside/publication_v2_1/workings/W007",exist_ok=True)
          json.dump(public,open("outside/publication_v2_1/workings/W007/W007_COMPOSITION_PUBLIC.json","w"),
                    ensure_ascii=False,sort_keys=True,indent=2)
          json.dump(W.status(),open("outside/publication_v2_1/workings/W007/W007_STATUS_AFTER_CAST.json","w"),
                    sort_keys=True,indent=2)
          print("W007_CAST_EVENT_HASH",public["cast_event_hash"])
          print("STATUS",json.dumps(W.status(),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-W007-public-after-cast
          path: |
            amelia-1/outside/publication_v2_1/workings/W007/W007_COMPOSITION_PUBLIC.json
            amelia-1/outside/publication_v2_1/workings/W007/W007_STATUS_AFTER_CAST.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-private-through-W007-cast
          path: amelia-1/outside/ledger_v2_1_publication.jsonl
          retention-days: 90
