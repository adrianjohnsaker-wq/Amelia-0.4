name: Amelia C1 independent live audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amelia-c1-continuous
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: amelia-1.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install frozen runtime requirements
        run: python -m pip install -r drift1a_c1/requirements.txt
      - name: Execute offline replay and independent RFC 3161 verification
        id: checks
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/c1-independent-audit"
          python -m drift1a_c1.cli replay --root drift1a_c1/recorded_live > "$RUNNER_TEMP/c1-independent-audit/replay.log" 2>&1
          replay_rc=$?
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('drift1a_c1/recorded_live/genesis.json').read_text())
          assert g['seal_attempt']=='baf03bf19a953d6b9cb4523239138e0a6cae4771f68b45cbf36a03f65acf969b'
          Path('/tmp/c1-seal-path').write_text(str(Path('drift1a_c1/recorded_live/genesis_attempts')/g['seal_attempt']/'seal'))
          PY
          seal_path="$(cat /tmp/c1-seal-path)"
          openssl ts -verify -queryfile "$seal_path/attempt-0000.tsq" -in "$seal_path/attempt-0000.tsr" -CAfile drift1a_c1/vendor/timing_trust/freetsa-ca.pem > "$RUNNER_TEMP/c1-independent-audit/openssl.log" 2>&1
          openssl_rc=$?
          echo "replay_rc=$replay_rc" >> "$GITHUB_OUTPUT"
          echo "openssl_rc=$openssl_rc" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/c1-independent-audit/replay.log"
          cat "$RUNNER_TEMP/c1-independent-audit/openssl.log"
      - name: Commit actual audit outputs to evidence only
        shell: bash
        env:
          REPLAY_RC: ${{ steps.checks.outputs.replay_rc }}
          OPENSSL_RC: ${{ steps.checks.outputs.openssl_rc }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time
          from pathlib import Path
          p=Path('drift1a_c1/evidence/LIVE-2026-10-18-genesis-recovery-audit-status.json')
          d=json.loads(p.read_text())
          d['scope']='GitHub metadata review followed by independent offline checks on the committed live record'
          for name,rc_key,logfile in [('replay','REPLAY_RC','replay.log'),('openssl_timestamp','OPENSSL_RC','openssl.log')]:
              rc=int(os.environ[rc_key])
              log=(Path(os.environ['RUNNER_TEMP'])/'c1-independent-audit'/logfile).read_text(errors='replace')
              d['pending_audits'][name].update(status='PASS' if rc==0 else 'FAIL',exit_code=rc,output=log,workflow_run=os.environ['GITHUB_RUN_ID'],executed_at_unix=time.time())
          d['limitations']=[x for x in d['limitations'] if not x.startswith('GitHub connector does not expose binary')]
          d['limitations'].append('Audit results are recorded verbatim with exit codes; a failed check is never reported as passing.')
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'Amelia C1 auditor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- drift1a_c1/evidence/LIVE-2026-10-18-genesis-recovery-audit-status.json
          git commit -m "C1: record independent replay and OpenSSL timestamp verification ($GITHUB_RUN_ID)"
          for attempt in 1 2 3; do
            git fetch origin amelia-1.0
            if ! git rebase origin/amelia-1.0; then git rebase --abort; exit 1; fi
            if git push origin HEAD:amelia-1.0; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          test "$REPLAY_RC" -eq 0
          test "$OPENSSL_RC" -eq 0
      - name: Preserve raw outputs regardless of check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amelia-C1-independent-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/c1-independent-audit/
          retention-days: 90
          if-no-files-found: warn
