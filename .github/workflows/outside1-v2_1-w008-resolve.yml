name: OUTSIDE-1 v2.1 W008 resolve

on:
  push:
    branches: ["amelia-1.0"]
    paths:
      - ".github/workflows/outside1-v2_1-w008-resolve.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amelia-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: outside1-v2_1-private-through-W008-readings
          path: amelia-1/outside
          repository: ${{ github.repository }}
          run-id: 37238346822
          github-token: ${{ github.token }}
      - name: Seal committed evaluation and resolve W008
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,sys
          sys.path.insert(0,os.path.abspath("outside"))
          import Outside1_v2_1 as P
          import Outside1_v2_1_working as W

          c=json.load(open("outside/publication_v2_1/workings/W008/W008_PREDRAW_COMMITMENT.json",encoding="utf-8"))
          assert c["phase"]=="EVALUATION_ORDER_FIXED_BEFORE_OUTCOME_SELECTION"
          assert c["outcome_selection_occurred"] is False

          m=c["method"]
          r1=c["evaluation_order"]["R1"]
          r2=c["evaluation_order"]["R2"]
          raw1=json.dumps({"ranking":r1},separators=(",",":"))
          raw2=json.dumps({"ranking":r2},separators=(",",":"))

          e1=W.seal_ranking("W008","R1",r1,m,raw1)
          e2=W.seal_ranking("W008","R2",r2,m,raw2)

          fb=W.draw("W008")
          z=W.find("resolved","W008")
          os.makedirs("outside/publication_v2_1/workings/W008",exist_ok=True)
          json.dump(fb,open("outside/publication_v2_1/workings/W008/W008_FEEDBACK_PUBLIC.json","w"),
                    ensure_ascii=False,sort_keys=True,indent=2)

          pub={
            "series_id":P.SERIES_ID,
            "working":"W008",
            "created_utc":z["created_utc"],
            "evaluation_commit_sha":"317217cf08080a1c1c022f53351a88a21e91d570",
            "ranking_event_hashes":{"R1":e1["event_hash"],"R2":e2["event_hash"]},
            "resolution_event_hash":z["event_hash"],
            "pre_draw_state_sha256":z["payload"]["pre_draw_state_sha256"],
            "target_draw_entropy_sha256":z["payload"]["target_draw"]["entropy_sha256"],
            "target_scene":fb["target_scene"],
            "ledger_sha256":P.file_sha256(P.LEDGER),
            "chain_ok":W.verify_chain(),
            "arm_identity":"sealed until W106 final analysis",
            "target_ranks":"sealed until W106 final analysis"
          }
          json.dump(pub,open("outside/publication_v2_1/workings/W008/W008_PUBLIC_COMMITMENT.json","w"),
                    ensure_ascii=False,sort_keys=True,indent=2)
          json.dump(W.status(),open("outside/publication_v2_1/workings/W008/W008_STATUS_RESOLVED.json","w"),
                    sort_keys=True,indent=2)
          print("RESOLUTION_EVENT_HASH",z["event_hash"])
          print("PRE_DRAW_STATE_SHA256",z["payload"]["pre_draw_state_sha256"])
          print("TARGET_DRAW_ENTROPY_SHA256",z["payload"]["target_draw"]["entropy_sha256"])
          print("STATUS",json.dumps(W.status(),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-W008-public-resolved
          path: |
            amelia-1/outside/publication_v2_1/workings/W008/W008_FEEDBACK_PUBLIC.json
            amelia-1/outside/publication_v2_1/workings/W008/W008_PUBLIC_COMMITMENT.json
            amelia-1/outside/publication_v2_1/workings/W008/W008_STATUS_RESOLVED.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-private-through-W008
          path: amelia-1/outside/ledger_v2_1_publication.jsonl
          retention-days: 90
