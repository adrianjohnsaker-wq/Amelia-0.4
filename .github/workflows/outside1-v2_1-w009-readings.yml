name: OUTSIDE-1 v2.1 W009 seal readings

on:
  push:
    branches: ["amelia-1.0"]
    paths:
      - ".github/workflows/outside1-v2_1-w009-readings.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  readings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amelia-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: outside1-v2_1-private-through-W009-cast
          path: amelia-1/outside
          repository: ${{ github.repository }}
          run-id: 37240190770
          github-token: ${{ github.token }}
      - name: Seal exact W009 composition transcripts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,sys
          sys.path.insert(0,os.path.abspath("outside"))
          import Outside1_v2_1 as P
          import Outside1_v2_1_working as W

          method=P.language_method(
              provider="OpenAI",
              model="GPT-5.6 Sol",
              interface="ChatGPT text conversation",
              reasoning_effort="High",
              temperature_status="not exposed by ChatGPT interface",
              provider_request_id_status="not exposed by ChatGPT interface",
              generation_time_status="sealed in GitHub immediately after generation"
          )
          r1="Within one continuous arrangement, limbic drift stands beside the plane of the third-eye, while turbular erosion extends toward cosmic swamp-labyrinths. Beyond them are dreams and (meta)static pod-deliria and techno-immortalism, followed by shallow seas beside ‘fold-type’ time-anomalies. Further across the same scene appear trance-states and the dead eye of the cyclone, then swirling nebulae and the dense void of the cosmic hypermatrix. The elements remain in this exact order, joined only by direct spatial relations and continuation. Earlier elements remain nearer one another, later elements extend across the same scene, and nothing else is introduced beyond what was dealt."
          r2="Within one continuous arrangement, crypt-navigation stands beside swirling nebulae, while the metallic ocean of the earth’s iron core extends toward limbic drift. Beyond them are (meta)static pod-deliria and techno-immortalism and cosmic swamp-labyrinths, followed by shallow seas beside dreams. Further across the same scene appear armored fish creatures and enduring ideas, historical time and remembrance, then (meta)static pod-deliria and techno-immortalism and shallow seas. The elements remain in this exact order, joined only by direct spatial relations and continuation. Earlier elements remain nearer one another, later elements extend across the same scene, and nothing else is introduced beyond what was dealt."
          e1=W.seal_reading("W009","R1",r1,method)
          e2=W.seal_reading("W009","R2",r2,method)

          public={
            "working":"W009",
            "reading_event_hashes":{"R1":e1["event_hash"],"R2":e2["event_hash"]},
            "R1":W.judge_material("W009","R1"),
            "R2":W.judge_material("W009","R2")
          }
          os.makedirs("outside/publication_v2_1/workings/W009",exist_ok=True)
          json.dump(public,open("outside/publication_v2_1/workings/W009/W009_JUDGE_PUBLIC.json","w"),
                    ensure_ascii=False,sort_keys=True,indent=2)
          json.dump(W.status(),open("outside/publication_v2_1/workings/W009/W009_STATUS_AFTER_READINGS.json","w"),
                    sort_keys=True,indent=2)
          print("R1_EVENT_HASH",e1["event_hash"])
          print("R2_EVENT_HASH",e2["event_hash"])
          print("STATUS",json.dumps(W.status(),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-W009-judge-public
          path: |
            amelia-1/outside/publication_v2_1/workings/W009/W009_JUDGE_PUBLIC.json
            amelia-1/outside/publication_v2_1/workings/W009/W009_STATUS_AFTER_READINGS.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-private-through-W009-readings
          path: amelia-1/outside/ledger_v2_1_publication.jsonl
          retention-days: 90
