name: OUTSIDE-1 v2.1 W007 target draw

on:
  push:
    branches: ["amelia-1.0"]
    paths:
      - ".github/workflows/outside1-v2_1-w007-draw.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  draw:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amelia-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: outside1-v2_1-private-through-W007-readings
          path: amelia-1/outside
          repository: ${{ github.repository }}
          run-id: 37234742709
          github-token: ${{ github.token }}
      - name: Seal committed blind rankings and draw target
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sys
          sys.path.insert(0,os.path.abspath("outside"))
          import Outside1_v2_1 as P
          import Outside1_v2_1_working as W

          c=json.load(open("outside/publication_v2_1/workings/W007/W007_RANKING_COMMITMENT.json",encoding="utf-8"))
          assert c["phase"]=="BLIND_RANKINGS_FIXED_BEFORE_TARGET_DRAW"
          assert c["target_draw_occurred"] is False

          m=c["method"]
          e1=W.seal_ranking("W007","R1",c["rankings"]["R1"],m,c["raw_outputs"]["R1"])
          e2=W.seal_ranking("W007","R2",c["rankings"]["R2"],m,c["raw_outputs"]["R2"])

          fb=W.draw("W007")
          z=W.find("resolved","W007")
          os.makedirs("outside/publication_v2_1/workings/W007",exist_ok=True)
          json.dump(fb,open("outside/publication_v2_1/workings/W007/W007_FEEDBACK_PUBLIC.json","w"),
                    ensure_ascii=False,sort_keys=True,indent=2)

          pub={
            "series_id":P.SERIES_ID,
            "working":"W007",
            "created_utc":z["created_utc"],
            "ranking_commit_sha":"95bdf642e3ed7671d72dac315f5656275f535f97",
            "ranking_event_hashes":{"R1":e1["event_hash"],"R2":e2["event_hash"]},
            "resolution_event_hash":z["event_hash"],
            "pre_draw_state_sha256":z["payload"]["pre_draw_state_sha256"],
            "target_draw_entropy_sha256":z["payload"]["target_draw"]["entropy_sha256"],
            "target_scene":fb["target_scene"],
            "ledger_sha256":P.file_sha256(P.LEDGER),
            "chain_ok":W.verify_chain(),
            "arm_identity":"sealed until W106 final analysis",
            "target_ranks":"sealed until W106 final analysis"
          }
          json.dump(pub,open("outside/publication_v2_1/workings/W007/W007_PUBLIC_COMMITMENT.json","w"),
                    ensure_ascii=False,sort_keys=True,indent=2)
          json.dump(W.status(),open("outside/publication_v2_1/workings/W007/W007_STATUS_RESOLVED.json","w"),
                    sort_keys=True,indent=2)
          print("RESOLUTION_EVENT_HASH",z["event_hash"])
          print("PRE_DRAW_STATE_SHA256",z["payload"]["pre_draw_state_sha256"])
          print("TARGET_DRAW_ENTROPY_SHA256",z["payload"]["target_draw"]["entropy_sha256"])
          print("STATUS",json.dumps(W.status(),sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-W007-public-resolved
          path: |
            amelia-1/outside/publication_v2_1/workings/W007/W007_FEEDBACK_PUBLIC.json
            amelia-1/outside/publication_v2_1/workings/W007/W007_PUBLIC_COMMITMENT.json
            amelia-1/outside/publication_v2_1/workings/W007/W007_STATUS_RESOLVED.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: outside1-v2_1-private-through-W007
          path: amelia-1/outside/ledger_v2_1_publication.jsonl
          retention-days: 90
