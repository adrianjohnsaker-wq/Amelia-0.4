name: P3.20 Developmental Accessibility Geometry

on:
  push:
    branches: ["p320-developmental-accessibility-geometry-20261030"]
    paths:
      - "FullNumogram.py"
      - "experiments/p316/DynamicNumogram.py"
      - "experiments/p317/run.py"
      - "experiments/p320/**"
      - ".github/workflows/p320.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p320-accessibility-geometry
  cancel-in-progress: false

jobs:
  assay:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p320-developmental-accessibility-geometry-20261030
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight
        run: |
          set -euo pipefail
          test "$(sha256sum FullNumogram.py | cut -d' ' -f1)" = "b6edbe76ab4929e93c01059fb56cef900effa9bca1cec78d0039eafb8fbebdf8"
          test "$(sha256sum experiments/p316/DynamicNumogram.py | cut -d' ' -f1)" = "ac482882858c1e47f578523452eff0bc20aa82b5978299c9c8808ff6127c5cd6"
          python -m py_compile experiments/p320/run.py
          python - <<'PY'
          import sys
          sys.path.insert(0,"experiments/p320")
          import run
          # Synthetic/non-registered checks only.
          probe=[0,1,2,3,4,5,6,7]*4
          records=[{"zone":z} for z in [1,2,3,6,3,6,3,6]*4]
          r=run.response_from_records(records,probe)
          assert len(r["path"])==32
          assert "1-2-3-6" in r["non_echo_positions"] or isinstance(r["non_echo_positions"],dict)
          gates=run.p317.rewired_gates(999320)
          assert run.p317.degree_signature(gates)==run.p317.degree_signature(run.p317.FULL_NUMOGRAM_GATES)
          assert run.p317.self_loop_count(gates)==run.p317.self_loop_count(run.p317.FULL_NUMOGRAM_GATES)
          print("P3.20 preflight PASS")
          PY
      - name: Record provenance
        run: |
          mkdir -p experiments/p320/results
          sha256sum FullNumogram.py experiments/p316/DynamicNumogram.py experiments/p317/run.py experiments/p320/REGISTRATION.md experiments/p320/AMENDMENT_1.md experiments/p320/run.py > experiments/p320/results/PRE_RUN_SHA256SUMS.txt
      - name: Run first registered P3.20 assay
        run: python experiments/p320/run.py --out experiments/p320/results | tee experiments/p320/results/console-summary.json
      - name: Display report
        run: |
          cat experiments/p320/results/REPORT.md
          sed -n '1,260p' experiments/p320/results/ATLAS.md
      - name: Commit compact result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/p320/results/REPORT.md experiments/p320/results/ATLAS.md experiments/p320/results/atlas.json experiments/p320/results/summary.json experiments/p320/results/PRE_RUN_SHA256SUMS.txt experiments/p320/results/console-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "P3.20: archive first accessibility geometry result [skip ci]"
            git push origin HEAD:p320-developmental-accessibility-geometry-20261030
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: P3.20-developmental-accessibility-geometry-evidence
          path: experiments/p320/results/
          retention-days: 90
